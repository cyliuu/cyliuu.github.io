<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 28</p><h2 id="c-028-title">行车路线动态分配</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>道路施工或拥堵可能让车载导航在行程中重新规划路线。新的途经点数量在规划结果出来前无法确定，存储空间要按当次需求申请，并在这条路线不再使用时归还。本案例把途经点简化为一组整数，演示从确定容量到释放内存的过程。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>读取途经点数量（例如 5），用 <code>new</code> 在堆上创建相应长度的 <code>int</code> 数组，以整数模拟坐标点。打印数组的起始地址验证分配，再用 <code>delete[]</code> 释放。</p>
<figure class="case-visual case-flow"><figcaption><span>运行时确定路线容量</span><span class="case-card-topic">动态数组</span></figcaption><dl class="case-fields"><div><dt>输入</dt><dd>途经点数量</dd></div><div><dt>分配</dt><dd><code>new[]</code></dd></div><div><dt>释放</dt><dd><code>delete[]</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 new[] 和 delete[] 动态管理内存

#include &lt;iostream&gt;

int main() {
    int num_waypoints = 0;

    // 与用户交互，获取需要的内存大小
    std::cout &lt;&lt; &quot;请输入本次路线规划需要的途经点数量: &quot;;
    std::cin &gt;&gt; num_waypoints;

    // 定义一个指针，准备接收动态分配内存的地址
    //    初始化为 nullptr 是一个好习惯，表示它暂时不指向任何地方
    int* route_points = nullptr;

    // 使用 new[] 关键字在堆上动态分配一块连续的内存
    //    这块内存的大小足以存放 num_waypoints 个整数
    //    new[] 操作会返回这块内存的起始地址
    route_points = new int[num_waypoints];

    std::cout &lt;&lt; &quot;\n----------------------------------------&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;内存分配成功！&quot; &lt;&lt; std::endl;
    // 打印指针存储的地址，这个地址位于堆区
    std::cout &lt;&lt; &quot;  - 路线数据的起始内存地址: &quot; &lt;&lt; route_points &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;----------------------------------------\n&quot; &lt;&lt; std::endl;

    // (可选) 模拟使用这块内存：用指针算术为其填充一些值
    for (int i = 0; i &lt; num_waypoints; ++i) {
        // *(route_points + i) 表示访问第 i 个整数的位置
        *(route_points + i) = (i + 1) * 10;
    }
    std::cout &lt;&lt; &quot;已为 &quot; &lt;&lt; num_waypoints &lt;&lt; &quot; 个途经点填充了模拟数据。&quot; &lt;&lt; std::endl;

    // 使用 delete[] 释放由 new[] 分配的数组
    //    这会将之前 new[] 申请的整块内存归还给操作系统
    delete[] route_points;

    std::cout &lt;&lt; &quot;\n路线内存已成功释放！&quot; &lt;&lt; std::endl;

    // 养成好习惯：释放后，将指针重新指向 nullptr，防止其成为&quot;悬挂指针&quot;
    route_points = nullptr;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>请输入本次路线规划需要的途经点数量: 5

----------------------------------------
内存分配成功！
  - 路线数据的起始内存地址: 0x104f6e910
----------------------------------------

已为 5 个途经点填充了模拟数据。

路线内存已成功释放！
</code></pre></figure></div></div></div><p>当程序被成功编译并运行，并输入 <code>5</code> 时，你将在控制台窗口看到类似以下的输出（内存地址会因每次运行而不同）。</p>
<p>程序根据用户的输入，成功地在运行时申请了一块大小不固定的内存；<code>new[]</code> 返回了一个内存地址，我们可以通过指针来持有和操作这块内存；<code>delete[]</code> 操作虽然在界面上没有直接的视觉反馈，但它是程序能长期稳定运行、不耗尽系统资源的关键保证。</p></div></div></article>

<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用二维数组定义并打印一个固定的红外传感器状态网格

#include &lt;iostream&gt;

int main() {
    // 定义一个const的4x4二维整型数组 ir_grid
    //    const 确保这组模拟数据在程序中是只读的，不可修改
    //    使用嵌套的花括号进行初始化，清晰地表示出二维结构

        {1, 1, 0, 0},

    //    外层循环变量 i 控制行，从第0行到第3行

            std::cout &lt;&lt; ir_grid[i][j] &lt;&lt; &quot; &quot;;

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 32</p><h2 id="c-032-title">C风格指令处理</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>有些车载诊断设备通过串口交换简短的 ASCII 指令。接收端读到一串字符后，要先确认它是否与协议中的命令完全匹配，再决定是否进入状态查询。本案例用控制台模拟接收一条指令，观察字符数组中的文本怎样存放，又怎样按内容进行比较。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 <code>char command[]</code> 保存用户输入，数组容量应足以容纳指令和终止符。通过 <code>&lt;cstring&gt;</code> 的 <code>strcmp</code> 判断指令是否为 <code>&quot;QUERY_STATUS&quot;</code>，分别提示已接收状态查询或命令未知。</p>
<figure class="case-visual case-flow"><figcaption><span>核对状态查询指令</span><span class="case-card-topic">C 风格字符串</span></figcaption><dl class="case-fields"><div><dt>输入</dt><dd>字符数组</dd></div><div><dt>目标指令</dt><dd><code>QUERY_STATUS</code></dd></div><div><dt>比较函数</dt><dd><code>strcmp</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 处理C风格的字符串指令

#include &lt;iostream&gt;
#include &lt;cstring&gt; // 必须包含此头文件以使用 strcmp 等C风格字符串工具

int main() {
    // 定义一个字符数组来存储C风格字符串
    //    大小设为50，确保有足够的空间存放指令和结尾的空字符&#x27;\0&#x27;
    char command[50];

    // 提示并接收用户输入的指令
    std::cout &lt;&lt; &quot;请输入传感器指令 (例如 QUERY_STATUS): &quot;;
    // std::cin 会读取一个单词，并在存入 command 数组后自动添加 &#x27;\0&#x27;
    std::cin &gt;&gt; command;

    // 比较指令字符串
    //    我们不能直接用 command == &quot;QUERY_STATUS&quot; 来比较，
    //    因为那比较的是内存地址，而不是字符串内容
    //    必须使用 strcmp (string compare) 工具
    //    - 如果两个字符串完全相同，strcmp 返回 0
    //    - 如果第一个字符串字典序大于第二个，返回正数
    //    - 如果第一个字符串字典序小于第二个，返回负数
    int compare_result = strcmp(command, &quot;QUERY_STATUS&quot;);

    std::cout &lt;&lt; &quot;\n--- 指令处理结果 ---&quot; &lt;&lt; std::endl;
    // 根据比较结果进行判断
    if (compare_result == 0) {
        std::cout &lt;&lt; &quot;状态查询指令 [QUERY_STATUS] 已被识别。&quot; &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;正在返回传感器状态...&quot; &lt;&lt; std::endl;
    } else {
        std::cout &lt;&lt; &quot;接收到未知指令: [&quot; &lt;&lt; command &lt;&lt; &quot;]&quot; &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;无操作被执行。&quot; &lt;&lt; std::endl;
    }

    return 0;
}
</code></pre></figure></div></div>

--- 指令处理结果 ---
接收到未知指令: [STOP]
无操作被执行。
</code></pre></figure></div></div></div><p>当程序被成功编译并运行后，根据用户输入的不同，将看到不同的结果。输入匹配的指令 <code>QUERY_STATUS</code> 时，输出“状态查询指令 [QUERY_STATUS] 已被识别。正在返回传感器状态...”；输入不匹配的指令（如 <code>RESET</code>）时，输出“接收到未知指令： [RESET]，无操作被执行。”程序成功地将用户输入的文本存储到了 <code>command</code> 这个字符数组中，<code>strcmp</code> 工具正确地比较了两个 C 风格字符串的内容，并根据返回值 0 实现了精确的逻辑判断。这证明了处理 C 风格字符串必须使用 <code>&lt;cstring&gt;</code> 中提供的专用工具，而不是常规的关系运算符 <code>==</code>。</p></div></div></article>
<article id="c-033" class="case-article" data-reading-sample="c-033" data-generated-case="true" aria-labelledby="c-033-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 33</p><h2 id="c-033-title">传感器参数解析</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>传感器配置指令可能在同一行文本中带上操作名、参数名和对应值。设置量程时，程序要先认出要执行的操作，再确定要改哪一项，最后交给配置模块使用。各部分以空格分隔，本案例用一条雷达量程设置指令练习提取这些信息。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>将 <code>std::string command</code> 初始化为 <code>&quot;SET_PARAM lidar_range 100&quot;</code>。用 <code>find()</code> 和 <code>substr()</code> 提取指令名 <code>SET_PARAM</code>、参数名 <code>lidar_range</code> 与参数值 <code>100</code>，分别存入字符串并打印。</p>
<figure class="case-visual case-flow"><figcaption><span>拆解传感器设置命令</span><span class="case-card-topic">std::string</span></figcaption><dl class="case-fields"><div><dt>命令</dt><dd><code>SET_PARAM</code></dd></div><div><dt>参数名</dt><dd><code>lidar_range</code></dd></div><div><dt>参数值</dt><dd><code>100</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 std::string 类解析复杂的传感器参数指令

#include &lt;iostream&gt;
#include &lt;string&gt; // 必须包含此头文件以使用 std::string

int main() {
    // 定义一个 std::string 对象来存储完整的指令
    std::string command = &quot;SET_PARAM lidar_range 100&quot;;
    std::cout &lt;&lt; &quot;原始指令: \&quot;&quot; &lt;&lt; command &lt;&lt; &quot;\&quot;&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;----------------------------------------&quot; &lt;&lt; std::endl;

    // 开始解析

    // 查找第一个空格的位置
    //    .find() 会返回找到的第一个字符的索引，如果找不到则返回一个特殊值
    size_t pos1 = command.find(&#x27; &#x27;);

    // 提取第一个部分（指令名）
    //    .substr(起始索引, 长度) 用于截取子字符串
    std::string command_name = command.substr(0, pos1);

    // 查找第二个空格的位置
    //    .find() 的第二个参数是查找的起始位置，我们从第一个空格之后开始找
    size_t pos2 = command.find(&#x27; &#x27;, pos1 + 1);

    // 提取第二个部分（参数名）
    //    子字符串的起始位置是第一个空格之后 (pos1 + 1)
    //    长度是第二个空格的位置减去第一个空格后的位置
    std::string param_name = command.substr(pos1 + 1, pos2 - (pos1 + 1));

    // 提取第三个部分（参数值）
    //    .substr() 如果只给一个参数（起始索引），它会一直截取到字符串末尾
    std::string param_value = command.substr(pos2 + 1);

    // 打印解析结果
    std::cout &lt;&lt; &quot;解析结果:&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;  - 指令名: &quot; &lt;&lt; command_name &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;  - 参数名: &quot; &lt;&lt; param_name &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;  - 参数值: &quot; &lt;&lt; param_value &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>原始指令: &quot;SET_PARAM lidar_range 100&quot;
----------------------------------------
解析结果:
  - 指令名: SET_PARAM
  - 参数名: lidar_range
  - 参数值: 100
</code></pre></figure></div></div></div><p>当程序被成功编译并运行后，你将在控制台窗口看到以下输出。</p>
<p><code>std::string</code> 的成员函数 <code>.find()</code> 和 <code>.substr()</code> 配合使用，提供了一种强大而灵活的字符串解析模式。整个过程无需关心内存分配、缓冲区大小或字符串结尾的 <code>\0</code> 字符，<code>std::string</code> 类自动处理了所有底层细节，让代码更安全、更易读，这与<a href="reading.html?task=t-p04-b02#c-032">案例 32「C风格指令处理」</a> 中处理 C 风格字符串的方式形成了鲜明对比。</p></div></div></article>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 34</p><h2 id="c-034-title">故障码列表管理</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>车载诊断系统发现异常时会生成故障码，数量会随一次测试中出现的情况变化。诊断人员既需要查看已经收集的记录，也可能在测试时撤销最近一条。程序要能随这些操作调整列表长度。本案例用模拟故障码练习动态列表的添加、移除和查询。</p>

<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 <code>std::vector&lt;int&gt;</code> 保存模拟故障码。在交互循环中，<code>add</code> 向末尾添加一个整数，<code>remove</code> 删除末尾一项，<code>show</code> 输出当前列表，<code>quit</code> 结束程序。</p>
<figure class="case-visual case-flow"><figcaption><span>诊断列表的交互操作</span><span class="case-card-topic">vector</span></figcaption><dl class="case-fields"><div><dt>添加</dt><dd><code>add</code></dd></div><div><dt>移除末项</dt><dd><code>remove</code></dd></div><div><dt>显示列表</dt><dd><code>show</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 std::vector 管理动态的故障码列表

#include &lt;iostream&gt;
#include &lt;vector&gt;   // 必须包含此头文件以使用 std::vector
#include &lt;string&gt;   // 包含此头文件以使用 std::string

int main() {
    // 定义一个 std::vector&lt;int&gt; 来存储故障码
    //    它初始为空，大小为0
    std::vector&lt;int&gt; fault_codes;
    std::string user_command;

    std::cout &lt;&lt; &quot;--- 车载诊断系统 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;可用指令: add &lt;故障码&gt;, remove, show, quit&quot; &lt;&lt; std::endl;

    // 启动一个循环，持续接收用户指令
    while (true) {
        std::cout &lt;&lt; &quot;\n&gt; &quot;;
        std::cin &gt;&gt; user_command;

        // 根据用户指令，执行相应操作
        if (user_command == &quot;add&quot;) {
            int code;
            std::cin &gt;&gt; code; // 读取要添加的故障码
            fault_codes.push_back(code); // 使用 .push_back() 在末尾添加元素
            std::cout &lt;&lt; &quot;成功添加故障码: &quot; &lt;&lt; code &lt;&lt; std::endl;

        } else if (user_command == &quot;remove&quot;) {
            if (fault_codes.empty()) { // 使用 .empty() 检查是否为空
                std::cout &lt;&lt; &quot;错误: 故障列表已空，无法移除。&quot; &lt;&lt; std::endl;
            } else {
                int last_code = fault_codes.back(); // .back() 可以获取最后一个元素
                fault_codes.pop_back(); // 使用 .pop_back() 移除最后一个元素
                std::cout &lt;&lt; &quot;成功移除故障码: &quot; &lt;&lt; last_code &lt;&lt; std::endl;
            }

        } else if (user_command == &quot;show&quot;) {
            std::cout &lt;&lt; &quot;--- 当前故障码列表 ---&quot; &lt;&lt; std::endl;
            if (fault_codes.empty()) {
                std::cout &lt;&lt; &quot;[列表为空]&quot; &lt;&lt; std::endl;
            } else {
                // 使用 .size() 获取当前元素数量来控制循环
                for (size_t i = 0; i &lt; fault_codes.size(); ++i) {
                    // 使用下标 [] 访问元素
                    std::cout &lt;&lt; &quot;  - &quot; &lt;&lt; fault_codes[i] &lt;&lt; std::endl;
                }
            }
            std::cout &lt;&lt; &quot;总数: &quot; &lt;&lt; fault_codes.size() &lt;&lt; std::endl;

        } else if (user_command == &quot;quit&quot;) {
            std::cout &lt;&lt; &quot;正在关闭诊断系统...&quot; &lt;&lt; std::endl;
            break; // 退出循环

        } else {
            std::cout &lt;&lt; &quot;未知指令，请重新输入。&quot; &lt;&lt; std::endl;
        }
    }

    return 0;
}

<article id="c-036" class="case-article" data-reading-sample="c-036" data-generated-case="true" aria-labelledby="c-036-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 36</p><h2 id="c-036-title">交通参与者建模</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>车辆、行人和骑行者都要进入感知模块的目标清单。三类目标有共同的编号，但车辆行驶速度、行人步行速度和骑行速度各有自己的含义。每条记录只对应一种目标，因此可以先用类型标明对象身份，再按该类型保存和读取相应数据。本案例据此组织一份统一的记录。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>定义 <code>enum class ObjectType</code>，包含 <code>VEHICLE</code>、<code>PEDESTRIAN</code>、<code>CYCLIST</code>。在 <code>TrafficParticipant</code> 中保存 <code>int id</code>、类型和一个 <code>union</code>。联合的三个 <code>float</code> 成员分别是 <code>speed</code>、<code>walking_speed</code>、<code>cycling_speed</code>。在 <code>main</code> 中创建至少两种目标，只读写各自对应的速度成员，并打印结果。</p>
<figure class="case-visual case-flow"><figcaption><span>用类型决定读取哪个字段</span><span class="case-card-topic">枚举与联合体</span></figcaption><dl class="case-fields"><div><dt>对象类别</dt><dd><code>ObjectType</code></dd></div><div><dt>共有信息</dt><dd>参与者编号</dd></div><div><dt>专属信息</dt><dd>按类别读取速度</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 enum、union 和 struct 实现交通参与者建模

#include &lt;iostream&gt;
#include &lt;string&gt;

// 使用 enum class 定义一个强类型的枚举 ObjectType
//    它为不同的参与者类型提供了清晰、安全的名称
enum class ObjectType {
    VEHICLE,
    PEDESTRIAN,
    CYCLIST
};

// 使用 union 定义一个数据联合 ParticipantData
//    它的所有成员共享同一块内存空间
union ParticipantData {
    float speed;
    float walking_speed;
    float cycling_speed;
};

// 使用 struct 定义最终的交通参与者结构
//    它将类型标签(type)和共享的数据(data_union)聚合在一起
struct TrafficParticipant {
    int id;
    ObjectType type;
    ParticipantData data_union;
};

int main() {
    // 创建并初始化一个车辆对象
    TrafficParticipant vehicle;
    vehicle.id = 101;
    // 记录交通参与者的类型
    vehicle.type = ObjectType::VEHICLE;
    // 根据类型给 union 中对应的成员赋值
    vehicle.data_union.speed = 88.5f;

    // 创建并初始化一个行人对象
    TrafficParticipant pedestrian;
    pedestrian.id = 202;
    pedestrian.type = ObjectType::PEDESTRIAN;
    pedestrian.data_union.walking_speed = 1.2f;

    // 打印信息进行验证
    std::cout &lt;&lt; &quot;--- 交通参与者信息 ---&quot; &lt;&lt; std::endl;

    // 打印车辆信息
    std::cout &lt;&lt; &quot;对象ID: &quot; &lt;&lt; vehicle.id &lt;&lt; std::endl;
    // 使用 switch (或者 if-else) 来根据类型解释 union 中的数据
    if (vehicle.type == ObjectType::VEHICLE) {
        std::cout &lt;&lt; &quot;  类型: 车辆&quot; &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;  行驶速度: &quot; &lt;&lt; vehicle.data_union.speed &lt;&lt; &quot; km/h&quot; &lt;&lt; std::endl;
    }

    std::cout &lt;&lt; &quot;------------------------&quot; &lt;&lt; std::endl;

    // 打印行人信息
    std::cout &lt;&lt; &quot;对象ID: &quot; &lt;&lt; pedestrian.id &lt;&lt; std::endl;
    if (pedestrian.type == ObjectType::PEDESTRIAN) {
        std::cout &lt;&lt; &quot;  类型: 行人&quot; &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;  步行速度: &quot; &lt;&lt; pedestrian.data_union.walking_speed &lt;&lt; &quot; m/s&quot; &lt;&lt; std::endl;
    }

    return 0;
}
</code></pre></figure></div></div>

<p>我们用一个统一的 <code>TrafficParticipant</code> 结构成功地表示了两种完全不同的实体。通过 <code>type</code> 这个“标签”，我们能够正确地解释 <code>data_union</code> 中存储的数据的含义。如果我们尝试用 <code>vehicle.data_union.walking_speed</code> 来访问车辆的速度，虽然能读出一个值，但这个值是无意义的，因为它已经被 <code>speed</code> 的数据覆盖了——这直观地展示了 <code>union</code> 内存共享的特性。</p></div></div></article>
<article id="c-037" class="case-article" data-reading-sample="c-037" data-generated-case="true" aria-labelledby="c-037-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 37</p><h2 id="c-037-title">日志文件读取</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>路测结束后，工程师可以用感知日志还原车辆沿途检测到的障碍物，检查哪些目标在什么距离出现。回放工具首先要把文件中的每行文本读成程序可使用的字段，并保留类型、距离和速度的对应关系。本案例从一份小型测试日志入手，验证这些数据能否完整读出。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 <code>&lt;fstream&gt;</code> 的 <code>std::ifstream</code> 打开项目目录下的 <code>obstacles.log</code>，并检查是否成功。用 <code>while</code> 读到文件末尾，每条解析并打印类型（<code>std::string</code>）、距离（<code>double</code>，米）、速度（<code>double</code>，米/秒）。下方数据可用于验证。</p>
<figure class="code-panel"><figcaption><span>示例</span></figcaption><pre tabindex="0"><code>Vehicle 50.5 10.2
Pedestrian 20.1 -1.5
Vehicle 150.8 0.0</code></pre></figure>
<figure class="case-visual case-flow"><figcaption><span>解析一行障碍物日志</span><span class="case-card-topic">输入文件流</span></figcaption><dl class="case-fields"><div><dt>输入文件</dt><dd><code>obstacles.log</code></dd></div><div><dt>字段</dt><dd>类型、距离、速度</dd></div><div><dt>读取方式</dt><dd>逐条解析</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 ifstream 读取并解析障碍物日志文件

#include &lt;iostream&gt;
#include &lt;fstream&gt;  // 必须包含此头文件以使用文件流
#include &lt;string&gt;   // 包含此头文件以使用 std::string
#include &lt;iomanip&gt;  // 包含此头文件用于格式化输出

#ifndef OBSTACLE_LOG_PATH
#define OBSTACLE_LOG_PATH &quot;obstacles.log&quot;
#endif

int main() {
    // 创建输入文件流并打开日志文件
    // CMake 构建时会注入文件的绝对路径；未注入时使用相对路径
    std::ifstream log_file(OBSTACLE_LOG_PATH);

    // 检查文件是否成功打开
    //    这是一个非常重要的好习惯，可以防止因文件不存在或无权限而导致的程序错误
    if (!log_file.is_open()) {
        std::cerr &lt;&lt; &quot;错误: 无法打开日志文件 &quot;
                  &lt;&lt; OBSTACLE_LOG_PATH &lt;&lt; std::endl;
        return 1; // 返回一个非零值，表示程序异常退出
    }

    std::cout &lt;&lt; &quot;日志文件打开成功，开始解析数据...&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;----------------------------------------&quot; &lt;&lt; std::endl;

    // 准备用于存储从文件中读取的数据的变量
    std::string type;
    double distance;
    double speed;
    int count = 0;

    // 使用 while 循环逐个数据项读取文件，直到文件末尾
    //    (log_file &gt;&gt; type &gt;&gt; distance &gt;&gt; speed) 这个表达式本身会返回一个状态，
    //    当成功读取所有三项数据时，状态为真，循环继续;
    //    当到达文件末尾或读取失败时，状态为假，循环结束
    while (log_file &gt;&gt; type &gt;&gt; distance &gt;&gt; speed) {
        count++;
        std::cout &lt;&lt; &quot;  [障碍物 &quot; &lt;&lt; count &lt;&lt; &quot;]&quot; &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;    类型: &quot; &lt;&lt; type &lt;&lt; std::endl;
        std::cout &lt;&lt; std::fixed &lt;&lt; std::setprecision(1); // 格式化输出
        std::cout &lt;&lt; &quot;    距离: &quot; &lt;&lt; distance &lt;&lt; &quot; m&quot; &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;    速度: &quot; &lt;&lt; speed &lt;&lt; &quot; m/s&quot; &lt;&lt; std::endl;
    }

    std::cout &lt;&lt; &quot;----------------------------------------&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;文件解析完成，共找到 &quot; &lt;&lt; count &lt;&lt; &quot; 个障碍物。&quot; &lt;&lt; std::endl;

    // 关闭文件
    //    虽然 ifstream 对象在离开作用域时会自动关闭文件（RAII特性），
    //    但显式调用 .close() 是一个清晰的好习惯
    log_file.close();

    return 0;
}
</code></pre></figure></div><a class="row-action case-download" href="downloads/materials/c-037/obstacles.log" download="obstacles.log">下载 obstacles.log ↓</a></div>

</code></pre></figure></div></div></div><p>配套的 <code>obstacles.log</code> 已保存在案例目录中，CMake 构建时会将其绝对路径注入程序，因此可从任意工作目录运行。程序成功解析示例日志后，控制台输出。</p>

<article id="c-038" class="case-article" data-reading-sample="c-038" data-generated-case="true" aria-labelledby="c-038-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 38</p><h2 id="c-038-title">障碍物信息保存</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>路测记录程序可能在同一天多次启动，例如停车检查后继续采集。工程师希望把前后几段检测结果放在同一份日志中，便于按记录顺序回看。如果重新启动时清空了旧文件，就会丢掉之前采集的数据。本案例通过两次运行检查新记录能否接在原有记录后面。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 <code>std::ofstream</code> 和 <code>std::ios::app</code> 将记录追加到当前工作目录的 <code>detection_log.txt</code>。启动时提示文件名，打开失败时报告并退出，正常退出时关闭文件并提示保存。</p>
<ul><li>依次输入类型和距离（米），每项按 Enter。类型不含空格，距离采用给定的合法数值。仅在类型处输入 <code>quit</code> 退出，不再询问距离，也不写入该指令。</li><li>每条独占一行，如 <code>类型: Vehicle, 距离: 45.8m</code>。此日志供人工查看，只有类型和距离。后续三字段数据练习使用另一文件。</li><li>使用独立测试目录。首次运行前应没有同名日志，已有文件先另存。首轮写两条并退出，保留文件；次轮写一条再退出。核对共三行，原两行内容和顺序保持不变，新记录在末尾。</li></ul>

#include &lt;iostream&gt;
#include &lt;fstream&gt;  // 必须包含此头文件以使用文件流
#include &lt;string&gt;   // 包含此头文件以使用 std::string

    // 定义一个 ofstream (output file stream) 对象
    // 第二个参数 std::ios::app 使文件以追加模式打开

    if (!log_file.is_open()) {

    std::cout &lt;&lt; &quot;请输入障碍物类型 (输入 &#x27;quit&#x27; 结束): &quot;;

    // 准备用于接收用户输入的变量
    std::string type;
    double distance;

    // 启动一个循环，持续接收用户输入并写入文件
    while (std::cin &gt;&gt; type &amp;&amp; type != &quot;quit&quot;) {
        std::cout &lt;&lt; &quot;请输入该障碍物的距离 (米): &quot;;
        std::cin &gt;&gt; distance;

        // 将格式化的数据写入文件
        //    操作方式与 std::cout 完全一样！
        log_file &lt;&lt; &quot;类型: &quot; &lt;&lt; type &lt;&lt; &quot;, 距离: &quot; &lt;&lt; distance &lt;&lt; &quot;m&quot; &lt;&lt; std::endl;

        std::cout &lt;&lt; &quot;  -&gt; 记录已保存！&quot; &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;\n请输入下一个障碍物类型 (输入 &#x27;quit&#x27; 结束): &quot;;
    }

    // 关闭文件，确保所有缓冲区中的数据都被写入磁盘
    log_file.close();

    std::cout &lt;&lt; &quot;\n系统已退出。所有检测记录已保存到 detection_log.txt。&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>

<article id="c-ext-d1" class="case-article" data-reading-sample="c-ext-d1" data-generated-case="true" aria-labelledby="c-ext-d1-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">拓展案例 D1</p><h2 id="c-ext-d1-title">3D坐标变换</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>同一个障碍物在车顶雷达和摄像头的测量结果中，坐标可能不同，因为两台设备各自使用自己的参考系。融合数据前，需要把各设备测得的位置换到统一坐标系，才能判断它们是否指向同一个目标。本案例从一次绕轴旋转入手，用 Eigen 验证坐标怎样随参考系关系变化。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>配置 Eigen 头文件路径，用 <code>Eigen::Vector3d</code> 表示点 <code>(1.0, 0.0, 0.0)</code>，用 <code>Eigen::Matrix3d</code> 表示绕 Z 轴旋转 90 度的矩阵。将矩阵乘以向量，打印变换前后坐标。旋转矩阵三行依次为 <code>[cosθ, -sinθ, 0]</code>、<code>[sinθ, cosθ, 0]</code>、<code>[0, 0, 1]</code>。</p>
<figure class="case-visual case-flow"><figcaption><span>三维点的绕轴旋转</span><span class="case-card-topic">Eigen</span></figcaption><dl class="case-fields"><div><dt>初始点</dt><dd><code>(1, 0, 0)</code></dd></div><div><dt>旋转</dt><dd>绕 Z 轴 <code>90°</code></dd></div><div><dt>结果</dt><dd>约 <code>(0, 1, 0)</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 Eigen 实现 3D 坐标变换

#include &lt;iostream&gt;
#include &lt;cmath&gt; // 用于 M_PI (圆周率) 和三角函数

// 引入 Eigen 的主头文件
#include &lt;Eigen/Dense&gt;

int main() {
    // 定义一个三维点向量
    //    Vector3d 是 Eigen::Matrix&lt;double, 3, 1&gt; 的别名
    Eigen::Vector3d point(1.0, 0.0, 0.0);

    // 定义旋转角度 (90度) 并转换为弧度
    double angle_degrees = 90.0;
    double angle_radians = angle_degrees * M_PI / 180.0;

    // 创建绕Z轴的旋转矩阵
    //    Matrix3d 是 Eigen::Matrix&lt;double, 3, 3&gt; 的别名
    Eigen::Matrix3d rotation_matrix;
    // 使用逗号初始化器，按行优先顺序填充矩阵
    rotation_matrix &lt;&lt; cos(angle_radians), -sin(angle_radians), 0,
                       sin(angle_radians),  cos(angle_radians), 0,
                       0,                   0,                  1;

    // 执行坐标变换：旋转后的点 = 旋转矩阵 * 原始点
    Eigen::Vector3d rotated_point = rotation_matrix * point;

    // 打印结果
    std::cout &lt;&lt; &quot;--- 3D坐标变换 (绕Z轴旋转90度) ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;原始点坐标 P:\n&quot; &lt;&lt; point &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;\n旋转矩阵 Rz(90):\n&quot; &lt;&lt; rotation_matrix &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;\n旋转后点坐标 P&#x27; = Rz * P:\n&quot; &lt;&lt; rotated_point &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 3D坐标变换 (绕Z轴旋转90度) ---
原始点坐标 P:
1
0
0

6.12323e-17          -1           0
          1 6.12323e-17           0
          0           0           1

旋转后点坐标 P&#x27; = Rz * P:
6.12323e-17
          1
          0
</code></pre></figure></div></div></div><p>当程序被成功编译并运行后，你将在控制台窗口看到以下输出（由于浮点数精度，<code>6.12323e-17</code> 是一个非常接近 0 的数）。</p>
<p>原始点 <code>(1, 0, 0)</code> 位于 X 轴上，绕 Z 轴旋转 90 度后应该移动到 Y 轴上，坐标变为 <code>(0, 1, 0)</code>，程序的输出结果与物理直觉完全一致。最重要的是，我们通过 <code>rotated_point = rotation_matrix * point;</code> 这样一行代码就完成了一个复杂的 3D 旋转运算，直观地展示了使用专业数学库进行开发的巨大便利性和代码的可读性。</p></div></div></article>

<article id="c-ai-e" class="case-article" data-reading-sample="c-ai-e" data-generated-case="true" data-aigc-sample="true" aria-labelledby="c-ai-e-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 E</p><h2 id="c-ai-e-title">AIGC核心功能实现</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3><p>随着车载应用的功能不断丰富，若将全部逻辑放在一个主函数中，代码会逐渐变得难以阅读、测试和维护。面向过程设计强调“分而治之”，把复杂问题拆分为职责清晰、能够协作的功能模块。本案例让你扮演“系统设计师”，借助 AIGC 把自适应巡航的速度决策组织为独立函数，观察功能分解如何改善程序结构与复用能力。</p></div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3><p>使用 AIGC 工具，根据自适应巡航规则生成计算目标车速的 C++ 函数。向工具明确函数名称、当前车速和前车距离两个输入参数、目标车速返回值，以及不同距离区间的计算逻辑。对照远距离、跟车距离和近距离场景验证结果，分析函数的职责、输入与输出，为后续 <code>main</code> 函数的功能拆分作准备。</p><figure class="case-visual case-flow"><figcaption><span>巡航规则如何变成函数</span><span class="case-card-topic">分段与边界</span></figcaption><dl class="case-fields"><div><dt>输入</dt><dd>当前车速与前车距离</dd></div><div><dt>返回</dt><dd>目标车速</dd></div><div><dt>核验</dt><dd>远距、跟车与近距</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><section class="case-prompt"><h4>提示词（Prompt）</h4><div class="case-prompt-body"><p>我需要你扮演一名专业的 C++ 软件工程师。请为我编写一个用于自动驾驶自适应巡航控制的核心功能函数。</p>
<p>函数要求如下：</p>
<ol><li>函数名为 <code>calculate_target_speed</code>。</li><li>它接收两个 <code>double</code> 类型的参数 <code>current_speed</code>（当前车速，km/h）和 <code>distance_to_front_car</code>（与前车的距离，m）。</li><li>它返回一个 <code>double</code> 类型的目标车速（km/h）。</li></ol>
<p>函数内部的逻辑如下：</p>
<ol><li>如果与前车的距离大于 100 米，则目标速度为最高限速 120 km/h。</li><li>如果距离在 50 米到 100 米之间（含边界），则目标速度为保持当前速度不变。</li><li>如果距离小于 50 米，则目标速度为当前速度的 80%（乘以 0.8），以进行减速。</li></ol>
<p>请生成完整的、包含必要头文件和注释的 C++ 函数代码。</p></div></section></div>
<div class="case-result"><h3>运行效果</h3><div class="aigc-response case-method-compact"><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>#include &lt;iostream&gt;

/**
 * @brief 根据与前车的距离计算自适应巡航的目标速度
 * @param current_speed 当前车速 (km/h)
 * @param distance_to_front_car 与前方车辆的距离 (m)
 * @return double 计算出的目标车速 (km/h)
 */
double calculate_target_speed(double current_speed, double distance_to_front_car) {
    const double MAX_SPEED = 120.0;

    if (distance_to_front_car &gt; 100.0) {
        // 距离安全，可以加速到最高限速
        return MAX_SPEED;
    } else if (distance_to_front_car &gt;= 50.0) {
        // 距离适中，保持当前速度跟车
        return current_speed;
    } else {
        // 距离过近，需要减速，目标速度为当前速度的80%
        return current_speed * 0.8;
    }
}

// 用于测试的 main 函数

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 40</p><h2 id="c-040-title">车辆轨迹预测</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>决策模块在减速、变道前，需要估计其他车辆过几秒会到哪里。真实场景里的速度变化很复杂，本案例先假设车辆沿直线匀加速，将预测按一秒一步推进。每一步根据当前状态得到下一秒的位置和速度，再用新状态继续预测，直到到达要观察的时刻。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用递归实现 <code>predict_distance</code>，参数为 <code>current_pos</code>（米）、<code>current_speed</code>（米/秒）、<code>acceleration</code>（米/秒²）和 <code>seconds_left</code>（秒）。剩余时间为 0 时返回当前位置；否则计算一秒后的新位置和速度，并递归处理剩余 <code>seconds_left - 1</code> 秒。</p>
<figure class="case-visual case-flow"><figcaption><span>逐秒推算车辆位置</span><span class="case-card-topic">递归</span></figcaption><dl class="case-fields"><div><dt>输入</dt><dd>位置、速度与加速度</dd></div><div><dt>递推</dt><dd>更新下一秒状态</dd></div><div><dt>终止</dt><dd>剩余时间为 <code>0 s</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用递归函数预测车辆的未来轨迹

#include &lt;iostream&gt;

// 函数声明 (可选，但良好的编程习惯)
double predict_distance(double current_pos, double current_speed, double acceleration, int seconds_left);

int main() {
    double initial_position = 0.0;     // 初始位置 (m)
    double initial_speed = 10.0;       // 初始速度 (m/s)
    double constant_acceleration = 2.0; // 固定加速度 (m/s^2)
    int prediction_time = 3;           // 预测未来3秒

    std::cout &lt;&lt; &quot;--- 车辆轨迹预测 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;初始状态： 位置=&quot; &lt;&lt; initial_position &lt;&lt; &quot;m, 速度=&quot; &lt;&lt; initial_speed &lt;&lt; &quot;m/s&quot; &lt;&lt; std::endl;

    // 调用递归函数
    double final_position = predict_distance(initial_position, initial_speed, constant_acceleration, prediction_time);

    std::cout &lt;&lt; &quot;\n预测结果： &quot; &lt;&lt; prediction_time &lt;&lt; &quot;秒后， 车辆将到达位置 &quot; &lt;&lt; final_position &lt;&lt; &quot; 米&quot; &lt;&lt; std::endl;

    return 0;
}

// 递归函数的定义
double predict_distance(double current_pos, double current_speed, double acceleration, int seconds_left) {

    std::cout &lt;&lt; &quot;正在计算剩余 &quot; &lt;&lt; seconds_left &lt;&lt; &quot; 秒... (当前位置： &quot; &lt;&lt; current_pos &lt;&lt; &quot;)&quot; &lt;&lt; std::endl;

    // 终止条件 (Base Case): 当没有时间需要预测时，直接返回当前位置
    if (seconds_left &lt;= 0) {
        std::cout &lt;&lt; &quot;  -&gt; 命中终止条件，返回最终位置。&quot; &lt;&lt; std::endl;
        return current_pos;
    }

    // 递推关系 (Recursive Step):

    // a. 计算未来1秒内行驶的距离
    //    公式：distance = v0*t + 0.5*a*t^2，且 t=1
    double distance_in_one_sec = current_speed * 1.0 + 0.5 * acceleration * 1.0 * 1.0;

    // b. 计算1秒后的新位置和新速度
    double next_pos = current_pos + distance_in_one_sec;
    double next_speed = current_speed + acceleration * 1.0;

    // c. 调用自身，用新的状态去预测剩下的 (seconds_left - 1) 秒
    return predict_distance(next_pos, next_speed, acceleration, seconds_left - 1);
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 车辆轨迹预测 ---

正在计算剩余 2 秒... (当前位置： 11)
正在计算剩余 1 秒... (当前位置： 24)
正在计算剩余 0 秒... (当前位置： 39)

预测结果： 3秒后， 车辆将到达位置 39 米
</code></pre></figure></div></div></div><p>当程序被成功编译并运行后，控制台将清晰地展示出递归调用的“递推”过程和最终的计算结果。</p>
<p>程序首先从 <code>seconds_left = 3</code> 开始调用；它计算出 1 秒后的位置（<code>0 + 10*1 + 0.5*2*1 = 11</code>）和速度（<code>10 + 2 = 12</code>），然后用新状态调用自身，处理剩下的 2 秒；这个过程不断重复，直到 <code>seconds_left</code> 变为 0，命中终止条件，开始逐层返回最终结果。这个输出清晰地展示了递归是如何将一个复杂问题（预测 3 秒）分解为一系列简单的小问题（每次只预测 1 秒）来解决的。</p></div></div></article>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 41</p><h2 id="c-041-title">数据归一化</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>感知程序可能同时处理雷达距离和图像亮度，两类读数的量纲和取值范围不同。如果直接用原始数值做对比，数值较大的一类可能影响后续计算。把各项读数换算到统一范围后，更便于交给后续算法。本案例用一个雷达读数演示归一化，并观察引用参数怎样更新原变量。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>定义 <code>void normalize(float&amp; value, float min_value, float max_value)</code>，按 <code>(value - min_value) / (max_value - min_value)</code> 将区间内的值缩放到 [0, 1]，直接写回 <code>value</code>。用 [10, 90] 米范围内的模拟读数测试，打印调用前后的原变量。</p>
<figure class="case-visual case-flow"><figcaption><span>在原变量上归一化</span><span class="case-card-topic">引用传参</span></figcaption><dl class="case-fields"><div><dt>读数</dt><dd><code>float&amp; value</code></dd></div><div><dt>边界</dt><dd>最小值与最大值</dd></div><div><dt>目标区间</dt><dd><code>[0, 1]</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用引用传参，就地修改变量以实现数据归一化

#include &lt;iostream&gt;
#include &lt;iomanip&gt;

// 函数定义
// 功能： 对一个浮点数进行最小-最大规范化，缩放到[0, 1]区间
// 参数：
//   - value: 需要被归一化的数 (通过引用传递，会被直接修改)
//   - min_value: 原始数据范围的最小值
//   - max_value: 原始数据范围的最大值
void normalize(float&amp; value, float min_value, float max_value) {
    // 检查分母是否为零，避免除零错误
    if (max_value - min_value == 0) {
        value = 0; // 或者根据业务逻辑处理
        return;
    }

    // 直接修改传入的 value 变量
    value = (value - min_value) / (max_value - min_value);
}

int main() {
    // 模拟一个雷达传感器读数，其有效范围是 10.0米 到 90.0米
    const float LIDAR_MIN_RANGE = 10.0f;
    const float LIDAR_MAX_RANGE = 90.0f;
    float sensor_reading = 50.0f; // 当前的测量值

    std::cout &lt;&lt; &quot;--- 传感器数据归一化 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; std::fixed &lt;&lt; std::setprecision(4); // 设置输出格式

    std::cout &lt;&lt; &quot;调用 normalize 函数前， 原始读数： &quot; &lt;&lt; sensor_reading &lt;&lt; std::endl;

    // 调用函数。因为是引用传参，函数将直接操作 sensor_reading 变量
    normalize(sensor_reading, LIDAR_MIN_RANGE, LIDAR_MAX_RANGE);

    std::cout &lt;&lt; &quot;调用 normalize 函数后， 归一化读数： &quot; &lt;&lt; sensor_reading &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 传感器数据归一化 ---
调用 normalize 函数前， 原始读数： 50.0000
调用 normalize 函数后， 归一化读数： 0.5000
</code></pre></figure></div></div></div><p>当程序被成功编译并运行后，控制台将清晰地展示出变量在函数调用前后值的变化。</p>
<p>在调用 <code>normalize</code> 函数之前，<code>sensor_reading</code> 的值是 <code>50.0</code>；我们将 <code>sensor_reading</code> 传递给函数，由于函数参数 <code>float&amp; value</code> 是一个引用，<code>value</code> 成为了 <code>sensor_reading</code> 在函数内部的一个别名，它们指向的是同一块内存；函数内部对 <code>value</code> 的修改 <code>value = (50.0 - 10.0) / (90.0 - 10.0);</code>，实际上就是直接对 <code>main</code> 函数中的 <code>sensor_reading</code> 进行了修改。因此，当函数返回后，<code>sensor_reading</code> 的值永久地变成了 <code>0.5</code>，这证明了引用传参能够实现对外部数据的“就地”修改。</p></div></div></article>
<article id="c-042" class="case-article" data-reading-sample="c-042" data-generated-case="true" aria-labelledby="c-042-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 42</p><h2 id="c-042-title">决策日志打印</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>调试驾驶决策时，工程师需要知道车辆为什么减速、变道或维持当前状态。多数情况可以按普通级别记录，遇到紧急事件则需要在日志里显式标记，以便回查时快速定位。本案例为日志接口设置默认级别，让日常调用保持简洁，同时保留指定级别的入口。</p>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 44</p><h2 id="c-044-title">角度弧度转换</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>雷达和定位模块给出的方向角常以度为单位，而用于坐标计算的 C++ 三角函数以弧度接收角度。如果每处都临时换算，容易在不同调用位置混用单位。将换算集中到一个短函数后，可以反复使用同一规则。本案例用几个常见角度核对这个转换函数。</p>

<figure class="case-visual case-flow"><figcaption><span>转向角的单位换算</span><span class="case-card-topic">inline 函数</span></figcaption><dl class="case-fields"><div><dt>输入</dt><dd>角度</dd></div><div><dt>换算</dt><dd><code>角度 × π / 180</code></dd></div><div><dt>输出</dt><dd>弧度</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用内联函数高效地进行角度到弧度的转换

#include &lt;iostream&gt;
#include &lt;iomanip&gt; // 用于格式化输出

// 定义一个高精度的PI常量
const double PI = 3.14159265358979323846;

// 定义内联函数
// inline 关键字建议编译器将函数体在调用处直接展开，以消除函数调用开销
// 这对于像 to_radians 这样简短且需要被频繁调用的函数，能有效提升性能
inline double to_radians(double degrees) {
    return degrees * PI / 180.0;
}

int main() {
    std::cout &lt;&lt; &quot;--- 角度弧度转换 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; std::fixed &lt;&lt; std::setprecision(6); // 设置输出格式

    // 多次调用内联函数
    double angle1 = 30.0;
    double angle2 = 90.0;
    double angle3 = 180.0;

    double radians1 = to_radians(angle1);
    double radians2 = to_radians(angle2);
    double radians3 = to_radians(angle3);

    // 打印结果
    std::cout &lt;&lt; angle1 &lt;&lt; &quot; 度 = &quot; &lt;&lt; radians1 &lt;&lt; &quot; 弧度&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; angle2 &lt;&lt; &quot; 度 = &quot; &lt;&lt; radians2 &lt;&lt; &quot; 弧度&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; angle3 &lt;&lt; &quot; 度 = &quot; &lt;&lt; radians3 &lt;&lt; &quot; 弧度&quot; &lt;&lt; std::endl;

    // 模拟在循环中频繁调用
    double sum_of_radians = 0.0;
    for(int i = 0; i &lt; 1000000; ++i) {
        sum_of_radians += to_radians(1.0); // 在性能敏感的循环中调用
    }
    std::cout &lt;&lt; &quot;\n模拟百万次调用完成。&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 角度弧度转换 ---

模拟百万次调用完成。
</code></pre></figure></div></div></div><p>当程序被成功编译并运行后，控制台将显示精确的转换结果。</p>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 45</p><h2 id="c-045-title">内部函数封装</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>仿真工程常把数学计算、日志等功能分别放在不同源文件中。每个模块除了公开接口，还有只供自身调用的辅助函数。如果两个模块都定义了同名的外部函数，链接时可能冲突。本案例用一个求平均值的模块观察哪些函数应对外开放，哪些应留在实现文件内。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>在 <code>math_utils.h</code> 声明 <code>double average(const double arr[], int size)</code>。在 <code>math_utils.cpp</code> 实现它，并用同文件内的 <code>static double sum(const double arr[], int size)</code> 求和。在 <code>main.cpp</code> 验证能调用 <code>average</code>，再尝试声明并直接调用 <code>sum</code>，观察链接错误。</p>
<figure class="case-visual case-flow"><figcaption><span>数学模块的接口边界</span><span class="case-card-topic">内部链接</span></figcaption><dl class="case-fields"><div><dt>公开接口</dt><dd><code>average</code></dd></div><div><dt>内部辅助</dt><dd>求和函数</dd></div><div><dt>使用入口</dt><dd><code>math_utils.h</code></dd></div></dl></figure></section></header>

#include &lt;iostream&gt;
#include &quot;math_utils.h&quot; // 包含模块的头文件

// 尝试声明在另一个文件中定义的静态函数（这将导致链接失败）
// extern double sum(const double arr[], int size);

int main() {
    double sensor_readings[] = {10.5, 11.0, 9.8, 10.2, 11.5};
    int count = 5;

    // 成功调用外部函数 average，因为它的声明在头文件中是公开的
    double avg_reading = average(sensor_readings, count);
    std::cout &lt;&lt; &quot;传感器的平均读数是： &quot; &lt;&lt; avg_reading &lt;&lt; std::endl;

    // 如果取消上面 extern double sum(...) 的注释并尝试调用，就会在链接阶段报错
    // double total = sum(sensor_readings, count); // Linker Error!

}
</code></pre></figure><figure class="code-panel" data-code-language="cpp"><figcaption><span>math_utils.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 实现了math_utils模块的功能

#include &quot;math_utils.h&quot;

// 定义一个静态函数 (内部链接)
// static 关键字将 sum 函数的作用域限制在当前源文件
//    其他.cpp文件即使声明了它，也无法在链接时找到它
static double sum(const double arr[], int size) {
    double total = 0.0;
    for (int i = 0; i &lt; size; ++i) {
        total += arr[i];
    }
    return total;
}

// 定义外部函数 (外部链接)
//    这个函数是模块的公共接口
double average(const double arr[], int size) {
    if (size &lt;= 0) {
        return 0.0;
    }
    // 在内部调用同文件下的静态辅助函数
    return sum(arr, size) / size;
}

// 这是一个外部函数（默认），其声明对所有包含此头文件的文件都可见
// 功能：计算一个double数组的平均值
double average(const double arr[], int size);

#endif // MATH_UTILS_H
</code></pre></figure></div></div>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 46</p><h2 id="c-046-title">决策动态回调</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>

<section class="case-information"><h3 class="case-subhead">案例信息</h3>

#include &lt;iostream&gt;

// 策略函数定义

// 策略 1：经济模式下的油门控制
void gentle_throttle() {
    std::cout &lt;&lt; &quot;执行经济模式：平缓加速，优化燃油效率。&quot; &lt;&lt; std::endl;
}

// 策略 2：运动模式下的油门控制
void aggressive_throttle() {
    std::cout &lt;&lt; &quot;执行运动模式：急加速！提供最大动力响应。&quot; &lt;&lt; std::endl;
}

int main() {
    // 定义一个函数指针
    //    语法：返回类型 (*指针名)(参数列表)
    //    这里的 throttle_strategy 是一个指针，它指向一个无参数、无返回值的函数
    void (*throttle_strategy)();

    char mode_selection;
    std::cout &lt;&lt; &quot;--- 驾驶模式选择 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;请输入模式 (E - 经济模式， S - 运动模式): &quot;;
    std::cin &gt;&gt; mode_selection;

    // 根据用户输入，将函数指针指向不同的函数地址
    //    函数名本身就代表了函数的地址
    if (mode_selection == &#x27;E&#x27; || mode_selection == &#x27;e&#x27;) {
        throttle_strategy = gentle_throttle;
    } else if (mode_selection == &#x27;S&#x27; || mode_selection == &#x27;s&#x27;) {
        throttle_strategy = aggressive_throttle;
    } else {
        std::cout &lt;&lt; &quot;无效模式，使用默认策略。&quot; &lt;&lt; std::endl;
        throttle_strategy = gentle_throttle; // 默认指向经济模式
    }

    std::cout &lt;&lt; &quot;\n--- 执行当前油门策略 ---&quot; &lt;&lt; std::endl;
    // 通过函数指针进行回调
    //    程序在这里并不知道具体执行的是哪个函数，只知道调用指针即可
    throttle_strategy();

    return 0;
}

#include &lt;iostream&gt;
#include &lt;string&gt;

// 重载函数定义

// 版本 1：接收一个字符串参数
// 用于记录通用的文本信息
void log_event(const std::string&amp; message) {
    std::cout &lt;&lt; &quot;[INFO] Message: \&quot;&quot; &lt;&lt; message &lt;&lt; &quot;\&quot;&quot; &lt;&lt; std::endl;
}

// 版本 2：接收一个整型参数
// 用于记录数字化的错误码
void log_event(int error_code) {
    std::cout &lt;&lt; &quot;[ERROR] Code: &quot; &lt;&lt; error_code &lt;&lt; std::endl;
}

// 版本 3：接收一个字符串和一个整型参数
// 用于记录特定组件的状态
void log_event(const std::string&amp; component, int status_code) {
    std::cout &lt;&lt; &quot;[STATUS] Component: &quot; &lt;&lt; component 
              &lt;&lt; &quot;, Status: &quot; &lt;&lt; status_code &lt;&lt; std::endl;
}

int main() {
    std::cout &lt;&lt; &quot;--- 自动驾驶日志系统 ---&quot; &lt;&lt; std::endl;

    // 调用版本 1：传入一个字符串
    log_event(&quot;系统初始化完成。&quot;);

    // 调用版本 2：传入一个整数
    log_event(404);

    // 调用版本 3：传入一个字符串和一个整数
    log_event(&quot;Lidar&quot;, 0); // 0 代表正常

    return 0;
}

[INFO] Message: &quot;系统初始化完成。&quot;
[ERROR] Code: 404
[STATUS] Component: Lidar, Status: 0
</code></pre></figure></div></div></div><p>当程序被成功编译并运行后，控制台将显示三次调用分别匹配到了正确的函数版本。</p>
<p>我们只用了一个函数名 <code>log_event</code>，但成功地处理了三种完全不同的数据输入。当调用 <code>log_event(&quot;...&quot;)</code> 时，编译器发现只有一个参数且类型为字符串，于是精确地匹配到了版本一；当调用 <code>log_event(404)</code> 时，编译器根据唯一的整型参数匹配到了版本二；当调用 <code>log_event(&quot;Lidar&quot;, 0)</code> 时，编译器根据参数的数量（两个）和类型（字符串、整数）匹配到了版本三。这个过程完全在编译阶段自动完成，体现了函数重载作为静态多态的特性，为开发者提供了极大的便利。</p></div></div></article>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 48</p><h2 id="c-048-title">最小距离查找</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>

<figure class="case-visual case-flow"><figcaption><span>用同一模板比较距离</span><span class="case-card-topic">函数模板</span></figcaption><dl class="case-fields"><div><dt>输入</dt><dd>两个同类型数值</dd></div><div><dt>函数</dt><dd><code>find_closest</code></dd></div><div><dt>返回</dt><dd>较小的值</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用函数模板实现最小距离查找

#include &lt;iostream&gt;

// 定义函数模板
//    template &lt;typename T&gt; 告诉编译器，这是一个模板，T是一个类型的占位符
//    这个模板可以用于任何支持 &#x27;&gt;&#x27; 运算符的类型 T
template &lt;typename T&gt;
T find_closest(T dist1, T dist2) {
    // 对所有 T 类型采用相同的比较逻辑
    return (dist1 &lt; dist2) ? dist1 : dist2;
}

int main() {
    std::cout &lt;&lt; &quot;--- 最小距离查找 ---&quot; &lt;&lt; std::endl;

    // 使用整数距离实例化函数模板
    int grid_dist1 = 50;
    int grid_dist2 = 35;
    // 调用时，编译器看到两个int参数，会自动推导 T 为 int，
    // 并&quot;实例化&quot;出一个 int find_closest(int, int) 函数
    int closest_grid_dist = find_closest(grid_dist1, grid_dist2);
    std::cout &lt;&lt; &quot;整数距离 &quot; &lt;&lt; grid_dist1 &lt;&lt; &quot;m 和 &quot; &lt;&lt; grid_dist2 
              &lt;&lt; &quot;m 中，较近的是： &quot; &lt;&lt; closest_grid_dist &lt;&lt; &quot;m&quot; &lt;&lt; std::endl;

    // 使用浮点距离实例化函数模板
    float radar_dist1 = 42.5f;
    float radar_dist2 = 42.8f;
    // 调用时，编译器看到两个float参数，会自动推导 T 为 float，
    // 并实例化出一个 float find_closest(float, float) 函数
    float closest_radar_dist = find_closest(radar_dist1, radar_dist2);
    std::cout &lt;&lt; &quot;浮点数距离 &quot; &lt;&lt; radar_dist1 &lt;&lt; &quot;m 和 &quot; &lt;&lt; radar_dist2 
              &lt;&lt; &quot;m 中，较近的是： &quot; &lt;&lt; closest_radar_dist &lt;&lt; &quot;m&quot; &lt;&lt; std::endl;

    // 使用双精度距离实例化函数模板
    double lidar_dist1 = 88.12345;
    double lidar_dist2 = 88.12354;
    // 调用时，编译器看到两个double参数，会自动推导 T 为 double，
    // 并实例化出一个 double find_closest(double, double) 函数
    double closest_lidar_dist = find_closest(lidar_dist1, lidar_dist2);
    std::cout &lt;&lt; &quot;双精度距离 &quot; &lt;&lt; lidar_dist1 &lt;&lt; &quot;m 和 &quot; &lt;&lt; lidar_dist2 
              &lt;&lt; &quot;m 中，较近的是： &quot; &lt;&lt; closest_lidar_dist &lt;&lt; &quot;m&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>

<p>我们只编写了一次 <code>find_closest</code> 函数的逻辑，但在调用时，它却能正确地处理 <code>int</code>、<code>float</code>、<code>double</code> 三种完全不同的数据类型。这背后的“魔法”是编译器的模板实例化：在编译阶段，编译器分析每一次函数调用，根据传入实参的类型，自动地为我们生成了一个专门处理该类型的函数版本。我们写的模板代码本身不会生成任何机器码，它只是一个“模具”，真正被编译的是由它生成的那些具体函数。</p></div></div></article>

// 数学工具库的函数实现

#include &quot;math_utils.h&quot;
#include &lt;cmath&gt;

const double PI = 3.1415926535;

double calculate_braking_distance(double speed_kmh) {
    const double DECELERATION = 4.5;
    double speed_mps = speed_kmh / 3.6;
    return std::pow(speed_mps, 2) / (2 * DECELERATION);
}

double to_radians(double degrees) {
    return degrees * PI / 180.0;
}

<p>车辆限速、车道宽度等参数会随测试场景调整。如果将这些数值固定在源码里，每次试验前都要重新修改和构建程序。把参数写进外部配置文件后，测试人员可以直接调整文件，再观察程序读到的值。本案例用 INI 解析库处理这项工作，练习将第三方依赖接入 CMake 工程。</p>

<section class="case-information"><h3 class="case-subhead">案例信息</h3>

<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 链接并使用 inih 库来读取配置文件

#include &lt;iostream&gt;
#include &quot;external/inih/cpp/INIReader.h&quot; // 包含第三方库的头文件

#ifndef CONFIG_FILE_PATH
#define CONFIG_FILE_PATH &quot;config.ini&quot;
#endif

int main() {
    // 创建 INIReader 对象，并加载配置文件
    INIReader reader(CONFIG_FILE_PATH);

    // 检查文件是否加载成功
    if (reader.ParseError() &lt; 0) {
        std::cout &lt;&lt; &quot;无法加载 &#x27;config.ini&#x27;\n&quot;;
        return 1;
    }

    // 使用库提供的API读取配置项
    //    GetReal(section, name, default_value)
    double max_speed = reader.GetReal(&quot;DriverAssist&quot;, &quot;max_speed&quot;, 80.0);
    //    GetBoolean(section, name, default_value)
    bool lane_change = reader.GetBoolean(&quot;DriverAssist&quot;, &quot;lane_change_enabled&quot;, false);
    //    GetInteger(section, name, default_value)
    long duration = reader.GetInteger(&quot;Simulation&quot;, &quot;duration_s&quot;, 30);

    // 打印读取到的配置
    std::cout &lt;&lt; &quot;--- 仿真配置加载成功 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;最高速度： &quot; &lt;&lt; max_speed &lt;&lt; &quot; km/h&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;允许自动变道： &quot; &lt;&lt; (lane_change ? &quot;是&quot; : &quot;否&quot;) &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;仿真时长： &quot; &lt;&lt; duration &lt;&lt; &quot; 秒&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure><figure class="code-panel" data-code-language="text"><figcaption><span>CMakeLists.txt</span><span class="code-kind">文本</span></figcaption><pre tabindex="0"><code>cmake_minimum_required(VERSION 3.16)
project(config_demo LANGUAGES CXX)

set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_STANDARD_REQUIRED ON)
set(CMAKE_CXX_EXTENSIONS OFF)

add_executable(config_demo
    main.cpp
    external/inih/cpp/INIReader.cpp
    external/inih/ini.cpp
)
target_compile_definitions(config_demo PRIVATE
    CONFIG_FILE_PATH=&quot;${CMAKE_CURRENT_SOURCE_DIR}/config.ini&quot;)
</code></pre></figure></div><a class="row-action case-download" href="downloads/materials/c-ext-e2/config.ini" download="config.ini">下载 config.ini ↓</a><a class="row-action case-library" data-library="true" href="downloads/materials/c-ext-e2/inih/index.html">查看 inih 文件夹</a></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><figure class="code-panel"><figcaption><span>构建与运行命令</span></figcaption><pre tabindex="0"><code>cmake -S . -B build
cmake --build build
./build/config_demo</code></pre></figure><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 仿真配置加载成功 ---
最高速度： 120.5 km/h
允许自动变道： 是
仿真时长： 60 秒
</code></pre></figure></div></div></div><p>编译与运行（在 <code>ini_parser_project</code> 目录下执行）。</p>

<article id="c-ai-f" class="case-article" data-reading-sample="c-ai-f" data-generated-case="true" data-aigc-sample="true" aria-labelledby="c-ai-f-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 F</p><h2 id="c-ai-f-title">AIGC错误逻辑纠正</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3><p>软件能够编译运行，并不代表结果符合预期。错误假设、遗漏的边界条件或不匹配的单位，都可能形成隐藏较深的逻辑错误，需要结合设计意图、数据含义和测试结果进行诊断。本案例以车辆位置更新为观察材料，借助 AIGC 分析代码中的计算关系、定位并修复错误，体验智能工具辅助代码审查与调试的方法。</p></div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3><p>使用 AIGC 工具诊断并修复车辆位置更新中的单位错误。提供存在问题的 <code>Vehicle</code> 类、各数据的单位，以及初始位置 0 米、速度 36 km/h、行驶 10 秒的测试场景，说明预期位置为 100 米而原程序得到 360 米。要求工具解释错误并给出修正代码，对比修复前后的结果，为后续车辆对象化封装提供观察材料。</p><figure class="case-visual case-flow"><figcaption><span>车辆位移的错误复现</span><span class="case-card-topic">单位换算</span></figcaption><dl class="case-fields"><div><dt>复现输入</dt><dd><code>36 km/h</code>，<code>10 s</code></dd></div><div><dt>原版结果</dt><dd><code>360 m</code></dd></div><div><dt>修正依据</dt><dd>预期 <code>100 m</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><section class="case-prompt"><h4>提示词（Prompt）</h4><div class="case-prompt-body"><p>请扮演一名 C++“代码逻辑医生”，分析给定的 <code>Vehicle</code> 类代码，诊断并修复 <code>update_position</code> 中的逻辑错误。</p>
<p>功能目标：根据车辆速度和经过的时间更新位置。<code>position_m_</code> 的单位是米，<code>speed_kmh_</code> 的单位是 km/h，<code>time_seconds</code> 的单位是秒。</p>

<p>请完成以下工作：</p>
<ol><li>定位造成错误的计算语句，解释各物理量的单位及错误原因。</li><li>在保留现有类接口的前提下修复计算，给出修正后的完整 C++ 程序。</li><li>使用相同测试数据，对比修复前后的计算结果，并说明修复后为何应得到 100 米。</li></ol></div></section><section class="aigc-material"><p>诊断时，将上述提示词与下面存在单位错误的 <code>Vehicle</code> 类代码一并提交。</p><div class="case-code-files"><figure class="code-panel" data-code-language="cpp" data-code-label="原始片段 · vehicle.cpp"><figcaption><span>vehicle.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>#include &lt;iostream&gt;

class Vehicle {
public:
    Vehicle(double initial_pos, double initial_speed)
        : position_m_(initial_pos), speed_kmh_(initial_speed) {}

    // 根据给定的时间（秒）更新车辆的位置

    }

<div class="case-result"><h3>运行效果</h3><p><code>speed_kmh_</code>（km/h）与 <code>time_seconds</code>（s）的单位不匹配。修复后的代码在计算距离前，先将速度从 km/h 转换为 m/s（<code>1 km/h = 1000 m / 3600 s = 1/3.6 m/s</code>）。</p><div class="aigc-response case-method-compact"><div class="case-code-files"><figure class="code-panel" data-code-language="cpp" data-source-file="variant_2/main.cpp" data-code-label="main.cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 修正版本：先把 km/h 转换为 m/s

#include &lt;iostream&gt;

class Vehicle {
public:
    Vehicle(double initial_pos, double initial_speed)
        : position_m_(initial_pos), speed_kmh_(initial_speed) {}

    void update_position(double time_seconds) {
        const double kKphToMpsFactor = 1.0 / 3.6;
        const double speed_mps = speed_kmh_ * kKphToMpsFactor;

    void print_status() const {

                  &lt;&lt; speed_kmh_ &lt;&lt; &quot; km/h&quot; &lt;&lt; std::endl;
    }

private:
    double position_m_;
    double speed_kmh_;
};

int main() {
    Vehicle my_car(0.0, 36.0);
    my_car.update_position(10.0);

}

</code></pre></figure><figure class="code-panel"><figcaption><span>修复后</span></figcaption><pre tabindex="0"><code>当前位置: 100 米, 当前速度: 36 km/h

<article id="c-049" class="case-article" data-reading-sample="c-049" data-generated-case="true" aria-labelledby="c-049-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 49</p><h2 id="c-049-title">车辆对象设计</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>交通仿真中的车辆既要保存速度和位置，也要响应加速、显示状态等操作。功能逐渐增多后，分散的状态和函数会让调用者难以判断哪些操作会改变车辆。将数据与操作放入一个类，可以明确车辆自身负责的工作，并让主流程通过指定接口和它交互。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>将原先的车辆结构体和全局函数重构为 <code>Vehicle</code> 类。把 <code>speed</code>、<code>position</code> 等设为 <code>private</code>，将 <code>accelerate()</code> 等操作改成 <code>public</code> 成员函数。在 <code>main</code> 中创建对象，通过公共接口改变并显示状态。</p>
<figure class="case-visual case-flow"><figcaption><span>把车辆数据交给对象管理</span><span class="case-card-topic">类与对象</span></figcaption><dl class="case-fields"><div><dt>私有状态</dt><dd>车速与位置</dd></div><div><dt>公开行为</dt><dd><code>accelerate()</code></dd></div><div><dt>调用方式</dt><dd>由车辆对象调用</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 从struct到class，设计第一个&quot;车辆&quot;类

#include &lt;iostream&gt;

// 我们要重构的 Vehicle 类
class Vehicle {
// public 访问说明符：定义了类的&quot;公共接口&quot;
//    外部代码可以通过这些接口与对象交互
public:
    // 公共成员函数 - 对象的&quot;行为&quot;

    // 加速（行为）
    void accelerate() {
        // 成员函数可以直接访问同一个类的私有成员
        if (speed &lt; 120.0) {
            speed += 5.0;
        }
    }

    // 减速（行为）
    void brake() {
        if (speed &gt; 0.0) {
            speed -= 5.0;
        }
    }

    // 获取当前速度（行为） - 用于从外部安全地读取私有数据
    double get_speed() {
        return speed;
    }

    // 设置车辆的初始状态（行为）
    void set_initial_state(double initial_speed) {
        speed = initial_speed;
    }

// private 访问说明符：定义了类的&quot;内部数据&quot;
//    这些数据被保护起来，只能被本类的成员函数访问
private:
    // 私有数据成员 - 对象的&quot;属性&quot;
    double speed;       // 车速 (km/h)
    double position;    // 位置 (m)
};

// 程序入口使用 Vehicle 对象
int main() {
    // 创建一个 Vehicle 类的对象（实例），名为 my_car
    Vehicle my_car;

    // 通过公共接口（成员函数）来初始化和操作对象
    my_car.set_initial_state(60.0);
    std::cout &lt;&lt; &quot;初始车速: &quot; &lt;&lt; my_car.get_speed() &lt;&lt; &quot; km/h&quot; &lt;&lt; std::endl;

    my_car.accelerate(); // 调用加速行为
    std::cout &lt;&lt; &quot;加速后车速: &quot; &lt;&lt; my_car.get_speed() &lt;&lt; &quot; km/h&quot; &lt;&lt; std::endl;

    my_car.brake(); // 调用减速行为
    my_car.brake();
    std::cout &lt;&lt; &quot;连续两次减速后车速: &quot; &lt;&lt; my_car.get_speed() &lt;&lt; &quot; km/h&quot; &lt;&lt; std::endl;

    // 尝试从外部直接访问私有成员，将会导致编译失败
    // my_car.speed = 200.0; // &lt;- 如果取消这行注释，编译器会报错！
    // 错误信息: &#x27;double Vehicle::speed&#x27; is private

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>初始车速: 60 km/h
加速后车速: 65 km/h
连续两次减速后车速: 55 km/h
</code></pre></figure></div></div></div><p>程序编译并运行后，将在控制台看到以下输出。</p>
<p>现象分析：程序成功地创建了一个 <code>Vehicle</code> 对象 <code>my_car</code>。我们无法在 <code>main</code> 函数中像操作 <code>struct</code> 成员一样直接用 <code>my_car.speed</code> 来修改速度，因为 <code>speed</code> 是 <code>private</code> 的；只能通过 <code>my_car.accelerate()</code>、<code>my_car.get_speed()</code> 等 <code>public</code> 的成员函数来与对象的内部状态进行交互。这完美地体现了<strong>封装</strong>的思想：数据被保护起来，只能通过预设的、受控的行为接口来进行操作，保证了数据的安全性和一致性。</p></div></div></article>
<article id="c-050" class="case-article" data-reading-sample="c-050" data-generated-case="true" aria-labelledby="c-050-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 50</p><h2 id="c-050-title">车辆启动熄火</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>仿真场景中新加入的车辆应从静止、熄火的状态开始。如果每个调用处都要先手动初始化，遗漏一次就可能让车辆带着不确定状态进入场景。离开场景后，程序还要知道对象何时结束使用。本案例观察构造和析构消息，理清对象在不同作用域内的生命周期。</p>

<section class="case-information"><h3 class="case-subhead">案例信息</h3>

<p>交通仿真可以从一辆配置好的原型车创建副本，再分别设置它们的属性。若原型的识别码保存在动态内存中，只复制地址会让两辆车指向同一份数据，修改或销毁其中一辆都会影响另一辆。本案例用车辆识别码演示如何让副本拥有独立数据，并验证修改互不影响。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 <code>char* vin</code> 保存动态数据，构造时以 <code>new</code> 分配并初始化，析构时用 <code>delete[]</code> 释放。编写拷贝构造函数，为副本单独分配内存并复制 VIN。在 <code>main</code> 中克隆车辆，修改原型 VIN 后分别打印两个值。</p>
<figure class="case-visual case-flow"><figcaption><span>克隆车辆时复制 VIN</span><span class="case-card-topic">深拷贝</span></figcaption><dl class="case-fields"><div><dt>原型数据</dt><dd>动态字符数组</dd></div><div><dt>拷贝构造</dt><dd>分配独立内存</dd></div><div><dt>析构</dt><dd><code>delete[]</code> 释放</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 通过实现拷贝构造函数来安全地克隆对象

#include &lt;iostream&gt;
#include &lt;cstring&gt; // 用于 strcpy 和 strlen

class Vehicle {
public:
    // 普通构造函数
    Vehicle() {
// 为 vin 分配动态内存
        vin = new char[100 + 1];
//        strcpy(vin, id);
    }

    Vehicle(const char* id) {
        std::cout &lt;&lt; &quot;[普通构造]: 正在创建车辆, ID: &quot; &lt;&lt; id &lt;&lt; std::endl;
        // 为 vin 分配动态内存
        vin = new char[strlen(id) + 1];
        strcpy(vin, id);
    }

    // 拷贝构造函数 (Copy Constructor)
    //    - 参数是同一个类的常引用 (const Vehicle&amp;)
    Vehicle(const Vehicle&amp; other) {
        std::cout &lt;&lt; &quot;[拷贝构造]: 正在克隆车辆, 源ID: &quot; &lt;&lt; other.vin &lt;&lt; std::endl;
        // 实现深拷贝
        // a. 为新对象的 vin 分配一块全新的内存
        vin = new char[strlen(other.vin) + 1];
        // b. 将源对象 vin 的内容复制到这块新内存中
        strcpy(vin, other.vin);
    }

    Vehicle&amp; operator=(const Vehicle&amp; other) {
        std::cout &lt;&lt; &quot;[拷贝赋值]: 正在赋值车辆, 源ID: &quot; &lt;&lt; other.vin &lt;&lt; std::endl;
        // 实现深拷贝
        delete []vin;
        // a. 为新对象的 vin 分配一块全新的内存
        vin = new char[strlen(other.vin) + 1];
        // b. 将源对象 vin 的内容复制到这块新内存中
        strcpy(vin, other.vin);
        return *this;
    }

    // 析构函数
    ~Vehicle() {
        std::cout &lt;&lt; &quot;[析构函数]: 正在销毁车辆, ID: &quot; &lt;&lt; vin &lt;&lt; std::endl;
        // 释放动态分配的内存
        delete[] vin;
    }

    // 公共成员函数 - 用于修改和显示 vin
    void set_vin(const char* new_id) {
        delete[] vin; // 先释放旧内存
        vin = new char[strlen(new_id) + 1];
        strcpy(vin, new_id);
    }

    void display() const {
        std::cout &lt;&lt; &quot;  -&gt; 当前车辆VIN: &quot; &lt;&lt; vin &lt;&lt; std::endl;
    }

private:
    char* vin; // 车辆识别码 (动态分配内存)
};

// 程序入口展示对象克隆
int main() {
    // 创建一个原型车
    std::cout &lt;&lt; &quot;--- 创建原型车 ---&quot; &lt;&lt; std::endl;
    Vehicle prototype_car(&quot;VIN-PROTOTYPE-001&quot;);
    prototype_car.display();

    std::cout &lt;&lt; &quot;\n--- 克隆新车 ---&quot; &lt;&lt; std::endl;
    // 当使用一个已存在的对象来初始化一个新对象时，拷贝构造函数会被自动调用
    Vehicle cloned_car;
    cloned_car = prototype_car;
    cloned_car.display();

    std::cout &lt;&lt; &quot;\n--- 修改原型车的VIN ---&quot; &lt;&lt; std::endl;
    prototype_car.set_vin(&quot;VIN-MODIFIED-999&quot;);
    std::cout &lt;&lt; &quot;原型车修改后:&quot; &lt;&lt; std::endl;
    prototype_car.display();

    std::cout &lt;&lt; &quot;\n--- 验证克隆车是否受影响 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;克隆车(未修改):&quot; &lt;&lt; std::endl;
    cloned_car.display(); // 验证其 VIN 是否保持不变

    std::cout &lt;&lt; &quot;\n--- main函数结束, 对象将被销毁 ---&quot; &lt;&lt; std::endl;
    return 0;
}
</code></pre></figure></div></div>

  -&gt; 当前车辆VIN: VIN-PROTOTYPE-001

--- 克隆新车 ---
[拷贝赋值]: 正在赋值车辆, 源ID: VIN-PROTOTYPE-001
  -&gt; 当前车辆VIN: VIN-PROTOTYPE-001

--- 修改原型车的VIN ---
原型车修改后:
  -&gt; 当前车辆VIN: VIN-MODIFIED-999

--- 验证克隆车是否受影响 ---
克隆车(未修改):
  -&gt; 当前车辆VIN: VIN-PROTOTYPE-001

--- main函数结束, 对象将被销毁 ---
[析构函数]: 正在销毁车辆, ID: VIN-PROTOTYPE-001

<p>现象分析：当 <code>cloned_car</code> 被创建时，输出了 <code>[拷贝构造]</code> 的信息，证明了拷贝构造函数被自动调用。修改 <code>prototype_car</code> 的 VIN 后，<code>cloned_car</code> 的 VIN <strong>没有发生任何改变</strong>，这清晰地证明由于我们实现了深拷贝，两个对象拥有各自独立的 <code>vin</code> 内存，互不干扰。如果没有手动实现拷贝构造函数，C++ 会执行默认的浅拷贝，那样的话修改原型车的 VIN 将会同时改变克隆车的 VIN，并且在程序结束时，析构函数会尝试释放同一块内存两次，导致程序崩溃。</p></div></div></article>

#include &lt;iostream&gt;

            update_engine_temp(); 
        }
        std::cout &lt;&lt; &quot;车辆正在加速... 当前速度: &quot; &lt;&lt; speed &lt;&lt; &quot; km/h&quot; &lt;&lt; std::endl;
    }

    // 公共数据接口：安全地获取速度
    double get_speed() const {
        return speed;
    }

    // 公共数据接口：安全地获取引擎温度
    double get_engine_temperature() const {
        return engine_temperature;
    }

// private 成员：类的内部实现，只能由本类成员函数访问
private:
    // 私有核心数据
    const int id;             // 车辆的唯一ID，const确保其不可变
    double speed;             // 当前速度
    double engine_temperature;// 引擎温度

    }

    std::cout &lt;&lt; &quot;初始引擎温度: &quot; &lt;&lt; my_car.get_engine_temperature() &lt;&lt; &quot; C&quot; &lt;&lt; std::endl;
    my_car.accelerate();
    my_car.accelerate();

#include &lt;iostream&gt;

class Vehicle {
public:
    // 构造函数
    Vehicle(int id) : vehicle_id(id), speed(0.0), lane(1) {}

    // set_speed 函数
    //    - 返回类型为 Vehicle&amp;，即对 Vehicle 对象的引用
    Vehicle&amp; set_speed(double new_speed) {
        this-&gt;speed = new_speed;
        // &#x27;this&#x27; 是一个指向当前对象的指针
        //    &#x27;*this&#x27; 就是当前对象本身
        //    返回 *this 使得可以继续对该对象进行其他操作
        return *this;
    }

    // set_lane 函数，同样返回 Vehicle&amp;
    Vehicle&amp; set_lane(int new_lane) {
        this-&gt;lane = new_lane;
        return *this; // 返回当前对象的引用
    }

    // display 函数用于显示对象状态，它不需要参与链式调用，返回 void 即可
    void display() const {
        std::cout &lt;&lt; &quot;--- 车辆状态报告 ---&quot; &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;车辆 ID: &quot; &lt;&lt; vehicle_id &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;当前速度: &quot; &lt;&lt; speed &lt;&lt; &quot; km/h&quot; &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;所在车道: &quot; &lt;&lt; lane &lt;&lt; std::endl;
    }

private:
    int vehicle_id;
    double speed;
    int lane;
};

// 程序入口展示链式调用
int main() {
    // 创建一个 Vehicle 对象
    Vehicle my_car(101);

    std::cout &lt;&lt; &quot;使用链式调用配置车辆...&quot; &lt;&lt; std::endl;

    // 链式调用 (Chained Method Calls)
    //    my_car.set_speed(80.0) 执行后返回 my_car 自身的引用,
    //    然后该引用继续调用 .set_lane(2)
    my_car.set_speed(80.0).set_lane(2);

    // 验证配置结果
    my_car.display();

    return 0;
}

<p>现象分析：尽管 <code>set_speed</code> 和 <code>set_lane</code> 在一行内被接连调用，但最终的 <code>display()</code> 结果表明，两个设置都已成功应用于 <code>my_car</code> 对象。链式调用 <code>my_car.set_speed(80.0).set_lane(2);</code> 的执行过程被分解为：先调用 <code>my_car.set_speed(80.0)</code>，函数内部 <code>this</code> 指向 <code>my_car</code>，<code>speed</code> 被设置为 80.0，函数返回 <code>*this</code>（即 <code>my_car</code> 对象的引用）；表达式的结果紧接着调用 <code>.set_lane(2)</code>，函数内部 <code>this</code> 同样指向 <code>my_car</code>，<code>lane</code> 被设置为 2。这种编码风格不仅代码更紧凑，而且意图更清晰，逻辑上将一系列相关配置操作“组合”在了一起。</p></div></div></article>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 54</p><h2 id="c-054-title">常量成员引用</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>仿真场景中的每辆车有独立的识别码，创建后该值应保持固定。与此同时，场景还要统计此刻有多少车辆对象存活，不能只从单辆车的状态得出总数。本案例把两种数据放进同一个类，观察哪些数据随对象分别保存，哪些由整个类共享。</p>

<p>在 <code>Vehicle</code> 中用 <code>const int VIN</code> 保存识别码，构造时通过初始化列表设置。用 <code>private static int vehicle_count</code> 记录存活数，构造时增加、析构时减少。提供 <code>const</code> 的 <code>display()</code> 和静态 <code>get_vehicle_count()</code>。创建多个对象（含一个 <code>const</code> 对象），观察输出和计数变化。</p>

<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 结合 const 和 static 成员管理车辆信息

#include &lt;iostream&gt;

class Vehicle {
public:
    // 构造函数
    //    - const 成员 &#x27;VIN&#x27; 必须在成员初始化列表中进行初始化
    Vehicle(int vin) : VIN(vin) {
        vehicle_count++; // 每创建一个对象, 静态计数器加一
        std::cout &lt;&lt; &quot;[构造] VIN: &quot; &lt;&lt; VIN &lt;&lt; &quot; 的车辆已创建。&quot;;
        std::cout &lt;&lt; &quot;当前车辆总数: &quot; &lt;&lt; vehicle_count &lt;&lt; std::endl;
    }

    // 析构函数
    ~Vehicle() {
        vehicle_count--; // 每销毁一个对象, 静态计数器减一
        std::cout &lt;&lt; &quot;[析构] VIN: &quot; &lt;&lt; VIN &lt;&lt; &quot; 的车辆已销毁。&quot;;
        std::cout &lt;&lt; &quot;当前车辆总数: &quot; &lt;&lt; vehicle_count &lt;&lt; std::endl;
    }

    // 常量成员函数: 承诺不修改任何成员变量
    void display() const {
        std::cout &lt;&lt; &quot;  -&gt; 车辆信息 | VIN: &quot; &lt;&lt; VIN &lt;&lt; std::endl;
    }

    // 静态成员函数: 属于类, 不属于任何特定对象
    //    它只能访问静态成员
    static int get_vehicle_count() {
        return vehicle_count;
    }

private:
    // const 成员: 每个对象都有一份, 但初始化后不可更改
    const int VIN; 

    // static 成员: 所有对象共享一份
    static int vehicle_count; 
};

// 静态数据成员必须在类定义的外部进行初始化
int Vehicle::vehicle_count = 0;

// 程序入口展示 const 和 static 成员的使用
int main() {
    std::cout &lt;&lt; &quot;程序开始时, 车辆总数: &quot; &lt;&lt; Vehicle::get_vehicle_count() &lt;&lt; std::endl;

    std::cout &lt;&lt; &quot;\n--- 创建两辆车 ---&quot; &lt;&lt; std::endl;
    Vehicle car1(101);
    Vehicle car2(102);

    std::cout &lt;&lt; &quot;\n--- 进入一个新的作用域 ---&quot; &lt;&lt; std::endl;
    {
        const Vehicle car3_const(103); // 创建一个常量对象
        std::cout &lt;&lt; &quot;在作用域内部, 车辆总数: &quot; &lt;&lt; Vehicle::get_vehicle_count() &lt;&lt; std::endl;

        car3_const.display(); // OK: const 对象可以调用 const 成员函数
        // car3_const.VIN = 104; // 错误: const 成员不能被修改
    } // car3_const 在这里被销毁

    std::cout &lt;&lt; &quot;\n--- 离开作用域后 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;程序即将结束, 车辆总数: &quot; &lt;&lt; car1.get_vehicle_count() &lt;&lt; std::endl; // 也可以通过对象调用静态函数

    return 0;
} // car1 和 car2 在这里被销毁

void DiagnosticTool::perform_full_scan(Vehicle&amp; vehicle) {

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">拓展案例 F1</p><h2 id="c-ext-f1-title">对象智能指针管理</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>车辆日志可以只由一辆车使用，也可能由多辆车共同使用。程序要明确谁负责释放日志，以及其他对象是否仍在读取它。只记录原生地址时，这些责任需要额外约定。本案例用构造和析构消息追踪日志对象，对照手动管理、独占和共享三种方式。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>令 <code>VehicleLog</code> 在构造、析构时打印消息。在 <code>Vehicle</code> 中依次对照三种做法。</p>
<ul><li><code>VehicleLog*</code>：通过析构日志观察遗漏释放，分析浅拷贝可能引起的重复释放，避免实际执行重复释放。</li><li><code>std::unique_ptr&lt;VehicleLog&gt;</code>：验证独占对象自动释放，理解智能指针禁止复制的原因。</li><li><code>std::shared_ptr&lt;VehicleLog&gt;</code>：让多辆车共享同一份日志，观察最后一个所有者离开时才释放。</li></ul>
<figure class="case-visual case-flow"><figcaption><span>谁负责释放车辆日志</span><span class="case-card-topic">所有权管理</span></figcaption><dl class="case-fields"><div><dt>原生指针</dt><dd>手动管理</dd></div><div><dt>独占所有权</dt><dd><code>unique_ptr</code></dd></div><div><dt>共享所有权</dt><dd><code>shared_ptr</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 对比原生指针与智能指针进行动态内存管理

#include &lt;iostream&gt;
#include &lt;string&gt;
#include &lt;memory&gt; // 必须包含此头文件以使用智能指针

// 车辆日志类，其对象的生命周期将被追踪
class VehicleLog {
public:
    VehicleLog(const std::string&amp; id) : vehicle_id_(id) {
        std::cout &lt;&lt; &quot;  [Log CREATED] for vehicle &quot; &lt;&lt; vehicle_id_ &lt;&lt; std::endl;
    }
    ~VehicleLog() {
        std::cout &lt;&lt; &quot;  [Log DESTROYED] for vehicle &quot; &lt;&lt; vehicle_id_ &lt;&lt; std::endl;
    }
private:
    std::string vehicle_id_;
};

// 对比 1：使用原生指针的车辆类（有风险）
class RawPtrVehicle {
public:
    RawPtrVehicle(const std::string&amp; id) : id_(id) {
        log_ptr_ = new VehicleLog(id_);
    }
    // 注意：这里故意不写析构函数和拷贝构造函数，以暴露问题
private:
    std::string id_;
    VehicleLog* log_ptr_;
};

// 对比 2：使用 unique_ptr 的车辆类（安全，独占所有权）
class UniquePtrVehicle {
public:
    UniquePtrVehicle(const std::string&amp; id) : id_(id) {
        log_ptr_ = std::make_unique&lt;VehicleLog&gt;(id_);
    }
    // 无需手动编写析构函数，unique_ptr 会自动释放内存！
private:
    std::string id_;
    std::unique_ptr&lt;VehicleLog&gt; log_ptr_;
};

// 对比 3：使用 shared_ptr 的车辆类（安全，共享所有权）
class SharedPtrVehicle {
public:
    // 构造函数，创建一个新的日志
    SharedPtrVehicle(const std::string&amp; id) : id_(id) {
        log_ptr_ = std::make_shared&lt;VehicleLog&gt;(id_);
    }
    // 拷贝构造函数，安全地共享同一个日志
    SharedPtrVehicle(const SharedPtrVehicle&amp; other) : id_(other.id_ + &quot;-copy&quot;) {
        this-&gt;log_ptr_ = other.log_ptr_; // 拷贝 shared_ptr, 引用计数自动增加
    }
private:
    std::string id_;
    std::shared_ptr&lt;VehicleLog&gt; log_ptr_;
};

int main() {
    std::cout &lt;&lt; &quot;--- 1. 原生指针的风险演示 ---&quot; &lt;&lt; std::endl;
    {
        RawPtrVehicle car_A(&quot;Raw-A&quot;);
    } // car_A被销毁，但它内部的日志对象没有被delete！
    std::cout &lt;&lt; &quot;  -&gt; car_A 作用域结束，日志并未销毁，发生内存泄漏。\n&quot; &lt;&lt; std::endl;

    RawPtrVehicle* car_B = new RawPtrVehicle(&quot;Raw-B&quot;);
    RawPtrVehicle car_C = *car_B; // 浅拷贝，car_B和car_C的log_ptr_指向同一地址
    delete car_B; // car_B的log_ptr_没有被delete, car_B自身的内存被释放
                  // car_C即将离开作用域，它的log_ptr_也没有被delete
    std::cout &lt;&lt; &quot;  -&gt; car_B和car_C浅拷贝后，内存管理混乱，极易出错。\n&quot; &lt;&lt; std::endl;

    std::cout &lt;&lt; &quot;--- 2. unique_ptr 的安全演示 ---&quot; &lt;&lt; std::endl;
    {
        UniquePtrVehicle car_D(&quot;Unique-D&quot;);
    } // car_D离开作用域，它持有的unique_ptr被销毁，并自动delete了日志对象
    std::cout &lt;&lt; &quot;  -&gt; car_D 作用域结束，日志被自动销毁，无泄漏。\n&quot; &lt;&lt; std::endl;
    // UniquePtrVehicle car_E = car_D; // 这行代码会直接导致编译错误，从根源防止了风险

    std::cout &lt;&lt; &quot;--- 3. shared_ptr 的安全共享演示 ---&quot; &lt;&lt; std::endl;
    SharedPtrVehicle* s_car1 = nullptr;
    {
        s_car1 = new SharedPtrVehicle(&quot;Shared-S1&quot;);
        SharedPtrVehicle s_car2 = *s_car1; // 安全地拷贝，共享日志

        std::cout &lt;&lt; &quot;  -&gt; s_car1 和 s_car2 的作用域开始。&quot; &lt;&lt; std::endl;
    } // s_car2 在此被销毁，日志的引用计数减1，但日志对象不会被销毁
    std::cout &lt;&lt; &quot;  -&gt; s_car2 作用域结束，但日志因为还在被 s_car1 共享，所以依然存活。&quot; &lt;&lt; std::endl;

    delete s_car1; // s_car1 被销毁，日志的引用计数减为0，此时日志对象才被自动销毁
    std::cout &lt;&lt; &quot;  -&gt; 当最后一个使用者s_car1被销毁后，日志才被安全释放。&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 1. 原生指针的风险演示 ---

</code></pre></figure></div></div></div><p>程序编译并运行后，你将在控制台看到以下输出。</p>
<p>现象分析：<strong>原生指针</strong>的演示清晰地暴露了问题，<code>Raw-A</code> 的日志没有被销毁，造成了内存泄漏；<strong><code>unique_ptr</code></strong> 的演示则完美地解决了问题，<code>Unique-D</code> 的日志在对象离开作用域时被自动、准确地销毁了，并且任何拷贝企图都会在编译时就被阻止；<strong><code>shared_ptr</code></strong> 的演示展示了其核心机制，日志对象 <code>Shared-S1</code> 的生命周期不再与单个 <code>Vehicle</code> 对象绑定，而是由所有共享它的智能指针共同管理，直到最后一个使用者消失资源才被释放。</p></div></div></article>
