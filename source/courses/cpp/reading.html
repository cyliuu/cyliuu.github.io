<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">拓展案例 F2</p><h2 id="c-ext-f2-title">数据点内存池设计</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>仿真程序可能不断接收定位数据点，许多点只在当前计算周期内使用。逐点申请和释放内存会增加开销，提前准备一批可回收的存储位置则有机会减少这部分工作。本案例为 GPS 数据点实现简单内存池，用相同数量的操作比较耗时。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>定义含经度、纬度和时间戳的 <code>GPSDataPoint</code>。让 <code>GPSDataPool</code> 在构造时预分配存储，用空闲链表管理可用块，提供 <code>allocate()</code> 和 <code>deallocate()</code>。在 <code>main</code> 中分别反复执行 <code>new</code>/<code>delete</code> 与内存池分配、归还，输出耗时供比较。</p>
<figure class="case-visual case-flow"><figcaption><span>GPS 数据点的复用路径</span><span class="case-card-topic">内存池</span></figcaption><dl class="case-fields"><div><dt>准备</dt><dd>一次性预分配</dd></div><div><dt>申请</dt><dd>从空闲链表取块</dd></div><div><dt>回收</dt><dd>归还并再次使用</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 设计并实现一个简单的对象内存池

#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;chrono&gt; // 用于计时

// 需要频繁创建和销毁的对象
struct GPSDataPoint {
    double longitude;
    double latitude;
    long long timestamp;
};

// 为 GPSDataPoint 设计的内存池
class GPSDataPool {
public:
    // 构造函数，指定池的大小
    explicit GPSDataPool(size_t size) : pool_size_(size) {
        // 一次性申请大块内存
        pool_ = new GPSDataPoint[pool_size_];

        // 将所有内存块串成一个空闲链表
        // 这里用一种技巧：将下一个空闲块的地址存放在当前空闲块本身的空间里
        for (size_t i = 0; i &lt; pool_size_ - 1; ++i) {
            // reinterpret_cast 用于在指针类型间进行底层转换
            *reinterpret_cast&lt;GPSDataPoint**&gt;(&amp;pool_[i]) = &amp;pool_[i + 1];
        }
        // 链表末尾指向 nullptr
        *reinterpret_cast&lt;GPSDataPoint**&gt;(&amp;pool_[pool_size_ - 1]) = nullptr;

        // free_list_ 指向第一个空闲块
        free_list_ = &amp;pool_[0];
    }

    // 析构函数，释放整个池的内存
    ~GPSDataPool() {
        delete[] pool_;
    }

    // 分配一个对象
    GPSDataPoint* allocate() {
        if (free_list_ == nullptr) {
            // 如果内存池耗尽，可以返回空指针或抛出异常
            return nullptr; 
        }
        // 从空闲链表头部取下一个节点
        GPSDataPoint* head = free_list_;
        free_list_ = *reinterpret_cast&lt;GPSDataPoint**&gt;(head);
        return head;
    }

    // 回收一个对象
    void deallocate(GPSDataPoint* ptr) {
        if (ptr == nullptr) return;
        // 将回收的节点作为新的头节点，插入到空闲链表头部
        *reinterpret_cast&lt;GPSDataPoint**&gt;(ptr) = free_list_;
        free_list_ = ptr;
    }

private:
    GPSDataPoint* pool_;      // 指向内存池的起始地址
    GPSDataPoint* free_list_; // 指向空闲链表的头部
    size_t pool_size_;

    // 禁止拷贝和赋值
    GPSDataPool(const GPSDataPool&amp;) = delete;
    GPSDataPool&amp; operator=(const GPSDataPool&amp;) = delete;
};

int main() {
    const int ALLOCATIONS = 100000;
    const int LOOPS = 100;

    std::cout &lt;&lt; &quot;--- 性能对比测试 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;每次循环分配和释放 &quot; &lt;&lt; ALLOCATIONS &lt;&lt; &quot; 个对象, 共循环 &quot; &lt;&lt; LOOPS &lt;&lt; &quot; 次。\n&quot; &lt;&lt; std::endl;

    // 测试用例 A：使用 new / delete
    auto start_time = std::chrono::high_resolution_clock::now();
    for (int i = 0; i &lt; LOOPS; ++i) {
        std::vector&lt;GPSDataPoint*&gt; ptrs;
        ptrs.reserve(ALLOCATIONS);
        for (int j = 0; j &lt; ALLOCATIONS; ++j) {
            ptrs.push_back(new GPSDataPoint());
        }
        for (GPSDataPoint* ptr : ptrs) {
            delete ptr;
        }
    }
    auto end_time = std::chrono::high_resolution_clock::now();
    auto duration_new_delete = std::chrono::duration_cast&lt;std::chrono::milliseconds&gt;(end_time - start_time).count();
    std::cout &lt;&lt; &quot;方法 A (new/delete) 总耗时: &quot; &lt;&lt; duration_new_delete &lt;&lt; &quot; 毫秒&quot; &lt;&lt; std::endl;

    // 测试用例 B：使用内存池
    GPSDataPool pool(ALLOCATIONS); // 创建一个足够大的内存池
    start_time = std::chrono::high_resolution_clock::now();
    for (int i = 0; i &lt; LOOPS; ++i) {
        std::vector&lt;GPSDataPoint*&gt; ptrs;
        ptrs.reserve(ALLOCATIONS);
        for (int j = 0; j &lt; ALLOCATIONS; ++j) {
            ptrs.push_back(pool.allocate());
        }
        for (GPSDataPoint* ptr : ptrs) {
            pool.deallocate(ptr);
        }
    }
    end_time = std::chrono::high_resolution_clock::now();
    auto duration_pool = std::chrono::duration_cast&lt;std::chrono::milliseconds&gt;(end_time - start_time).count();
    std::cout &lt;&lt; &quot;方法 B (Memory Pool) 总耗时: &quot; &lt;&lt; duration_pool &lt;&lt; &quot; 毫秒&quot; &lt;&lt; std::endl;

    std::cout &lt;&lt; &quot;\n性能提升倍数: &quot; &lt;&lt; static_cast&lt;double&gt;(duration_new_delete) / duration_pool &lt;&lt; &quot; 倍&quot; &lt;&lt; std::endl;

    return 0;
}

<p>现象分析：运行结果直观地显示，使用内存池进行大量小对象分配和释放的耗时远小于使用 <code>new</code> 和 <code>delete</code>，性能提升通常可以达到几十甚至上百倍。这是因为内存池的 <code>allocate</code> 和 <code>deallocate</code> 操作非常轻量：<code>allocate</code> 仅仅是从链表头部取下一个指针并移动头指针，<code>deallocate</code> 则是将一个指针重新插入到链表头部，这两个操作都不涉及操作系统调用和复杂的内存查找，速度极快。</p></div></div></article>

// 用于表示二维坐标的简单结构体
struct Point {
    double x = 0.0;
    double y = 0.0;
};

// 障碍物基类，封装了所有障碍物的共同属性
class Obstacle {
public:
    // 构造函数，用于初始化障碍物位置
    Obstacle(Point pos) : position(pos) {}

    // 公共接口，用于获取障碍物位置
    Point get_position() const {
        return position;
    }

protected:
    // 受保护的成员，可以被派生类访问
    Point position;
};

// 车辆障碍物，继承自Obstacle
class VehicleObstacle : public Obstacle {
public:
    // 派生类的构造函数，通过初始化列表调用基类的构造函数
    VehicleObstacle(Point pos, double spd) : Obstacle(pos), speed(spd) {}

    // 记录车辆速度
    double speed;
};

// 行人障碍物，继承自Obstacle
class PedestrianObstacle : public Obstacle {
public:
    // 派生类的构造函数
    PedestrianObstacle(Point pos, int a) : Obstacle(pos), age(a) {}

    // 记录行人年龄
    int age;
};

int main() {
    // 创建派生类对象
    VehicleObstacle car({50.0, 1.0}, 60.0);
    PedestrianObstacle person({25.0, 0.5}, 30);

    Point car_pos = car.get_position();
    Point person_pos = person.get_position();

    std::cout &lt;&lt; &quot;--- 障碍物信息 ---&quot; &lt;&lt; std::endl;

    // 访问各自的成员，并打印信息

              &lt;&lt; &quot;速度 &quot; &lt;&lt; car.speed &lt;&lt; &quot; km/h&quot; &lt;&lt; std::endl;

    std::cout &lt;&lt; &quot;行人障碍物: &quot;
              &lt;&lt; &quot;位置 (&quot; &lt;&lt; person_pos.x &lt;&lt; &quot;, &quot; &lt;&lt; person_pos.y &lt;&lt; &quot;), &quot;
              &lt;&lt; &quot;年龄 &quot; &lt;&lt; person.age &lt;&lt; &quot; 岁&quot; &lt;&lt; std::endl;

    return 0;
}

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 58</p><h2 id="c-058-title">障碍物属性保护</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>仿真的运动障碍物需要使用底层的位置更新逻辑，但主流程通常只应按固定步骤推进它，并通过统一入口读取追踪编号。直接开放底层入口会让调用方绕过运动规则。本案例用保护继承复用基础实现，再由派生类选择向外部提供哪些操作。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>让 <code>BaseObstacle</code> 提供公共 <code>get_id()</code>，以及受保护的 <code>Point position</code> 和 <code>update_position()</code>。<code>MovingObstacle</code> 以 <code>protected</code> 继承，公开 <code>advance_one_step()</code> 和 <code>get_tracking_id()</code>。验证两个公共接口可用，外部直接调用基类 <code>get_id()</code> 时不能通过编译。</p>
<figure class="case-visual case-flow"><figcaption><span>移动障碍物的访问边界</span><span class="case-card-topic">保护继承</span></figcaption><dl class="case-fields"><div><dt>基础对象</dt><dd><code>BaseObstacle</code></dd></div><div><dt>可复用</dt><dd>位置更新</dd></div><div><dt>派生类</dt><dd>按需提供对外接口</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>#include &lt;iostream&gt;

// 用于表示二维坐标的简单结构体
struct Point {
    double x = 0.0;
    double y = 0.0;
};

// 基类：提供所有障碍物的基础功能
class BaseObstacle {
public:
    // 构造函数：初始化 ID 和位置
    BaseObstacle(int id, Point pos) : unique_id(id), position(pos) {}

    // 公共接口：获取对象的唯一 ID
    int get_id() const {
        return unique_id;
    }

protected:
    // 受保护的成员：派生类可以访问，但外部不行
    Point position;
    int unique_id;

    // 受保护的方法：只允许派生类在内部调用，用于更新状态
    void update_position(double dx, double dy) {
        position.x += dx;
        position.y += dy;
    }
};

// 派生类：使用保护继承
// 这意味着BaseObstacle的public和protected成员，
// 在MovingObstacle内部都变成了protected
class MovingObstacle : protected BaseObstacle {
public:
    // 派生类构造函数，调用基类构造函数
    MovingObstacle(int id, Point pos, double spd) 
        : BaseObstacle(id, pos), speed(spd) {}

    // 派生类提供的高级公共接口
    void advance_one_step() {
        // 在内部，它可以调用继承来的受保护方法
        update_position(speed * 0.1, 0); // 模拟向前移动
        std::cout &lt;&lt; &quot;障碍物 &quot; &lt;&lt; unique_id &lt;&lt; &quot; 前进了一步，新位置: (&quot; 
                  &lt;&lt; position.x &lt;&lt; &quot;, &quot; &lt;&lt; position.y &lt;&lt; &quot;)&quot; &lt;&lt; std::endl;
    }

    // 派生类可以选择性地将基类的某个接口重新暴露为public
    int get_tracking_id() const {
        // 在内部，它可以访问继承来的受保护成员和方法
        return get_id(); 
    }

private:
    double speed;
};

int main() {
    MovingObstacle car(101, {50.0, 1.0}, 60.0);

    // 调用派生类自己定义的 public 方法 -&gt; 成功
    std::cout &lt;&lt; &quot;--- 派生类接口测试 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;通过派生类接口获取ID: &quot; &lt;&lt; car.get_tracking_id() &lt;&lt; std::endl;
    car.advance_one_step();
    car.advance_one_step();

    // 尝试调用基类的 public 方法 -&gt; 失败
    std::cout &lt;&lt; &quot;\n--- 访问控制测试 ---&quot; &lt;&lt; std::endl;
    // 下面的代码行会导致编译错误
    // int id = car.get_id();
    // 错误信息: &#x27;BaseObstacle&#x27; is an inaccessible base of &#x27;MovingObstacle&#x27;
    // &#x27;get_id&#x27; is a member of &#x27;BaseObstacle&#x27;
    std::cout &lt;&lt; &quot;尝试直接调用 car.get_id() ... 编译失败！&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;这证明了&#x27;protected&#x27;继承成功地将基类的public接口隐藏了。&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 派生类接口测试 ---

尝试直接调用 car.get_id() ... 编译失败！
这证明了&#x27;protected&#x27;继承成功地将基类的public接口隐藏了。
</code></pre></figure></div></div></div><p>现象分析：<code>main</code> 函数可以自由调用 <code>MovingObstacle</code> 类定义的 <code>public</code> 方法（<code>advance_one_step()</code> 和 <code>get_tracking_id()</code>），其内部实现可以访问从基类继承来的 <code>protected</code> 成员 <code>position</code> 和 <code>protected</code> 方法 <code>update_position</code>；但 <code>main</code> 函数无法调用 <code>car.get_id()</code>——尽管 <code>get_id()</code> 在 <code>BaseObstacle</code> 中是 <code>public</code> 的，但因为采用了 <code>protected</code> 继承，它被降级为 <code>protected</code>，对外部不可访问，完美达到了“复用实现，但隐藏接口”的目的。</p>

    }

protected:

};

// 基类 2：信号装置
class SignalingDevice {
public:
    SignalingDevice(bool on) : signal_on(on) {}

    void turn_on() {
        signal_on = true;
        std::cout &lt;&lt; &quot;[Signal] 信号已开启。&quot; &lt;&lt; std::endl;
    }

    void display_status() const {

    }

// 派生类：救护车，同时继承 Vehicle 和 SignalingDevice
class Ambulance : public Vehicle, public SignalingDevice {
public:

<figure class="case-visual case-flow"><figcaption><span>摩托车共享同一个车辆基类</span><span class="case-card-topic">虚基类</span></figcaption><dl class="case-fields"><div><dt>顶层</dt><dd><code>Vehicle</code></dd></div><div><dt>两条分支</dt><dd>机动车与两轮车</dd></div><div><dt>核验</dt><dd>唯一车辆 ID</dd></div></dl></figure></section></header>

class Vehicle {

    Vehicle(int id) : vehicle_id(id) {

    int engine_power;

// 中间派生类 2：两轮车

class TwoWheeler : public virtual Vehicle {

// 底层派生类：摩托车

class Motorcycle : public MotorVehicle, public TwoWheeler {

    // 在创建Motorcycle对象时，MotorVehicle和TwoWheeler构造函数中

    Motorcycle(int id, int power, std::string t)

        std::cout &lt;&lt; &quot;车辆 ID: &quot; &lt;&lt; vehicle_id &lt;&lt; std::endl;

    }
};

    std::cout &lt;&lt; &quot;\n直接访问ID: &quot; &lt;&lt; moto.vehicle_id &lt;&lt; std::endl;

<article id="c-061" class="case-article" data-reading-sample="c-061" data-generated-case="true" aria-labelledby="c-061-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 61</p><h2 id="c-061-title">通用接口设置</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>仿真主流程需要在每轮更新雷达和摄像头，并查询两类设备的工作状态。它们处理的数据不同，但主流程不必为每种设备分别组织调用过程。把更新和状态查询放进一套接口后，调用方可以统一发出请求，由各类传感器完成自己的工作。本案例用抽象基类实现这一组织方式。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>让 <code>Sensor</code> 保存 <code>sensor_id</code>，提供 <code>get_id()</code>、纯虚函数 <code>void process_data() = 0;</code> 和带默认实现的虚函数 <code>std::string get_status() const</code>。让 <code>LidarSensor</code>、<code>CameraSensor</code> 公有继承并实现处理函数，仅摄像头重写状态。用 <code>Sensor</code> 指针容器统一调用，说明基类为何不能直接实例化。</p>
<figure class="case-visual case-flow"><figcaption><span>用统一接口处理多种传感器</span><span class="case-card-topic">运行时多态</span></figcaption><dl class="case-fields"><div><dt>抽象接口</dt><dd><code>Sensor</code></dd></div><div><dt>具体设备</dt><dd>激光雷达与摄像头</dd></div><div><dt>统一调用</dt><dd><code>process_data()</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>#include &lt;iostream&gt;
#include &lt;string&gt;
#include &lt;vector&gt;

// 定义抽象基类 (Abstract Base Class, ABC)
//    因为它包含了纯虚函数，所以不能被直接实例化
class Sensor {
public:
    // 构造函数
    Sensor(int id) : sensor_id(id) {}

    // 析构函数通常在基类中声明为虚函数，以确保通过基类指针
    // delete派生类对象时，能正确调用派生类的析构函数
    virtual ~Sensor() {}

    // 纯虚函数 (Pure Virtual Function)
    // 语法是 &#x27;= 0&#x27;。它没有函数体，强制派生类必须实现它
    // 定义了一个所有具体传感器都必须遵守的契约
    virtual void process_data() = 0; 

    // 虚函数 (Virtual Function)
    // 它有默认实现。派生类可以重写(override)它，也可以不重写
    // 提供了一个可选的、可定制的功能
    virtual std::string get_status() const {
        return &quot;Status: OK&quot;;
    }

    // 普通成员函数
    int get_id() const {
        return sensor_id;
    }

protected:
    int sensor_id;
};

// 定义派生类 1：激光雷达
class LidarSensor : public Sensor {
public:
    LidarSensor(int id) : Sensor(id) {}

    // 实现基类的纯虚函数
    void process_data() override {
        std::cout &lt;&lt; &quot;Lidar Sensor (ID: &quot; &lt;&lt; sensor_id 
                  &lt;&lt; &quot;): Processing 3D point cloud data...&quot; &lt;&lt; std::endl;
    }

    // 此处未重写 get_status(), 因此将使用基类的默认版本
};

// 定义派生类 2：摄像头
class CameraSensor : public Sensor {
public:
    CameraSensor(int id) : Sensor(id) {}

    // 实现基类的纯虚函数
    void process_data() override {
        std::cout &lt;&lt; &quot;Camera Sensor (ID: &quot; &lt;&lt; sensor_id 
                  &lt;&lt; &quot;): Capturing and processing image frame...&quot; &lt;&lt; std::endl;
    }

    // 重写(override)基类的虚函数，提供一个定制化的版本
    std::string get_status() const override {
        return &quot;Status: Calibrated and OK&quot;;
    }
};

// 程序入口展示多态调用
int main() {
    // 创建一个能存放各种传感器指针的容器
    std::vector&lt;Sensor*&gt; sensor_suite;
    sensor_suite.push_back(new LidarSensor(101));
    sensor_suite.push_back(new CameraSensor(202));

    std::cout &lt;&lt; &quot;--- Universal Sensor Processing Loop ---&quot; &lt;&lt; std::endl;
    // 统一的接口调用
    for (Sensor* sensor_ptr : sensor_suite) {
        sensor_ptr-&gt;process_data(); // 动态绑定：运行时决定调用哪个版本
        std::cout &lt;&lt; &quot;  &quot; &lt;&lt; sensor_ptr-&gt;get_status() &lt;&lt; std::endl; // 动态绑定
    }

    // 释放内存
    for (Sensor* sensor_ptr : sensor_suite) {
        delete sensor_ptr;
    }
    sensor_suite.clear();

    // 尝试实例化抽象基类 -&gt; 失败
    // Sensor s(0); // 这行代码会导致编译错误
    // 错误信息: cannot declare variable &#x27;s&#x27; to be of abstract type &#x27;Sensor&#x27;
    std::cout &lt;&lt; &quot;\n--- Abstract Class Test ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;尝试创建Sensor类的对象... 编译失败！&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;这证明了包含纯虚函数的类是抽象的，不能被实例化。&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- Universal Sensor Processing Loop ---
Lidar Sensor (ID: 101): Processing 3D point cloud data...
  Status: OK
Camera Sensor (ID: 202): Capturing and processing image frame...
  Status: Calibrated and OK

--- Abstract Class Test ---
尝试创建Sensor类的对象... 编译失败！
这证明了包含纯虚函数的类是抽象的，不能被实例化。
</code></pre></figure></div></div></div><p>现象分析：在 <code>for</code> 循环中，完全相同的 <code>sensor_ptr-&gt;process_data()</code> 代码，当指针指向 <code>LidarSensor</code> 对象时执行 <code>LidarSensor</code> 的版本，指向 <code>CameraSensor</code> 对象时执行 <code>CameraSensor</code> 的版本，这就是多态（通过动态绑定实现）；<code>get_status()</code> 中 <code>LidarSensor</code> 未重写而调用基类默认版本输出 <code>Status: OK</code>，<code>CameraSensor</code> 调用自己重写的版本；任何试图创建 <code>Sensor</code> 实例的尝试都会导致编译失败，因为 <code>process_data</code> 被声明为纯虚函数，<code>Sensor</code> 成为抽象类。</p>
<blockquote class="case-tip">[提示] 取消 <code>Sensor s(0);</code> 这行的注释再编译，会报错 <code>cannot declare variable &#x27;s&#x27; to be of abstract type &#x27;Sensor&#x27;</code>，直观感受抽象类不可被实例化。</blockquote></div></div></article>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 62</p><h2 id="c-062-title">数据模板化缓存</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>雷达点云和摄像头图像在送入感知算法前都可能短暂排队。如果处理速度跟不上采集速度，容量有限的缓冲区需要让新数据覆盖最旧的数据。两类输入的内容不同，管理规则却可以共用。本案例用一个类模板实现循环缓存，再用不同数据和容量验证覆盖行为。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>定义 <code>LidarData</code>（点云 ID、点数）与 <code>ImageData</code>（帧 ID、分辨率）。让 <code>DataBuffer&lt;T, N&gt;</code> 按 <code>N</code> 确定容量，提供 <code>add_data(const T&amp; data)</code> 和 <code>display_buffer()</code>，满时覆盖最老数据。用容量为 3 和 2 的雷达、图像缓存分别测试超量写入。</p>
<figure class="case-visual case-flow"><figcaption><span>不同传感器共用缓存</span><span class="case-card-topic">类模板</span></figcaption><dl class="case-fields"><div><dt>缓存容量</dt><dd><code>3</code> 条点云、<code>2</code> 帧图像</dd></div><div><dt>容量参数</dt><dd><code>N</code></dd></div><div><dt>写满后</dt><dd>覆盖最旧数据</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>#include &lt;iostream&gt;
#include &lt;cstddef&gt;
#include &lt;vector&gt;
#include &lt;string&gt;

// 定义两种传感器数据
struct LidarData {
    int cloud_id;
    int point_count;
};

struct ImageData {
    int frame_id;
    std::string resolution;
};

// 为不同数据类型提供对应的显示方式
void print_data(const LidarData&amp; data) {
    std::cout &lt;&lt; &quot;  - Point Cloud ID: &quot; &lt;&lt; data.cloud_id
              &lt;&lt; &quot;, Points: &quot; &lt;&lt; data.point_count &lt;&lt; std::endl;
}

void print_data(const ImageData&amp; data) {
    std::cout &lt;&lt; &quot;  - Frame ID: &quot; &lt;&lt; data.frame_id
              &lt;&lt; &quot;, Resolution: &quot; &lt;&lt; data.resolution &lt;&lt; std::endl;
}

// T 表示数据类型，N 表示固定容量
template &lt;typename T, std::size_t N&gt;
class DataBuffer {
public:
    DataBuffer() : current_index(0) {
        static_assert(N &gt; 0, &quot;缓冲区容量必须大于0&quot;);
        buffer.reserve(N);
    }

    void add_data(const T&amp; data) {
        if (buffer.size() &lt; N) {
            buffer.push_back(data);
        } else {
            buffer[current_index] = data;
            current_index = (current_index + 1) % N;
        }
    }

    void display_buffer(const std::string&amp; title) const {
        std::cout &lt;&lt; &quot;--- &quot; &lt;&lt; title &lt;&lt; &quot; (Max Size: &quot; &lt;&lt; N
                  &lt;&lt; &quot;) ---&quot; &lt;&lt; std::endl;
        for (const T&amp; data : buffer) {
            print_data(data);
        }
    }

private:
    std::vector&lt;T&gt; buffer;
    std::size_t current_index;
};

int main() {
    // 使用同一个类模板创建两种缓冲区
    DataBuffer&lt;LidarData, 3&gt; lidar_buffer;
    DataBuffer&lt;ImageData, 2&gt; image_buffer;

    std::cout &lt;&lt; &quot;Populating buffers...&quot; &lt;&lt; std::endl;
    // 添加4份激光雷达数据，最后一份会覆盖第一份
    lidar_buffer.add_data({1001, 5000});
    lidar_buffer.add_data({1002, 5100});
    lidar_buffer.add_data({1003, 4950});
    lidar_buffer.add_data({1004, 5050}); // 这将覆盖 ID 1001

    // 添加3份图像数据，最后一份会覆盖第一份
    image_buffer.add_data({95, &quot;1920x1080&quot;});
    image_buffer.add_data({96, &quot;1920x1080&quot;});
    image_buffer.add_data({97, &quot;1280x720&quot;});  // 这将覆盖 ID 95

    std::cout &lt;&lt; &quot;\nDisplaying buffer contents:&quot; &lt;&lt; std::endl;
    lidar_buffer.display_buffer(&quot;Lidar Data Buffer&quot;);
    image_buffer.display_buffer(&quot;Image Data Buffer&quot;);

    return 0;
}
</code></pre></figure></div></div>

<article id="c-ext-g1" class="case-article" data-reading-sample="c-ext-g1" data-generated-case="true" aria-labelledby="c-ext-g1-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">拓展案例 G1</p><h2 id="c-ext-g1-title">点云处理SIMD优化</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>激光雷达每次扫描产生大量坐标，感知程序往往要对整批点做同一种运算。以点云平移为例，各点的计算相互独立，处理器支持 SIMD 时可以同时更新多组坐标。本案例比较普通循环与并行实现，除了记录耗时，也核对两种方式是否得到一致结果。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>定义含 <code>float x, y, z</code> 和 <code>padding</code>、按 16 字节对齐的 <code>Point</code>。用 <code>translate_points_scalar</code> 逐点平移，<code>translate_points_simd</code> 按架构选择 ARM NEON 或 x86 SSE，每次处理 4 个点。尾部不足 4 个点及其他架构走标量路径。对同样的大规模点云计时并比较坐标，不预设加速倍数。</p>
<figure class="case-visual case-flow"><figcaption><span>点云平移的两种实现</span><span class="case-card-topic">SIMD 对照</span></figcaption><dl class="case-fields"><div><dt>相同任务</dt><dd>给坐标加位移</dd></div><div><dt>标量版本</dt><dd>逐点处理</dd></div><div><dt>向量版本</dt><dd>每批处理 <code>4</code> 个点</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>#include &lt;cmath&gt;
#include &lt;chrono&gt;
#include &lt;iostream&gt;
#include &lt;vector&gt;

#if defined(__aarch64__) || defined(__ARM_NEON) || defined(__ARM_NEON__)
#include &lt;arm_neon.h&gt;
#define USE_NEON
#elif defined(__SSE__)
#include &lt;immintrin.h&gt;
#define USE_SSE
#endif

// 16字节结构与128位寄存器宽度一致
struct alignas(16) Point {
    float x, y, z, padding;
};

void translate_points_scalar(std::vector&lt;Point&gt;&amp; points, float tx, float ty, float tz) {
    for (Point&amp; point : points) {
        point.x += tx;
        point.y += ty;
        point.z += tz;
    }
}

void translate_points_simd(std::vector&lt;Point&gt;&amp; points, float tx, float ty, float tz) {
#if defined(USE_NEON)
    const float32x4_t offset_x = vdupq_n_f32(tx);
    const float32x4_t offset_y = vdupq_n_f32(ty);
    const float32x4_t offset_z = vdupq_n_f32(tz);
    std::size_t index = 0;
    for (; index + 3 &lt; points.size(); index += 4) {
        // 交错加载得到4个x、4个y、4个z和4个padding
        float32x4x4_t values = vld4q_f32(&amp;points[index].x);
        values.val[0] = vaddq_f32(values.val[0], offset_x);
        values.val[1] = vaddq_f32(values.val[1], offset_y);
        values.val[2] = vaddq_f32(values.val[2], offset_z);
        vst4q_f32(&amp;points[index].x, values);
    }
#elif defined(USE_SSE)
    const __m128 offset_x = _mm_set1_ps(tx);
    const __m128 offset_y = _mm_set1_ps(ty);
    const __m128 offset_z = _mm_set1_ps(tz);
    std::size_t index = 0;
    for (; index + 3 &lt; points.size(); index += 4) {
        __m128 point0 = _mm_load_ps(&amp;points[index].x);
        __m128 point1 = _mm_load_ps(&amp;points[index + 1].x);
        __m128 point2 = _mm_load_ps(&amp;points[index + 2].x);
        __m128 point3 = _mm_load_ps(&amp;points[index + 3].x);
        _MM_TRANSPOSE4_PS(point0, point1, point2, point3);
        point0 = _mm_add_ps(point0, offset_x);
        point1 = _mm_add_ps(point1, offset_y);
        point2 = _mm_add_ps(point2, offset_z);
        _MM_TRANSPOSE4_PS(point0, point1, point2, point3);
        _mm_store_ps(&amp;points[index].x, point0);
        _mm_store_ps(&amp;points[index + 1].x, point1);
        _mm_store_ps(&amp;points[index + 2].x, point2);
        _mm_store_ps(&amp;points[index + 3].x, point3);
    }
#else
    std::size_t index = 0;
#endif
    // 处理不足4个的尾部元素，或在不支持内建函数的平台执行标量回退
    for (; index &lt; points.size(); ++index) {
        points[index].x += tx;
        points[index].y += ty;
        points[index].z += tz;
    }
}

int main() {
    const std::size_t point_count = 500000;
    std::vector&lt;Point&gt; scalar_points(point_count);

    for (std::size_t index = 0; index &lt; point_count; ++index) {
        const float value = static_cast&lt;float&gt;(index) * 0.01f;
        scalar_points[index] = {value, value * 2.0f, value * 3.0f, 0.0f};
    }
    std::vector&lt;Point&gt; simd_points = scalar_points;

    auto start_scalar = std::chrono::high_resolution_clock::now();
    translate_points_scalar(scalar_points, 1.5f, -2.5f, 3.0f);
    auto end_scalar = std::chrono::high_resolution_clock::now();

    auto start_simd = std::chrono::high_resolution_clock::now();
    translate_points_simd(simd_points, 1.5f, -2.5f, 3.0f);
    auto end_simd = std::chrono::high_resolution_clock::now();

    bool results_match = true;
    for (std::size_t index = 0; index &lt; point_count; ++index) {
        if (std::fabs(scalar_points[index].x - simd_points[index].x) &gt; 0.0001f ||
            std::fabs(scalar_points[index].y - simd_points[index].y) &gt; 0.0001f ||
            std::fabs(scalar_points[index].z - simd_points[index].z) &gt; 0.0001f) {
            results_match = false;
            break;
        }
    }

    const double scalar_ms = std::chrono::duration&lt;double, std::milli&gt;(
        end_scalar - start_scalar).count();
    const double simd_ms = std::chrono::duration&lt;double, std::milli&gt;(
        end_simd - start_simd).count();
    std::cout &lt;&lt; &quot;标量耗时: &quot; &lt;&lt; scalar_ms &lt;&lt; &quot; ms\n&quot;
              &lt;&lt; &quot;SIMD耗时: &quot; &lt;&lt; simd_ms &lt;&lt; &quot; ms\n&quot;
              &lt;&lt; &quot;结果校验: &quot; &lt;&lt; (results_match ? &quot;一致&quot; : &quot;不一致&quot;) &lt;&lt; std::endl;

    return results_match ? 0 : 1;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>标量耗时: 2.66029 ms
SIMD耗时: 2.03792 ms
结果校验: 一致
</code></pre></figure></div></div></div><p class="case-source-caption">耗时为本次运行结果，会随硬件、编译配置和系统负载变化。</p><p>程序成功编译运行后，控制台输出类似如下（具体时间取决于 CPU 性能）。</p>
<p>现象分析：ARM 平台使用 NEON，x86 平台使用 SSE，其他平台使用标量回退，因此示例不依赖额外的兼容头文件。<code>alignas(16)</code> 保证每个点满足 128 位寄存器的对齐要求；SIMD 分支每轮处理 4 个点，并在结尾用标量循环处理不足 4 个的尾部元素。示例耗时仅用于演示测量方法，实际结果应以 Release 构建下的多轮测试为准。</p></div></div></article>
<article id="c-ext-g2" class="case-article" data-reading-sample="c-ext-g2" data-generated-case="true" aria-labelledby="c-ext-g2-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">拓展案例 G2</p><h2 id="c-ext-g2-title">数据采集多线程实现</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>车辆传感器持续产生新数据，处理模块不一定能在同一时刻取走它们。采集和处理分别运行时，需要一个共享位置暂存数据，还要处理队列为空或双方同时访问的情况。本案例用生产者和消费者模拟这两个环节，观察线程怎样交接数据并在有新数据时继续工作。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>以全局 <code>std::queue&lt;int&gt;</code> 为缓冲区，用 <code>std::mutex</code> 保护队列、<code>std::condition_variable</code> 通知线程。<code>data_collector</code> 生成整数，加锁入队后通知；<code>data_processor</code> 等到队列有数据时取出处理。在 <code>main</code> 启动两个线程，观察采集与处理过程。</p>
<figure class="case-visual case-flow"><figcaption><span>采集与处理线程的协作</span><span class="case-card-topic">生产者与消费者</span></figcaption><dl class="case-fields"><div><dt>采集线程</dt><dd>生成数据并入队</dd></div><div><dt>共享缓冲</dt><dd>受互斥锁保护</dd></div><div><dt>处理线程</dt><dd>等待通知并出队</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>#include &lt;iostream&gt;
#include &lt;thread&gt;
#include &lt;queue&gt;
#include &lt;mutex&gt;
#include &lt;condition_variable&gt;
#include &lt;chrono&gt;

// 定义共享资源
std::queue&lt;int&gt; data_buffer;
std::mutex mtx; // 互斥锁，用于保护 data_buffer
std::condition_variable cv; // 条件变量，用于线程间通信

// 生产者线程函数：模拟传感器数据采集
void data_collector() {
    int data_point = 0;
    while (true) {
        // 模拟采集数据需要时间
        std::this_thread::sleep_for(std::chrono::milliseconds(500));

        // 使用 std::unique_lock 来管理互斥锁
        std::unique_lock&lt;std::mutex&gt; lock(mtx);

        data_buffer.push(data_point);
        std::cout &lt;&lt; &quot;[采集器]:  生产了数据 -&gt; &quot; &lt;&lt; data_point &lt;&lt; std::endl;

        data_point++;

        // 锁必须在通知之前或之后释放，这里 unique_lock 会自动管理
        // 通知一个正在等待的线程
        cv.notify_one();
    }
}

// 消费者线程函数：模拟数据处理
void data_processor() {
    while (true) {
        std::unique_lock&lt;std::mutex&gt; lock(mtx);

        // 条件变量的 wait 方法会：
        // 检查 lambda 条件是否为 true
        // 如果是 false，它会原子地解锁 mutex 并让线程休眠
        // 当被 notify 唤醒时，它会重新锁住 mutex 并再次检查条件
        cv.wait(lock, []{ return !data_buffer.empty(); });

        int data = data_buffer.front();
        data_buffer.pop();

        // 解锁，让生产者可以继续生产
        lock.unlock();

        // 在锁之外处理数据，减少锁的占用时间
        std::cout &lt;&lt; &quot;[处理器]:           消费了数据 &lt;- &quot; &lt;&lt; data &lt;&lt; std::endl;
        // 模拟处理数据需要时间
        std::this_thread::sleep_for(std::chrono::milliseconds(100));
    }
}

int main() {
    // 创建并启动线程
    std::thread collector_thread(data_collector);
    std::thread processor_thread(data_processor);

    std::cout &lt;&lt; &quot;主线程：已启动采集和处理线程...&quot; &lt;&lt; std::endl;

    // 让线程运行一段时间
    // 在真实应用中，主线程会有自己的任务，并通过某种机制决定何时结束子线程
    collector_thread.join(); // 等待线程结束（在此例中是无限循环）
    processor_thread.join();

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出 · 过程截取</span></figcaption><pre tabindex="0"><code>主线程：已启动采集和处理线程...
[采集器]:  生产了数据 -&gt; 0
[处理器]:           消费了数据 &lt;- 0
[采集器]:  生产了数据 -&gt; 1
[处理器]:           消费了数据 &lt;- 1
[采集器]:  生产了数据 -&gt; 2
[处理器]:           消费了数据 &lt;- 2
</code></pre></figure></div></div></div><p class="case-source-caption">终端保留持续运行过程的一段输出，观察后需主动停止程序。</p><p>程序成功编译运行后，控制台会看到类似以下不断滚动的交错输出。</p>
<p>现象分析：输出日志清晰地展示了“采集器”和“处理器”交替执行而非严格一先一后，证明两个任务运行在不同线程上实现了并行工作；由于 <code>std::mutex</code> 的存在，对 <code>data_buffer</code> 的每一次访问都是受保护的；当缓冲区为空时“处理器”通过 <code>cv.wait()</code> 进入高效休眠而不空转，直到“采集器”通过 <code>cv.notify_one()</code> 发出通知才被唤醒，这是一种高效的事件驱动同步机制。</p>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 63</p><h2 id="c-063-title">车辆地图系统集成</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>仿真车辆收到移动指令后，需要知道目标格是空地还是障碍物。道路及障碍物的位置由地图维护，车辆负责自己的坐标和移动逻辑。两部分约定查询接口后，即使地图内部换一种存储方式，车辆仍可按同样的方式判断是否前进。本案例用小型网格验证这种协作。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用二维数据（如 <code>vector&lt;string&gt;</code>）在 <code>Map</code> 中保存障碍物 <code>&#x27;#&#x27;</code> 和空地 <code>&#x27;.&#x27;</code>，提供 <code>bool is_obstacle(int x, int y) const</code>。<code>Vehicle</code> 保存坐标，在 <code>move(char direction, const Map&amp; map)</code> 中先查询目标格，再决定是否移动。在 <code>main</code> 中测试空地与障碍物。</p>
<figure class="case-visual case-flow"><figcaption><span>车辆移动前查询地图</span><span class="case-card-topic">模块协作</span></figcaption><dl class="case-fields"><div><dt>车辆</dt><dd>提出目标坐标</dd></div><div><dt>地图</dt><dd><code>is_obstacle()</code> 判断</dd></div><div><dt>行动</dt><dd>更新位置或拒绝移动</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 模拟车辆与地图两个模块的简单集成与交互

#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;string&gt;

// 定义地图类 (模块A)
// 负责存储环境信息，并提供查询接口
class Map {
private:
    // 使用 vector&lt;string&gt; 模拟一个二维地图
    std::vector&lt;std::string&gt; grid;

public:
    // 构造函数，初始化一个简单的地图
    Map() {
        grid = {
            &quot;..........&quot;,
            &quot;.#........&quot;,
            &quot;..........&quot;,
            &quot;......#...&quot;,
            &quot;..........&quot;
        };
    }

    // 公共接口：判断指定坐标是否有障碍物
    // const 成员函数，保证不会修改地图状态
    bool is_obstacle(int x, int y) const {
        // 边界检查，防止越界
        if (y &lt; 0 || y &gt;= grid.size() || x &lt; 0 || x &gt;= grid[0].size()) {
            return true; // 越界视为障碍物
        }
        return grid[y][x] == &#x27;#&#x27;;
    }

    // 辅助函数：打印地图
    void display() const {
        for (const auto&amp; row : grid) {
            std::cout &lt;&lt; row &lt;&lt; std::endl;
        }
    }
};

// 定义车辆类 (模块B)
// 负责自身的移动逻辑，但依赖地图模块提供的信息
class Vehicle {
private:
    int x, y; // 车辆的坐标

public:
    // 构造函数，设置初始位置
    Vehicle(int start_x, int start_y) : x(start_x), y(start_y) {}

    // 根据地图信息移动车辆
    // 它接收一个对Map对象的const引用，表明它需要使用地图，但不会修改它
    void move(char direction, const Map&amp; map) {
        int target_x = x;
        int target_y = y;

        switch (direction) {
            case &#x27;W&#x27;: target_y--; break; // 上
            case &#x27;S&#x27;: target_y++; break; // 下
            case &#x27;A&#x27;: target_x--; break; // 左
            case &#x27;D&#x27;: target_x++; break; // 右
        }

        std::cout &lt;&lt; &quot;指令: 尝试移动到 (&quot; &lt;&lt; target_x &lt;&lt; &quot;, &quot; &lt;&lt; target_y &lt;&lt; &quot;)... &quot;;

        // 调用地图接口检查目标位置
        if (map.is_obstacle(target_x, target_y)) {
            std::cout &lt;&lt; &quot;失败! 目标位置是障碍物。&quot; &lt;&lt; std::endl;
        } else {
            // 检查通过，才更新自身状态
            x = target_x;
            y = target_y;
            std::cout &lt;&lt; &quot;成功! &quot; &lt;&lt; std::endl;
        }
    }

    // 获取当前位置
    void print_position() const {
        std::cout &lt;&lt; &quot;车辆当前位置: (&quot; &lt;&lt; x &lt;&lt; &quot;, &quot; &lt;&lt; y &lt;&lt; &quot;)&quot; &lt;&lt; std::endl;
    }
};

// main函数 (集成与测试)
int main() {
    Map world_map;      // 创建地图对象
    Vehicle my_car(0, 0); // 创建车辆对象，初始位置(0,0)

    std::cout &lt;&lt; &quot;--- 初始状态 ---&quot; &lt;&lt; std::endl;
    world_map.display();
    my_car.print_position();
    std::cout &lt;&lt; &quot;------------------&quot; &lt;&lt; std::endl;

    // 第 1 次移动：尝试向右移动 (目标是(1,0)，安全)
    my_car.move(&#x27;D&#x27;, world_map);
    my_car.print_position();
    std::cout &lt;&lt; std::endl;

    // 第 2 次移动：尝试向下移动 (目标是(1,1)，有障碍物)
    my_car.move(&#x27;S&#x27;, world_map);
    my_car.print_position(); // 位置应保持不变
    std::cout &lt;&lt; std::endl;

    // 第 3 次移动：再次向下移动 (在(1,1)再次尝试，仍然失败)
    my_car.move(&#x27;S&#x27;, world_map);
    my_car.print_position(); // 位置应保持不变

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 初始状态 ---
..........
.#........
..........
......#...
..........
车辆当前位置: (0, 0)
------------------
指令: 尝试移动到 (1, 0)... 成功! 
车辆当前位置: (1, 0)

指令: 尝试移动到 (1, 1)... 失败! 目标位置是障碍物。
车辆当前位置: (1, 0)

指令: 尝试移动到 (1, 1)... 失败! 目标位置是障碍物。
车辆当前位置: (1, 0)
</code></pre></figure></div></div></div><p>当程序被成功编译并运行后，你将在控制台窗口看到以下输出，清晰地展示了两个模块间的交互过程和结果。</p>
<p>现象分析：<code>Vehicle</code> 对象和 <code>Map</code> 对象被成功创建并各自初始化；当 <code>my_car</code> 调用 <code>move</code> 方法时，它将 <code>world_map</code> 对象作为参数传了进去；在 <code>move</code> 方法内部，车辆的移动逻辑成功地调用了 <code>world_map.is_obstacle()</code> 接口来查询信息；根据接口返回的 <code>true</code> 或 <code>false</code>，车辆的移动行为受到了正确的影响——遇到障碍物时移动失败，位置保持不变，这证明两个独立的模块成功地协同工作了。</p></div></div></article>
<article id="c-064" class="case-article" data-reading-sample="c-064" data-generated-case="true" aria-labelledby="c-064-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 64</p><h2 id="c-064-title">命令行进度条刷新</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>系统初始化、数据转换等操作需要一定时间。如果终端迟迟没有反馈，使用者很难判断任务仍在执行还是已经中断。进度条可以用同一行持续显示当前完成度，避免刷新时刷满整个终端。本案例用一段模拟进度练习这种显示方式，为命令行仿真界面准备基本反馈。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 <code>for</code> 循环将模拟进度从 0% 更新到 100%。在控制台同一行输出由 <code>=</code> 等字符组成的进度条和实时百分比，每次覆盖上一帧，观察进度条是否连续增长。</p>
<figure class="case-visual case-flow"><figcaption><span>让进度条在同一行增长</span><span class="case-card-topic">CLI 刷新</span></figcaption><dl class="case-fields"><div><dt>进度</dt><dd><code>0%</code> 到 <code>100%</code></dd></div><div><dt>图形</dt><dd>逐步增加填充符号</dd></div><div><dt>刷新</dt><dd>覆盖上一帧</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 在命令行中实现一个动态更新的进度条

#include &lt;iostream&gt;
#include &lt;string&gt;
#include &lt;vector&gt;
#include &lt;chrono&gt; // 用于延时
#include &lt;thread&gt; // 用于延时

int main() {
    const int total_progress = 100;
    const int bar_width = 50;

    std::cout &lt;&lt; &quot;正在初始化系统，请稍候...&quot; &lt;&lt; std::endl;

    // 使用 for 循环模拟从0到100的进度
    for (int i = 0; i &lt;= total_progress; ++i) {
        // 使用回车符 &#x27;\r&#x27; 将光标移回当前行开头
        //    它的作用是让光标回到当前行的行首，但不会换行
        //    这样，下一次的 std::cout 输出就会覆盖掉本行的旧内容
        std::cout &lt;&lt; &quot;\r[&quot;;

        // 算法设计：根据百分比计算进度条的长度
        int pos = bar_width * i / total_progress;

        // 打印已完成部分的进度条
        for (int j = 0; j &lt; bar_width; ++j) {
            if (j &lt; pos) {
                std::cout &lt;&lt; &quot;=&quot;;
            } else if (j == pos) {
                std::cout &lt;&lt; &quot;&gt;&quot;;
            } else {
                std::cout &lt;&lt; &quot; &quot;;
            }
        }

        // 打印百分比，并使用空格填充以覆盖之前的数字（例如 9% -&gt; 10%）
        std::cout &lt;&lt; &quot;] &quot; &lt;&lt; i &lt;&lt; &quot;% &quot;;

        // 刷新输出流
        //    确保缓冲区的内容立即被打印到屏幕上
        std::cout &lt;&lt; std::flush;

        // 延时，让我们能用肉眼看到动画效果
        std::this_thread::sleep_for(std::chrono::milliseconds(50));
    }

    // 循环结束后，打印一个换行符，将光标移到新的一行
    std::cout &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;初始化完成！&quot; &lt;&lt; std::endl;

    return 0;
}

<article id="c-ext-h1" class="case-article" data-reading-sample="c-ext-h1" data-generated-case="true" aria-labelledby="c-ext-h1-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">拓展案例 H1</p><h2 id="c-ext-h1-title">SFML静态场景绘制</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>命令行仿真可以用字符表示车辆和障碍物，切换到图形界面后，使用者可以从形状和相对位置直接理解场景，同时通过文字查看当前车速。在加入运动前，可以先用一帧固定画面检查窗口、图形和文字是否按预期显示。本案例用 SFML 搭建这个静态场景。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 SFML 创建标题为 <code>Static Simulation Scene</code> 的 800×600 窗口。用绿色 <code>sf::CircleShape</code> 表示主车、红色 <code>sf::RectangleShape</code> 表示障碍物。加载字体，用 <code>sf::Text</code> 在左上角显示如“速度：50 km/h”的状态，并在主循环处理关闭事件。</p>
<figure class="case-visual case-flow"><figcaption><span>绘制第一帧交通场景</span><span class="case-card-topic">SFML 图形窗口</span></figcaption><dl class="case-fields"><div><dt>主车</dt><dd>绿色圆形</dd></div><div><dt>障碍</dt><dd>红色矩形</dd></div><div><dt>提示文字</dt><dd><code>sf::Text</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 SFML 绘制静态道路、车辆与障碍物

#include &lt;SFML/Graphics.hpp&gt;
#include &lt;iostream&gt;
#include &lt;string&gt;

#ifndef FONT_FILE_PATH
#define FONT_FILE_PATH &quot;arial.ttf&quot;
#endif

int main() {
    // 创建仿真窗口
    sf::RenderWindow window(sf::VideoMode(800, 600), &quot;Static Simulation Scene&quot;);

    // 绿色圆形表示主车
    sf::CircleShape ego_vehicle(30.f); // 半径为30像素
    ego_vehicle.setFillColor(sf::Color::Green);
    ego_vehicle.setPosition(100.f, 250.f); // 设置在窗口中的位置

    // 红色矩形表示障碍物
    sf::RectangleShape obstacle(sf::Vector2f(50.f, 50.f)); // 50x50像素的正方形
    obstacle.setFillColor(sf::Color::Red);
    obstacle.setPosition(500.f, 250.f);

    // 加载字体并准备状态文本
    sf::Font font;
    if (!font.loadFromFile(FONT_FILE_PATH)) {
        std::cerr &lt;&lt; &quot;Error: Could not load font &#x27;&quot; &lt;&lt; FONT_FILE_PATH
                  &lt;&lt; &quot;&#x27;&quot; &lt;&lt; std::endl;
        return -1;
    }

    sf::Text status_text;
    status_text.setFont(font);
    status_text.setString(&quot;速度: 50 km/h\n模式: 自动驾驶&quot;);
    status_text.setCharacterSize(24); // 字体大小
    status_text.setFillColor(sf::Color::White);
    status_text.setPosition(10.f, 10.f); // 左上角位置

    // 事件处理与渲染循环
    while (window.isOpen()) {
        sf::Event event;
        while (window.pollEvent(event)) {
            if (event.type == sf::Event::Closed) {
                window.close();
            }
        }

        window.clear(sf::Color(50, 50, 50));

        window.draw(ego_vehicle);
        window.draw(obstacle);
        window.draw(status_text);

        window.display();
    }

    return 0;
}
</code></pre></figure></div><a class="row-action case-download" href="downloads/materials/c-ext-h1/arial.ttf" download="arial.ttf">下载 arial.ttf ↓</a></div>

<article id="c-ext-h2" class="case-article" data-reading-sample="c-ext-h2" data-generated-case="true" aria-labelledby="c-ext-h2-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">拓展案例 H2</p><h2 id="c-ext-h2-title">SFML转向灯动画实现</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>图形仿真要让使用者看出车辆何时开启转向灯。车身的位置应保持稳定，改变的只是车灯状态。把正常、左灯亮和右灯亮画在同一张雪碧图上，程序就能按时间切换显示区域。本案例通过循环亮灭演示如何在静态车辆画面上表达状态变化。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 <code>sf::Texture</code> 加载 <code>car_sprites.png</code>，以 <code>sf::Sprite</code> 显示。通过 <code>sf::Clock</code> 和 <code>sf::Time</code> 定时（如每 0.5 秒），调用 <code>sprite.setTextureRect()</code>，按正常、左灯亮、正常、右灯亮循环。下表采用 300×100 像素整图，每帧 100×100 像素。</p>
<p>*表73 文本帧变化示例*</p>
<div class="reading-table"><table><thead><tr><th>帧 0 (正常)</th><th>帧 1 (左灯亮)</th><th>帧 2 (右灯亮)</th></tr></thead><tbody><tr><td>(0, 0)</td><td>(100, 0)</td><td>(200, 0)</td></tr></tbody></table></div>
<figure class="case-visual case-flow"><figcaption><span>从车辆贴图切换灯光帧</span><span class="case-card-topic">SFML 帧动画</span></figcaption><dl class="case-fields"><div><dt>素材</dt><dd><code>car_sprites.png</code></dd></div><div><dt>画面</dt><dd>正常、左灯、右灯</dd></div><div><dt>帧更新</dt><dd><code>setTextureRect()</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用SFML的Sprite Sheet实现车辆转向灯动画

#include &lt;SFML/Graphics.hpp&gt;
#include &lt;iostream&gt;

#ifndef CAR_SPRITES_FILE_PATH
#define CAR_SPRITES_FILE_PATH &quot;car_sprites.png&quot;
#endif

int main() {
    sf::RenderWindow window(sf::VideoMode(800, 600), &quot;Vehicle Animation&quot;);

    // 加载包含全部动画帧的雪碧图
    sf::Texture vehicle_texture;
    if (!vehicle_texture.loadFromFile(CAR_SPRITES_FILE_PATH)) {
        std::cerr &lt;&lt; &quot;Error: Could not load texture &#x27;&quot;
                  &lt;&lt; CAR_SPRITES_FILE_PATH &lt;&lt; &quot;&#x27;&quot; &lt;&lt; std::endl;
        return -1;
    }

    // 创建精灵并绑定纹理
    sf::Sprite vehicle_sprite;
    vehicle_sprite.setTexture(vehicle_texture);

    // 定义每一帧在雪碧图中的矩形区域
    // sf::IntRect(左上角x, 左上角y, 宽度, 高度)
    sf::IntRect frames[] = {
        sf::IntRect(0, 0, 100, 100),   // 帧 0：正常
        sf::IntRect(100, 0, 100, 100), // 帧 1：左灯亮
        sf::IntRect(0, 0, 100, 100),   // 帧 2：正常
        sf::IntRect(200, 0, 100, 100)  // 帧 3：右灯亮
    };
    int current_frame = 0;
    int total_frames = 4;

    // 用时钟控制动画帧率
    sf::Clock clock;
    sf::Time frame_time = sf::seconds(0.5f); // 每0.5秒切换一帧

    // 设置精灵的初始位置和显示的帧
    vehicle_sprite.setPosition(350, 250);
    vehicle_sprite.setTextureRect(frames[current_frame]);

    // 事件处理与渲染循环
    while (window.isOpen()) {
        sf::Event event;
        while (window.pollEvent(event)) {
            if (event.type == sf::Event::Closed) {
                window.close();
            }
        }

        // 达到帧间隔后切换纹理区域
        if (clock.getElapsedTime() &gt; frame_time) {
            current_frame = (current_frame + 1) % total_frames;
            vehicle_sprite.setTextureRect(frames[current_frame]);
            clock.restart();
        }

        window.clear(sf::Color(50, 50, 50));
        window.draw(vehicle_sprite);
        window.display();
    }

    return 0;
}
</code></pre></figure></div><a class="row-action case-download" href="downloads/materials/c-ext-h2/car_sprites.png" download="car_sprites.png">下载 car_sprites.png ↓</a></div>
<div class="case-result"><h3>运行效果</h3><p class="case-source-caption">运行需配置与工程兼容的 SFML 图形库，图形结果见下方效果示意。</p><p>程序运行后，将出现一个图形窗口。窗口中央会显示一辆车，车辆的转向灯会按照“无灯 → 左灯闪 → 无灯 → 右灯闪 → 无灯 ...”的顺序，大约每半秒切换一次状态，形成一个连续、循环的动画效果。现象分析：程序不再是静态的，<code>sf::Clock</code> 成为了动画的“心跳”，驱动着画面的周期性更新；<code>setTextureRect()</code> 是实现雪碧图动画的核心函数，通过改变这个矩形区域，我们告诉 <code>SFML</code>“请从这张大纹理中，剪裁出这一小块来显示”；这个案例完整地展示了 2D 游戏和仿真中，最基本、最高效的动画实现原理。</p>
