      <article id="c-001" class="case-article" data-reading-sample="c-001" aria-labelledby="case-one-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">案例 1</p>
              <h2 id="case-one-title">氛围灯颜色解析</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>在现代智能汽车中，车载氛围灯已成为提升用户体验的重要配置。工程师通过车载网络发送指令控制氛围灯颜色，这些颜色指令通常使用紧凑的十六进制格式传输。作为一名车载软件工程师，需要正确解析从总线接收到的颜色数据，将其转换为 UI 界面能理解和显示的 0-255 范围十进制数值。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">从 CAN 总线分析仪截获到一条控制氛围灯颜色的报文，核心数据为十六进制颜色值 <code>#2F80ED</code>，遵循网页颜色表示法 <code>#RRGGBB</code>：前两位 <code>2F</code> 为红色分量，中间两位 <code>80</code> 为绿色分量，后两位 <code>ED</code> 为蓝色分量。手动将这三个十六进制数分别转换为十进制整数。</p>
            <figure class="case-visual">
              <figcaption><span>氛围灯控制报文</span><code>#2F80ED</code></figcaption>
              <dl class="case-fields color-fields">
                <div><dt><i aria-hidden="true"></i>R 红</dt><dd><code>2F</code></dd></div>
                <div><dt><i aria-hidden="true"></i>G 绿</dt><dd><code>80</code></dd></div>
                <div><dt><i aria-hidden="true"></i>B 蓝</dt><dd><code>ED</code></dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body">
          <div class="case-method case-method-compact">
            <h3>案例代码</h3>
            <pre class="text-sample"><code>红色分量 (R) 解析：2F
按权展开法：(2F)₁₆ = 2 × 16¹ + 15 × 16⁰ = 32 + 15 = 47
绿色分量 (G) 解析：80
(80)₁₆ = 8 × 16¹ + 0 × 16⁰ = 128
蓝色分量 (B) 解析：ED
(ED)₁₆ = 14 × 16¹ + 13 × 16⁰ = 224 + 13 = 237</code></pre>
          </div>
          <div class="case-result">
            <h3>运行效果</h3>
            <div class="case-effect color-preview" aria-hidden="true"></div>
            <p>最终得到氛围灯颜色的十进制 RGB 值：(47, 128, 237)。</p>
          </div>
        </div>
      </article>

      <article id="c-002" class="case-article" data-reading-sample="c-002" aria-labelledby="case-two-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">案例 2</p>
              <h2 id="case-two-title">行车状态码解码</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>在车辆的远程诊断和数据记录系统中，为了节约存储空间和网络带宽，车辆状态信息通常打包成紧凑的二进制数据帧发送回数据中心。作为车辆诊断工程师，需要从原始十六进制数据流中精确解码出车辆在某一时刻的关键运行状态。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">一辆测试车通过串口发送回一个 4 字节状态码：<code>0x01 0x02 0x00 0x64</code>。协议规定：第 1 字节为挡位（<code>0x01</code> 代表 D 挡），第 2 字节为驾驶模式（<code>0x02</code> 代表舒适模式），第 3、4 字节组成 16 位无符号整数表示车速（单位 km/h，采用大端字节序）。根据协议解析挡位、驾驶模式和车速。</p>
            <figure class="case-visual">
              <figcaption><span>行车状态报文</span><span>4 字节</span></figcaption>
              <dl class="case-fields status-fields">
                <div><dt>挡位</dt><dd><code>01</code></dd></div>
                <div><dt>模式</dt><dd><code>02</code></dd></div>
                <div><dt>车速</dt><dd><code>00 64</code></dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body">
          <div class="case-method case-method-compact">
            <h3>案例代码</h3>
            <pre class="text-sample"><code>1. 挡位解析：第1字节 0x01
(01)₁₆ = 1 × 16⁰ = 1 → 查表得 D（前进挡）
2. 驾驶模式解析：第2字节 0x02
(02)₁₆ = 2 → 查表得 舒适模式
3. 车速解析：第3、4字节 0x00 0x64（大端：高位在前）
组合为 0x0064：(0064)₁₆ = 6 × 16¹ + 4 × 16⁰ = 100 km/h</code></pre>
          </div>
          <div class="case-result">
            <h3>运行效果</h3>
            <p>解码结果：D 挡、舒适模式、车速 100 km/h。</p>
          </div>
          <blockquote class="case-tip">[提示] 若协议规定小端字节序，<code>0x01 0x2C</code> 应组合为 <code>0x2C01</code>（11265 km/h），结果明显错误——字节序是通信协议中必须严格遵守的“铁律”。</blockquote>
        </div>
      </article>

      <article id="c-003" class="case-article" data-reading-sample="c-003" aria-labelledby="c-003-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">案例 3</p>
              <h2 id="c-003-title">欢迎横幅打印</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>在真实汽车开发中，中控系统、液晶仪表盘在车辆启动时都会先展示一个启动画面，是用户与车辆智能系统的第一次“握手”。作为初级车载软件工程师，第一个任务就是编写一个启动程序，把抽象的代码思想转化为能被执行、有实际输出的应用程序。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">编写一个单文件 C++ 程序 <code>main.cpp</code>，使用 <code>std::cout</code> 在控制台打印一个由 ASCII 字符组成的多行欢迎横幅，包含简单的汽车图案和欢迎词。</p>
            <figure class="case-visual case-flow">
              <figcaption><span>从源文件到欢迎横幅</span><span>单文件</span></figcaption>
              <dl class="case-fields">
                <div><dt>源文件</dt><dd><code>main.cpp</code></dd></div>
                <div><dt>输出语句</dt><dd><code>std::cout</code></dd></div>
                <div><dt>终端效果</dt><dd>ASCII 横幅</dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body">
          <div class="case-method case-method-compact">
            <h3>案例代码</h3>
            <div class="case-code-files">
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>#include &lt;iostream&gt;

int main() {
    std::cout &lt;&lt; "******************************************" &lt;&lt; std::endl;

      <article id="c-004" class="case-article" data-reading-sample="c-004" aria-labelledby="c-004-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">案例 4</p>
              <h2 id="c-004-title">欢迎信息模块化</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>将所有代码都放在 <code>main.cpp</code> 里看似简单，但随着功能增多，文件会变得臃肿、难以维护，团队协作时多名工程师无法同时修改同一文件。专业实践要求模块化——把不同功能的代码拆分到不同文件，让每个文件只负责一件事。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">将<a href="#c-003">案例 3「欢迎横幅打印」</a>的欢迎信息显示功能进行模块化拆分：创建头文件 <code>greeter.h</code> 声明 <code>void displayWelcomeMessage();</code> 并用 <code>#pragma once</code> 防止重复包含；创建源文件 <code>greeter.cpp</code> 实现该函数；修改 <code>main.cpp</code> 通过 <code>#include "greeter.h"</code> 引入声明并直接调用。</p>
            <figure class="case-visual case-flow">
              <figcaption><span>欢迎模块的文件分工</span><span>3 个文件</span></figcaption>
              <dl class="case-fields">
                <div><dt>接口声明</dt><dd><code>greeter.h</code></dd></div>
                <div><dt>函数实现</dt><dd><code>greeter.cpp</code></dd></div>
                <div><dt>入口调用</dt><dd><code>main.cpp</code></dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body">
          <div class="case-method case-method-compact">
            <h3>案例代码</h3>
            <div class="case-code-files">
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>greeter.h</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>#pragma once
void displayWelcomeMessage();
</code></pre>
              </figure>
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>greeter.cpp</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>#include "greeter.h"
#include &lt;iostream&gt;

void displayWelcomeMessage() {
    std::cout &lt;&lt; "******************************************" &lt;&lt; std::endl;
    std::cout &lt;&lt; "** Welcome to the Auto Driving System!  **" &lt;&lt; std::endl;
    std::cout &lt;&lt; "******************************************" &lt;&lt; std::endl;
}
</code></pre>
              </figure>
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>#include "greeter.h"

int main() {
    displayWelcomeMessage();
    return 0;
}
</code></pre>
              </figure>
            </div>
          </div>
          <div class="case-result">
            <h3>运行效果</h3>
            <div class="case-effect case-terminal">
              <div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div>
              <div class="case-terminal-body">
                <figure class="code-panel terminal-command">
                  <figcaption><span>构建与运行命令</span></figcaption>
                  <pre tabindex="0"><code>g++ main.cpp greeter.cpp -o welcome
./welcome</code></pre>
                </figure>
                <div class="case-run-outputs">
                  <figure class="code-panel">
                    <figcaption><span>模块化欢迎横幅</span></figcaption>
                    <pre tabindex="0"><code>******************************************
** Welcome to the Auto Driving System!  **
******************************************
</code></pre>
                  </figure>
                </div>
              </div>
            </div>
            <p>编译运行后，控制台显示三行横幅，保留原有的欢迎词。拆分后，<code>main.cpp</code> 变得简洁，欢迎功能成为独立可复用的模块。</p>
          </div>
        </div>
      </article>

      <article id="c-ext-a1" class="case-article" data-reading-sample="c-ext-a1" aria-labelledby="c-ext-a1-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">拓展案例 A1</p>
              <h2 id="c-ext-a1-title">项目跨平台构建</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>在专业软件开发领域，“在我电脑上能跑”是一句禁忌语。一个成功的软件产品必须能在不同操作系统和开发环境中被稳定构建和运行。本案例将“欢迎信息模块”从熟悉的开发环境移植到另外两个专业环境，验证代码的可移植性。</p>
            </div>
          </div>

      <article id="c-ext-a2" class="case-article" data-reading-sample="c-ext-a2" aria-labelledby="c-ext-a2-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">拓展案例 A2</p>
              <h2 id="c-ext-a2-title">版本信息注入</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>专业软件都有版本号，直接写死在代码里每次发布都要手动修改，容易遗忘或改错。更专业的方法是将版本信息从代码中分离，由构建系统统一管理。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">在<a href="reading.html?task=t-p01-b02#c-004">案例 4「欢迎信息模块化」</a>的基础上，用 CMake 构建项目，通过 <code>target_compile_definitions</code> 定义 <code>APP_VERSION</code> 宏并注入版本号，在 C++ 代码中读取并打印。</p>
            <figure class="case-visual case-flow">
              <figcaption><span>版本号如何进入程序</span><span>CMake → C++</span></figcaption>
              <dl class="case-fields">
                <div><dt>构建配置</dt><dd><code>CMake</code></dd></div>
                <div><dt>编译宏</dt><dd><code>APP_VERSION</code></dd></div>
                <div><dt>注入值</dt><dd><code>1.0.1</code></dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body">
          <div class="case-method case-method-compact">
            <h3>案例代码</h3>
            <div class="case-code-files">
              <figure class="code-panel" data-code-language="cmake" data-book-excerpt="true"><figcaption><span>CMakeLists.txt</span><span class="code-kind">CMake</span></figcaption><pre tabindex="0"><code># CMakeLists.txt
cmake_minimum_required(VERSION 3.10)
project(WelcomeBanner)
add_executable(version_demo main.cpp greeter.cpp)
# 由构建系统注入版本号，避免将其写死在 C++ 源文件中。
set(APP_VERSION &quot;1.0.1&quot; CACHE STRING &quot;Application version&quot;)
target_compile_definitions(version_demo PRIVATE APP_VERSION=${APP_VERSION})
</code></pre></figure>
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>// 展示由 CMake 注入的版本信息

#include "greeter.h"

#include &lt;iostream&gt;

// 将未加引号的 APP_VERSION 宏转换为字符串字面量
#define STRINGIFY_IMPL(value) #value
#define TOSTRING(value) STRINGIFY_IMPL(value)

int main() {
#ifdef APP_VERSION
    std::cout &lt;&lt; "System Version: " &lt;&lt; TOSTRING(APP_VERSION) &lt;&lt; std::endl;
#else
    std::cout &lt;&lt; "Version: Not Defined" &lt;&lt; std::endl;
#endif

    displayWelcomeMessage();
    return 0;
}
</code></pre>
              </figure>
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>greeter.h</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>// 声明欢迎信息模块的接口

#pragma once

void displayWelcomeMessage();
</code></pre>
              </figure>
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>greeter.cpp</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>// 实现欢迎信息模块

#include "greeter.h"

#include &lt;iostream&gt;

void displayWelcomeMessage() {
    std::cout &lt;&lt; "******************************************" &lt;&lt; std::endl;
    std::cout &lt;&lt; "** Welcome to the Auto Driving System!  **" &lt;&lt; std::endl;
    std::cout &lt;&lt; "******************************************" &lt;&lt; std::endl;
}
</code></pre>
              </figure>
            </div>
          </div>
          <div class="case-result">
            <h3>运行效果</h3>
            <div class="case-effect case-terminal">
              <div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div>
              <div class="case-terminal-body">
                <figure class="code-panel terminal-command">
                  <figcaption><span>构建与运行命令</span></figcaption>
                  <pre tabindex="0"><code>cmake -S . -B build -DAPP_VERSION=1.0.1
cmake --build build
./build/version_demo

g++ main.cpp greeter.cpp -o version_demo_undefined
./version_demo_undefined</code></pre>
                </figure>
                <div class="case-run-outputs">
                  <figure class="code-panel">
                    <figcaption><span>启用版本定义</span></figcaption>
                    <pre tabindex="0"><code>System Version: 1.0.1
******************************************
** Welcome to the Auto Driving System!  **
******************************************
</code></pre>
                  </figure>
                  <figure class="code-panel">
                    <figcaption><span>未定义版本</span></figcaption>
                    <pre tabindex="0"><code>Version: Not Defined
******************************************
** Welcome to the Auto Driving System!  **
******************************************
</code></pre>
                  </figure>
                </div>
              </div>
            </div>
            <p>使用 CMake 构建时，<code>-DAPP_VERSION=1.0.1</code> 将版本值传给构建配置，程序输出 <code>System Version: 1.0.1</code>。直接用 <code>g++</code> 编译时未传入版本宏，程序输出 <code>Version: Not Defined</code>。</p>
          </div>
        </div>
      </article>

      <article id="c-ai-b" class="case-article" data-reading-sample="c-ai-b" aria-labelledby="c-ai-b-title" data-aigc-sample="true">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">案例 B</p>
              <h2 id="c-ai-b-title">AIGC程序功能分析</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
<p>代码不仅是写给机器执行的，更是写给团队成员阅读和维护的。规范命名能够传递数据与功能的含义，清晰注释则有助于理解设计意图和关键逻辑。随着软件规模扩大，两者共同影响协作效率与维护成本。本案例让你扮演“代码注释官”，借助 AIGC 阅读一段没有注释的程序，观察命名如何帮助人和工具理解代码。</p>
</div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
<p class="frame-note">将一段没有注释的 C++ 代码粘贴给任意 AIGC 工具（如 Kimi、ChatGPT、文心一言等），为其添加说明变量用途和关键代码块逻辑的注释，核对生成的注释如何结合 <code>rectangle_length</code>、<code>area</code>、<code>perimeter</code> 等标识符说明程序功能。</p>
<figure class="case-visual case-flow">
              <figcaption><span>矩形计算中的标识符</span><span>AIGC 对照</span></figcaption>
              <dl class="case-fields">
                <div><dt>长度变量值</dt><dd><code>10.5</code></dd></div>
                <div><dt>面积</dt><dd><code>area</code></dd></div>
                <div><dt>周长</dt><dd><code>perimeter</code></dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><section class="case-prompt"><h4>提示词（Prompt）</h4><div class="case-prompt-body"><p>请为给定的 C++ 代码添加详细注释，重点解释每个变量（标识符）的用途，以及关键代码块的逻辑。</p>
<p>请保留原有标识符、计算逻辑和输出语句，仅添加注释；结合 <code>rectangle_length</code>、<code>rectangle_width</code>、<code>area</code> 和 <code>perimeter</code> 的命名说明程序的功能，并区分标识符与 <code>int</code>、<code>double</code>、<code>return</code> 等关键字。</p></div></section><section class="aigc-material"><p>将上述提示词与下面的矩形计算程序一并提交给 AIGC。</p><div class="case-code-files"><figure class="code-panel" data-code-language="cpp" data-code-label="原始片段 · main.cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 一段没有注释的C++代码片段

#include &lt;iostream&gt;

int main() {
    double rectangle_length = 10.5;
    double rectangle_width = 4.0;

    double area = rectangle_length * rectangle_width;
    double perimeter = 2 * (rectangle_length + rectangle_width);

    std::cout &lt;&lt; &quot;Rectangle Details:&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;Length: &quot; &lt;&lt; rectangle_length &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;Width: &quot; &lt;&lt; rectangle_width &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;Area: &quot; &lt;&lt; area &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;Perimeter: &quot; &lt;&lt; perimeter &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></section></div>
<div class="case-result"><h3>运行效果</h3><p>生成的注释应说明 <code>rectangle_length</code> 表示矩形的长度、<code>area</code> 表示面积、<code>perimeter</code> 表示周长，并对应到代码中的计算过程。<code>int</code>、<code>double</code>、<code>return</code> 是 C++ 关键字，<code>rectangle_length</code> 等是程序员定义的标识符，两者应分别解释。可结合代码与运行结果核对注释是否准确。</p><div class="case-effect case-terminal">
              <div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div>
              <div class="case-terminal-body">
                
                <div class="case-run-outputs">
                  <figure class="code-panel">
                    <figcaption><span>C++ 程序输出</span></figcaption>
                    <pre tabindex="0"><code>Rectangle Details:
Length: 10.5
Width: 4
Area: 42
Perimeter: 29
</code></pre>
                  </figure>
                </div>
              </div>
            </div><blockquote class="case-tip">[提示] 可以把标识符改成无意义的单字母 <code>l</code>、<code>w</code>、<code>a</code>、<code>p</code>，再让 AIGC 注释一次，观察它还能否准确猜出每个变量的用途——这能直观体会规范命名的重要性。</blockquote></div></div></article>

      <article id="c-005" class="case-article" data-reading-sample="c-005" aria-labelledby="c-005-title">
        <header class="case-intro">

            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>自动驾驶汽车最终是为人类服务的，人机交互（HCI）是其不可或缺的一部分。在开发初期虽然没有华丽的图形界面，但可以通过控制台模拟最核心的交互功能。本案例将带你搭建程序与用户之间最基本的沟通桥梁——向用户提问、接收键盘输入、回显信息，完成一次完整的“对话”闭环。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">编写程序模拟车载导航系统与驾驶员的基础交互：用 <code>std::cout</code> 输出提示“请输入目的地：”；等待用户输入一个不包含空格的单词；用 <code>std::cin</code> 读取并存入字符数组；最后回显“导航已设置为：[目的地]”。</p>
            <figure class="case-visual case-flow">
              <figcaption><span>目的地交互</span><span>标准输入</span></figcaption>
              <dl class="case-fields">
                <div><dt>提示</dt><dd>请输入目的地</dd></div>
                <div><dt>输入</dt><dd><code>公司</code></dd></div>
                <div><dt>反馈</dt><dd>导航已设置</dd></div>
              </dl>
            </figure>

        <div class="case-body">

            <h3>案例代码</h3>
            <div class="case-code-files">
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>// 读取并回显用户输入

#include &lt;iostream&gt;

int main() {
    // 定义一个字符数组，可存放最多 49 个字符外加一个结束符
    char destination[50];

    // 输出提示信息，不用 std::endl 让输入紧跟在冒号后

      <article id="c-006" class="case-article" data-reading-sample="c-006" aria-labelledby="c-006-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">案例 6</p>
              <h2 id="c-006-title">仪表盘信息输出</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>一个专业的车载数字仪表盘必须以清晰、对齐的格式展示关键信息，任何格式混乱都可能分散驾驶员注意力。仅用 <code>std::cout</code> 手动加空格对齐会非常繁琐。本案例引入源自 C 语言的 <code>printf</code> 函数，教你像“排版师”一样精确控制每个字符和数字的显示位置与格式。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">定义三个变量：当前车速 <code>88</code>（<code>int</code>）、剩余油量 <code>52.5</code>（<code>double</code>）、当前挡位 <code>'D'</code>（<code>char</code>），用 <code>printf</code> 按“车速： 88 km/h | 油量： 52.5% | 挡位： D”格式输出。</p>
            <figure class="case-visual case-flow">
              <figcaption><span>仪表盘字段</span><span>格式化输出</span></figcaption>
              <dl class="case-fields">
                <div><dt>车速</dt><dd><code>88 km/h</code></dd></div>
                <div><dt>油量</dt><dd><code>52.5%</code></dd></div>
                <div><dt>挡位</dt><dd><code>D</code></dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body">

                <pre tabindex="0"><code>// 使用 printf 函数进行格式化输出

#include &lt;cstdio&gt;

int main() {
    int current_speed = 88;
    double fuel_level = 52.5;
    char current_gear = 'D';

    // %d 整数;%.1f 浮点数保留1位小数;%% 输出百分号;%c 字符;\n 换行
    printf("车速: %d km/h | 油量: %.1f%% | 挡位: %c\n",
           current_speed, fuel_level, current_gear);

    return 0;
}

</code></pre>

      <article id="c-008" class="case-article" data-reading-sample="c-008" aria-labelledby="c-008-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">案例 8</p>
              <h2 id="c-008-title">累计里程计算</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>每辆汽车的仪表盘都有一个核心数据——累计行驶里程（Odometer），记录车辆总行程。通常用整型（<code>int</code>）变量存储里程，但在极端情况下变量可能达到存储上限。当一个整数变量试图存储超出其最大容量的数值时会发生什么？本案例通过模拟“临界”场景，让你深刻理解整型数据类型的边界和“整数溢出”概念。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">定义 <code>int total_mileage</code> 初始化为 <code>2147483600</code>（接近 <code>int</code> 最大值），<code>int trip_distance = 1000</code>，计算新总里程观察溢出；再用 <code>unsigned int</code> 做同样计算对比结果。</p>
            <figure class="case-visual case-flow">
              <figcaption><span>里程计算的整数边界</span><span>类型对照</span></figcaption>
              <dl class="case-fields">
                <div><dt>累计里程</dt><dd><code>2147483600</code></dd></div>
                <div><dt>新增里程</dt><dd><code>1000 km</code></dd></div>
                <div><dt>对照类型</dt><dd>有符号／无符号</dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body">
          <div class="case-method case-method-compact">
            <h3>案例代码</h3>
            <div class="case-code-files">
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>// 观察整型溢出（Integer Overflow）现象

#include &lt;iostream&gt;
#include &lt;limits&gt;

int main() {
    int total_mileage = 2147483600;
    int trip_distance = 1000;
    int new_total_mileage = total_mileage + trip_distance;

    std::cout &lt;&lt; "int 类型的最大值是: " &lt;&lt; std::numeric_limits&lt;int&gt;::max() &lt;&lt; std::endl;
    std::cout &lt;&lt; "计算后的新里程: " &lt;&lt; new_total_mileage &lt;&lt; " km  &lt;-- 结果出乎意料！" &lt;&lt; std::endl;

    unsigned int u_total_mileage = 2147483600;
    unsigned int u_trip_distance = 1000;
    unsigned int u_new_total_mileage = u_total_mileage + u_trip_distance;
    std::cout &lt;&lt; "unsigned int 计算后的新里程: " &lt;&lt; u_new_total_mileage &lt;&lt; " km" &lt;&lt; std::endl;

    return 0;
}
</code></pre>
              </figure>
            </div>
          </div>
          <div class="case-result">
            <h3>运行效果</h3>
            <div class="case-effect case-terminal">
              <div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div>
              <div class="case-terminal-body">
                
                <div class="case-run-outputs">
                  <figure class="code-panel">
                    <figcaption><span>运行输出</span></figcaption>
                    <pre tabindex="0"><code>int 类型的最大值是: 2147483647
计算后的新里程: -2147482696 km  &lt;-- 结果出乎意料！
unsigned int 计算后的新里程: 2147484600 km
</code></pre>
                  </figure>
                </div>
              </div>
            </div>
            <p>本次运行中，有符号计算出现负数。C++ 有符号整数溢出的行为未定义，终端数值只代表本次运行。使用无符号整数计算时，这组输入得到 2147484600 km。</p>
          </div>
          <blockquote class="case-tip">[提示] 代码里的 <code>std::numeric_limits&lt;int&gt;::max()</code> 是查询数据类型极限值的工具，模板将在后续深入，这里先拿来用。</blockquote>
        </div>
      </article>

                <pre tabindex="0"><code>// 使用字符型数据的算术特性实现简单加密

#include &lt;iostream&gt;

int main() {
    char original_command = 'A'; // 'A' 代表开锁指令
    int shift_key = 3;           // 密钥向后移动3位

    // 'A' 的ASCII码是65，65 + 3 = 68，正是字符 'D' 的ASCII码
    char encrypted_command = original_command + shift_key;

    std::cout &lt;&lt; "加密密钥: " &lt;&lt; shift_key &lt;&lt; std::endl;
    std::cout &lt;&lt; "加密后的指令: " &lt;&lt; encrypted_command &lt;&lt; std::endl;

    return 0;
}

      <article id="c-011" class="case-article" data-reading-sample="c-011" aria-labelledby="c-011-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">案例 11</p>
              <h2 id="c-011-title">电量衰减模拟</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>电动汽车电池有“容量衰减”特性——随使用时间增加，能储存的总电量逐渐下降。本案例开发一个小仿真程序，预测电池几年后的理论剩余容量，需要处理百分比和小数，这是 <code>int</code>、<code>char</code> 无法精确表示的，需要实型（浮点型）。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">定义常量 <code>INITIAL_CAPACITY = 70.0</code>（kWh）、<code>ANNUAL_DECAY_RATE = 0.035</code>（年衰减率），计算 5 年后的理论剩余容量，公式“最终容量 = 初始容量 × (1 - 年衰减率)^年数”，用 <code>&lt;cmath&gt;</code> 的 <code>pow()</code> 做乘方。</p>
            <figure class="case-visual case-flow">
              <figcaption><span>电池容量预测</span><span>浮点计算</span></figcaption>
              <dl class="case-fields">
                <div><dt>初始容量</dt><dd><code>70.0 kWh</code></dd></div>
                <div><dt>年衰减率</dt><dd><code>3.5%</code></dd></div>
                <div><dt>年数</dt><dd><code>5 年</code></dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body">
          <div class="case-method case-method-compact">
            <h3>案例代码</h3>
            <div class="case-code-files">
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>// 使用 double 类型和数学函数模拟电池容量衰减

#include &lt;iostream&gt;
#include &lt;iomanip&gt;
#include &lt;cmath&gt;   // pow() 等数学函数

int main() {
    const double INITIAL_CAPACITY = 70.0;
    const double ANNUAL_DECAY_RATE = 0.035;
    const int YEARS = 5;

    double remaining_factor = 1.0 - ANNUAL_DECAY_RATE; // 965
    double final_capacity = INITIAL_CAPACITY * pow(remaining_factor, YEARS);

    std::cout &lt;&lt; "初始容量: " &lt;&lt; INITIAL_CAPACITY &lt;&lt; " kWh" &lt;&lt; std::endl;
    std::cout &lt;&lt; YEARS &lt;&lt; "年后的理论剩余容量: "
              &lt;&lt; std::fixed &lt;&lt; std::setprecision(2)
              &lt;&lt; final_capacity &lt;&lt; " kWh" &lt;&lt; std::endl;

    return 0;
}
</code></pre>
              </figure>
            </div>
          </div>

5年后的理论剩余容量: 58.58 kWh
</code></pre>
                  </figure>

            </div>
            <p>输出“5年后的理论剩余容量： 58.58 kWh”。</p>

          <blockquote class="case-tip">[提示] <code>pow(底数, 指数)</code> 是 <code>&lt;cmath&gt;</code> 库提供的乘方函数，库函数的原理后续深入，这里先调用；<code>std::fixed</code> 与 <code>std::setprecision(2)</code> 用于保留两位小数。</blockquote>

                <pre tabindex="0"><code>// 使用常量和算术运算符计算油耗

#include &lt;iostream&gt;
#include &lt;iomanip&gt;  // std::fixed 与 std::setprecision 用于格式化输出

int main() {
    double fuel_consumed_liters = 35.5;  // 消耗的油量（升）
    int distance_traveled_km = 410;      // 行驶的距离（公里）

    const double FACTOR_100 = 100.0;     // 常量：百公里的换算系数

    // double 与 int 混合运算时，int 自动提升为 double，保证浮点除法的精度
    double fuel_consumption = (fuel_consumed_liters / distance_traveled_km) * FACTOR_100;

    std::cout &lt;&lt; "--- 百公里油耗计算 ---" &lt;&lt; std::endl;
    std::cout &lt;&lt; "行驶里程: " &lt;&lt; distance_traveled_km &lt;&lt; " km" &lt;&lt; std::endl;
    std::cout &lt;&lt; "消耗油量: " &lt;&lt; fuel_consumed_liters &lt;&lt; " L" &lt;&lt; std::endl;
    std::cout &lt;&lt; "计算出的百公里油耗为: "
              &lt;&lt; std::fixed &lt;&lt; std::setprecision(1)   // 保留一位小数
              &lt;&lt; fuel_consumption &lt;&lt; " L/100km" &lt;&lt; std::endl;
    return 0;
}
</code></pre>

      <article id="c-013" class="case-article" data-reading-sample="c-013" aria-labelledby="c-013-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">案例 13</p>
              <h2 id="c-013-title">物体坐标更新</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>自动驾驶仿真需要实时追踪和更新环境中每个动态物体的位置。物体在二维平面上移动时，x、y 坐标通常根据不同的物理规则在同一时间步内更新。C++ 的逗号运算符允许在一个语句中执行多个操作，但当多种运算符混合时，计算顺序（优先级）就变得至关重要。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">定义两个 <code>double</code> 变量 <code>x</code>、<code>y</code> 初始化为 <code>0.0</code>，模拟三次连续更新。每次迭代 <code>x</code> 增加 2、<code>y</code> 变为更新后的 <code>x</code> 减去 5，且必须用逗号运算符把 <code>x</code>、<code>y</code> 的更新写在同一赋值语句中，每次迭代后打印 <code>x</code>、<code>y</code> 的当前值。</p>
            <figure class="case-visual case-flow">
              <figcaption><span>坐标更新规则</span><span>逗号运算符</span></figcaption>
              <dl class="case-fields">
                <div><dt>初始坐标</dt><dd><code>(0.0, 0.0)</code></dd></div>
                <div><dt>每步横坐标</dt><dd><code>x + 2</code></dd></div>
                <div><dt>每步纵坐标</dt><dd><code>新 x − 5</code></dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body">
          <div class="case-method case-method-compact">
            <h3>案例代码</h3>
            <div class="case-code-files">
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>// 使用逗号运算符说明运算符优先级

#include &lt;iostream&gt;
#include &lt;iomanip&gt;

int main() {
    double x = 0.0, y = 0.0;
    std::cout &lt;&lt; std::fixed &lt;&lt; std::setprecision(1);
    std::cout &lt;&lt; "初始状态: x = " &lt;&lt; x &lt;&lt; ", y = " &lt;&lt; y &lt;&lt; std::endl;

    // 赋值运算符 '=' 的优先级低于逗号 ','，所以括号必须保留！
    // 逗号表达式从左到右：先 x += 2.0，再用新 x 算 x - 5.0，取最右结果赋给 y
    y = (x += 2.0, x - 5.0);   // x=2.0, y=-3.0
    std::cout &lt;&lt; "第1次更新后: x = " &lt;&lt; x &lt;&lt; ", y = " &lt;&lt; y &lt;&lt; std::endl;

    y = (x += 2.0, x - 5.0);   // x=4.0, y=-1.0
    std::cout &lt;&lt; "第2次更新后: x = " &lt;&lt; x &lt;&lt; ", y = " &lt;&lt; y &lt;&lt; std::endl;

    y = (x += 2.0, x - 5.0);   // x=6.0, y=1.0
    std::cout &lt;&lt; "第3次更新后: x = " &lt;&lt; x &lt;&lt; ", y = " &lt;&lt; y &lt;&lt; std::endl;
    return 0;
}
</code></pre>
              </figure>
            </div>
          </div>
          <div class="case-result">
            <h3>运行效果</h3>
            <div class="case-effect case-terminal">
              <div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div>
              <div class="case-terminal-body">
                
                <div class="case-run-outputs">
                  <figure class="code-panel">
                    <figcaption><span>运行输出</span></figcaption>
                    <pre tabindex="0"><code>初始状态: x = 0.0, y = 0.0
第1次更新后: x = 2.0, y = -3.0
第2次更新后: x = 4.0, y = -1.0
第3次更新后: x = 6.0, y = 1.0
</code></pre>
                  </figure>
                </div>
              </div>
            </div>
            <p>控制台依次输出三次更新后的坐标：第1次 x=2.0, y=-3.0；第2次 x=4.0, y=-1.0；第3次 x=6.0, y=1.0。</p>
          </div>
          <blockquote class="case-tip">[提示] 若把括号去掉写成 <code>y = x += 2.0, x - 5.0</code>，因赋值运算符优先级高于逗号，会先算 <code>y = x</code>，结果完全错误——这正是知识点33要讲的运算符优先级。</blockquote>
        </div>
      </article>

      <article id="c-014" class="case-article" data-reading-sample="c-014" aria-labelledby="c-014-title">
        <header class="case-intro">
          <div class="case-overview">
            <div class="case-title">
              <p class="eyebrow">案例 14</p>
              <h2 id="c-014-title">平均耗时计算</h2>
            </div>
            <div class="case-background">
              <h3 class="case-subhead">案例背景</h3>
              <p>自动驾驶系统的车载主控芯片（ECU）需要在极短时间内处理海量传感器数据包，衡量其性能的关键指标是“平均处理耗时”。计算时若两个整数相除，小数部分会被无情丢弃，导致结果严重失真。本案例通过显式类型转换确保计算精度。</p>
            </div>
          </div>
          <section class="case-information">
            <h3 class="case-subhead">案例信息</h3>
            <p class="frame-note">定义 <code>int total_seconds = 3</code>（总耗时 3 秒）、<code>int packets_processed = 1000</code>（处理 1000 个数据包），计算每包平均耗时（毫秒）。先用整数除法观察错误结果，再用 <code>static_cast&lt;double&gt;()</code> 修正计算，得到精确结果。</p>
            <figure class="case-visual case-flow">
              <figcaption><span>平均耗时的输入</span><span>类型转换</span></figcaption>
              <dl class="case-fields">
                <div><dt>总耗时</dt><dd><code>3 s</code></dd></div>
                <div><dt>数据包</dt><dd><code>1000</code></dd></div>
                <div><dt>输出单位</dt><dd><code>ms</code></dd></div>
              </dl>
            </figure>
          </section>
        </header>
        <div class="case-body">
          <div class="case-method case-method-compact">
            <h3>案例代码</h3>
            <div class="case-code-files">
              <figure class="code-panel" data-code-language="cpp">
                <figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption>
                <pre tabindex="0"><code>// 使用 static_cast 处理整数除法造成的精度损失

#include &lt;iostream&gt;
#include &lt;iomanip&gt;

int main() {
    int total_seconds = 3;
    int packets_processed = 1000;

    // 错误方式：整数除法 3 / 1000 = 0，小数被丢弃，0 * 1000 仍为 0
    double avg_time_ms_wrong = (total_seconds / packets_processed) * 1000;
    std::cout &lt;&lt; "错误计算结果: " &lt;&lt; avg_time_ms_wrong &lt;&lt; " ms" &lt;&lt; std::endl;

    // 正确方式：static_cast 先把 total_seconds 临时转成 double（3.0）
    double avg_time_ms_correct = (static_cast&lt;double&gt;(total_seconds) / packets_processed) * 1000;
    std::cout &lt;&lt; "正确计算结果: "
              &lt;&lt; std::fixed &lt;&lt; std::setprecision(1)
              &lt;&lt; avg_time_ms_correct &lt;&lt; " ms" &lt;&lt; std::endl;
    return 0;
}
</code></pre>
              </figure>
            </div>
          </div>
          <div class="case-result">
            <h3>运行效果</h3>
            <div class="case-effect case-terminal">
              <div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div>
              <div class="case-terminal-body">
                
                <div class="case-run-outputs">
                  <figure class="code-panel">
                    <figcaption><span>运行输出</span></figcaption>
                    <pre tabindex="0"><code>错误计算结果: 0 ms
正确计算结果: 3.0 ms
</code></pre>
                  </figure>
                </div>
              </div>
            </div>
            <p>控制台对比输出：错误计算结果 0 ms、正确计算结果 3.0 ms。</p>
          </div>
        </div>
      </article>

                <pre tabindex="0"><code>#include &lt;iostream&gt;
#include &lt;cstdlib&gt; // atof 函数

int main(int argc, char* argv[]) {
    if (argc &lt; 3) {
        std::cout &lt;&lt; "错误：参数不足！" &lt;&lt; std::endl;
        std::cout &lt;&lt; "用法: " &lt;&lt; argv[0] &lt;&lt; " [速度] [时间]" &lt;&lt; std::endl;

    double speed = std::atof(argv[1]);
    double time = std::atof(argv[2]);
    double distance = speed * time;
    std::cout &lt;&lt; "速度: " &lt;&lt; speed &lt;&lt; " km/h, 时间: " &lt;&lt; time &lt;&lt; " h -&gt; "
              &lt;&lt; "距离: " &lt;&lt; distance &lt;&lt; " km" &lt;&lt; std::endl;

                <pre tabindex="0"><code>#include &lt;iostream&gt;

int main() {
    int num1, num2, expected_sum;
    int test_count = 0, pass_count = 0;

    std::cout &lt;&lt; "--- 开始自动化验证测试 ---" &lt;&lt; std::endl;
    while (std::cin &gt;&gt; num1 &gt;&gt; num2 &gt;&gt; expected_sum) {
        test_count++;
        int actual_sum = num1 + num2;
        std::cout &lt;&lt; "[用例 " &lt;&lt; test_count &lt;&lt; "]: " &lt;&lt; num1 &lt;&lt; " + " &lt;&lt; num2 &lt;&lt; std::endl;
        if (actual_sum == expected_sum) {
            std::cout &lt;&lt; "  - 结果: [PASS]" &lt;&lt; std::endl;
            pass_count++;
        } else {
            std::cout &lt;&lt; "  - 结果: [FAIL]" &lt;&lt; std::endl;
        }
    }
    std::cout &lt;&lt; "总用例数: " &lt;&lt; test_count &lt;&lt; " 通过: " &lt;&lt; pass_count
              &lt;&lt; " 失败: " &lt;&lt; test_count - pass_count &lt;&lt; std::endl;
    return 0;
}

<article id="c-016" class="case-article" data-reading-sample="c-016" data-generated-case="true" aria-labelledby="c-016-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 16</p><h2 id="c-016-title">变量作用域理解</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>在仿真中，车辆的常规行驶和临时超车由不同层次的逻辑处理。超车期间需要显示当前动作，结束后，主流程还要继续使用原来的行驶状态。如果两处恰好用了相同的变量名，就要判断每条语句实际访问的是哪一个变量。本案例通过内外两个语句块观察这一现象。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>在 <code>main</code> 中定义 <code>system_status = 1</code> 表示正常行驶。用花括号建立模拟超车的内层语句块，再定义同名变量并赋值为 <code>2</code>。分别在块内和块外打印状态，观察同名变量的遮蔽及其范围。</p>
<figure class="case-visual case-flow"><figcaption><span>内外层的同名状态</span><span class="case-card-topic">作用域遮蔽</span></figcaption><dl class="case-fields"><div><dt>主流程</dt><dd><code>system_status = 1</code></dd></div><div><dt>超车块</dt><dd><code>system_status = 2</code></dd></div><div><dt>观察</dt><dd>块内与块外的读值</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用嵌套作用域说明变量遮蔽

#include &lt;iostream&gt;

int main() {
    // 在 main 函数的主作用域中定义 system_status
    int system_status = 1; // 1 代表&quot;正常行驶&quot;

    std::cout &lt;&lt; &quot;[主流程]: 车辆当前状态: &quot; &lt;&lt; system_status &lt;&lt; &quot; (正常行驶)&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;[主流程]: 准备进入临时任务(例如：超车)...&quot; &lt;&lt; std::endl;

    // 使用 {} 创建一个新的内嵌作用域，模拟临时任务
    {
        // 在这个新的&quot;领地&quot;里，定义一个同名的新变量
        // 这个变量只在这个花括号内有效，它会&quot;遮蔽&quot;外面的那个 system_status
        int system_status = 2; // 2 代表&quot;超车中&quot;

        // 在内嵌作用域内部打印
        // 程序会使用&quot;离它最近&quot;的那个 system_status
        std::cout &lt;&lt; &quot;  [临时任务]: 任务执行中，状态变为: &quot; &lt;&lt; system_status &lt;&lt; &quot; (超车中)&quot; &lt;&lt; std::endl;

    } // 内嵌作用域结束。内部的 system_status (值为2) 在这里被销毁，&quot;生命结束&quot;

    std::cout &lt;&lt; &quot;[主流程]: 临时任务已完成。&quot; &lt;&lt; std::endl;

    // 在作用域结束后再次打印
    // 此时，内嵌的那个变量已经不存在了，程序只能看到主作用域中的 system_status
    std::cout &lt;&lt; &quot;[主流程]: 车辆当前状态恢复为: &quot; &lt;&lt; system_status &lt;&lt; &quot; (正常行驶)&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>[主流程]: 车辆当前状态: 1 (正常行驶)
[主流程]: 准备进入临时任务(例如：超车)...
  [临时任务]: 任务执行中，状态变为: 2 (超车中)
[主流程]: 临时任务已完成。
[主流程]: 车辆当前状态恢复为: 1 (正常行驶)
</code></pre></figure></div></div></div><p>编译并运行程序后，你将在控制台看到清晰的状态切换与恢复过程。</p>
<p>现象分析：内嵌作用域中定义的 <code>system_status = 2</code> 并没有修改外层的 <code>system_status</code>，它只是一个在“临时任务”期间存在的、同名的独立变量。任务一结束，它就消失了，外层的变量得以重见天日。</p></div></div></article>
<article id="c-017" class="case-article" data-reading-sample="c-017" data-generated-case="true" aria-labelledby="c-017-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 17</p><h2 id="c-017-title">消息数量记录</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>车载诊断工具需要统计 CAN 总线接收模块处理了多少条消息。接收函数在每条消息到达时调用一次，累计次数却要跨越多次调用，才能反映模块是否持续工作。如果每次进入函数都从零开始，就只能看到单次接收。本案例比较普通局部变量和静态局部变量的计数表现。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>在 <code>receive_can_message()</code> 内定义静态局部计数器 <code>static int static_message_count</code> 和普通局部计数器 <code>int normal_message_count</code>，都从 0 开始。每次调用将两者加一并打印，在 <code>main</code> 中连续调用 5 次，对照输出。</p>
<figure class="case-visual case-flow"><figcaption><span>多次接收的计数对照</span><span class="case-card-topic">静态局部变量</span></figcaption><dl class="case-fields"><div><dt>每次调用</dt><dd>模拟接收一条消息</dd></div><div><dt>普通局部计数</dt><dd>每次重新初始化</dd></div><div><dt>静态局部计数</dt><dd>跨调用累加</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 观察静态局部变量的生命周期

#include &lt;iostream&gt;

// 我们将用这个函数来模拟&quot;接收到一条CAN消息&quot;的动作
// 函数是C++中用于封装功能的代码块，我们将在后续课程中深入学习
// 现在，请将它看作一个可以被重复呼叫的&quot;小模块&quot;
void receive_can_message() {
    // 定义一个普通的局部变量作为计数器
    int normal_message_count = 0;
    normal_message_count++;

    // 定义一个静态的局部变量作为计数器
    // static 使局部变量在函数调用之间保持状态
    // 它告诉编译器：
    // a) 这个变量的初始化( = 0 )只在程序第一次运行到这里时执行一次
    // b) 函数结束后，不要销毁这个变量，让它继续&quot;活在&quot;内存里
    static int static_message_count = 0;
    static_message_count++;

    std::cout &lt;&lt; &quot;普通计数器: &quot; &lt;&lt; normal_message_count
              &lt;&lt; &quot;\t | \t静态计数器: &quot; &lt;&lt; static_message_count &lt;&lt; std::endl;
}

int main() {
    std::cout &lt;&lt; &quot;模拟连续接收5条CAN总线消息...&quot; &lt;&lt; std::endl;

    // 连续5次调用函数，模拟事件的发生
    receive_can_message(); // 第1次调用
    receive_can_message(); // 第2次调用
    receive_can_message(); // 第3次调用
    receive_can_message(); // 第4次调用
    receive_can_message(); // 第5次调用

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>模拟连续接收5条CAN总线消息...
普通计数器: 1	 | 	静态计数器: 1
普通计数器: 1	 | 	静态计数器: 2

普通计数器: 1	 | 	静态计数器: 4
普通计数器: 1	 | 	静态计数器: 5
</code></pre></figure></div></div></div><p>编译并运行程序后，你将在控制台看到非常鲜明的对比结果。</p>
<p>现象分析：</p>
<p>（1）普通计数器：每次调用 <code>receive_can_message</code> 时，它都会被重新创建并初始化为 0，然后加 1，所以它的值永远是 1。函数一结束，它就被销毁了。</p>
<p>（2）静态计数器：初始化 <code>= 0</code> 只在第一次调用时发生。每次调用函数时，它都保留了上次调用结束后的值，并在此基础上加 1。它拥有了“记忆”。</p></div></div></article>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 18</p><h2 id="c-018-title">车辆配置共享</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>车载软件可以由不同人员维护配置和主流程。例如，驾驶模式由配置模块统一定义，启动程序负责读取和显示，修改模式时只需找到对应定义。将两部分拆成独立源文件后，需要让编译器知道共享配置的类型，也要让链接器找到它的定义。本案例以一个驾驶模式值说明这种协作方式。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>在 <code>config.cpp</code> 定义全局配置 <code>const char* VEHICLE_MODE</code>，值为 <code>&quot;ECO&quot;</code>。在 <code>main.cpp</code> 用 <code>extern</code> 声明它并打印其值。分别编译两个源文件后链接，不直接包含 <code>config.cpp</code>。</p>
<figure class="case-visual case-flow"><figcaption><span>驾驶模式的跨文件共享</span><span class="case-card-topic">extern 声明</span></figcaption><dl class="case-fields"><div><dt>定义文件</dt><dd><code>config.cpp</code></dd></div><div><dt>共享配置</dt><dd><code>VEHICLE_MODE</code></dd></div><div><dt>读取文件</dt><dd><code>main.cpp</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3>
<ol><li>配置文件（<code>config.cpp</code>）：</li></ol><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 程序主入口，它需要使用在 config.cpp 中定义的配置

#include &lt;iostream&gt;

// 声明
// extern 声明引用在 config.cpp 中定义的配置变量
// &quot;请注意，有一个名为 VEHICLE_MODE 的 const char* 变量，
//  但它不在这里定义，请相信我，链接器会在别的某个地方找到它。&quot;
// &quot;extern&quot; 声明可以有很多份，分布在需要使用该变量的各个文件中
extern const char* VEHICLE_MODE;

int main() {
    std::cout &lt;&lt; &quot;--- 车辆配置共享演示 ---&quot; &lt;&lt; std::endl;

    // 直接使用这个在外部定义的变量
    // 编译器在编译 main.cpp 时，因为它看到了 extern 声明，所以不会报错
    // 在最后的链接阶段，链接器会把这里的引用，和 config.cpp 中的定义关联起来
    std::cout &lt;&lt; &quot;从主程序(main.cpp)读取到当前的驾驶模式为: &quot;
              &lt;&lt; VEHICLE_MODE &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure><figure class="code-panel" data-code-language="cpp"><figcaption><span>config.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 这个文件专门用来定义项目的全局配置变量

// 在这里，我们为 VEHICLE_MODE 分配了内存并赋予了初始值
// 一个变量在整个项目中，只能被&quot;定义&quot;一次
const char* VEHICLE_MODE = &quot;ECO&quot;;

// 未来可以增加更多配置...
// const int MAX_SPEED = 120;
</code></pre></figure></div></div>

<article id="c-019" class="case-article" data-reading-sample="c-019" data-generated-case="true" aria-labelledby="c-019-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 19</p><h2 id="c-019-title">AEB条件判断</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>自动紧急制动需要判断车辆是否接近前方障碍物，以及驾驶员是否已经采取制动措施。同样的距离下，车速不同，碰撞风险也会变化。控制程序需要把距离、速度和制动状态放在同一个条件中判断。本案例选取一组简化数据，观察几个条件如何共同决定是否发出警告。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>设定一组表示前方距离、车速和是否踩刹车的危险场景数据。用 <code>if</code>、<code>&amp;&amp;</code> 和 <code>!</code> 判断距离小于 20 米、车速大于 30 km/h 且驾驶员未踩刹车。三个条件同时成立时输出警告。</p>
<figure class="case-visual case-flow"><figcaption><span>紧急制动的触发条件</span><span class="case-card-topic">逻辑与</span></figcaption><dl class="case-fields"><div><dt>前方距离</dt><dd>小于 <code>20 m</code></dd></div><div><dt>当前车速</dt><dd>大于 <code>30 km/h</code></dd></div><div><dt>驾驶员状态</dt><dd>未踩刹车</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 关系和逻辑运算符，模拟AEB系统的触发逻辑

#include &lt;iostream&gt;
#include &lt;iomanip&gt; // 包含 std::boolalpha

int main() {
    // 定义并初始化车辆状态，模拟危险情况
    float distance_to_obstacle = 15.0f; // 距离很近
    int current_speed = 50;             // 速度较快
    bool is_brake_pressed = false;      // 驾驶员未刹车

    // 打印当前车辆状态，便于分析
    std::cout &lt;&lt; std::boolalpha; // 让bool值显示为true/false
    std::cout &lt;&lt; &quot;--- AEB 系统状态监测 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;前方障碍物距离: &quot; &lt;&lt; distance_to_obstacle &lt;&lt; &quot; m&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;当前车速: &quot; &lt;&lt; current_speed &lt;&lt; &quot; km/h&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;驾驶员是否踩刹车? &quot; &lt;&lt; is_brake_pressed &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;--------------------------&quot; &lt;&lt; std::endl;

    // 判断前方距离是否达到紧急制动阈值
    // a) distance_to_obstacle &lt; 20.0f  -&gt; true
    // b) current_speed &gt; 30             -&gt; true
    // c) a &amp;&amp; b                         -&gt; true
    // d) !is_brake_pressed              -&gt; !false -&gt; true
    // e) c &amp;&amp; d (即 true &amp;&amp; true)       -&gt; true
    // 整个条件为 true，因此 if 语句块内的代码会被执行
    if ((distance_to_obstacle &lt; 20.0f &amp;&amp; current_speed &gt; 30) &amp;&amp; !is_brake_pressed) {
        // 只有在上述复合条件为真时，才会执行这里的代码
        std::cout &lt;&lt; &quot;!!! 警告: 碰撞风险极高，AEB系统触发 !!!&quot; &lt;&lt; std::endl;
    }

    std::cout &lt;&lt; &quot;--- 监测结束 ---&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- AEB 系统状态监测 ---
前方障碍物距离: 15 m
当前车速: 50 km/h
驾驶员是否踩刹车? false
--------------------------
!!! 警告: 碰撞风险极高，AEB系统触发 !!!
--- 监测结束 ---
</code></pre></figure></div></div></div><p>编译并运行程序后，在模拟的危险场景下，你将在控制台看到 AEB 系统被成功触发。</p>
<p>如果修改初始条件为安全场景（例如 <code>distance_to_obstacle = 50.0f</code>），则 <code>if</code> 条件不满足，警告信息将不会被打印。</p></div></div></article>
<article id="c-020" class="case-article" data-reading-sample="c-020" data-generated-case="true" aria-labelledby="c-020-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 20</p><h2 id="c-020-title">驾驶模式推荐</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>车辆静止、在市区行驶和进入高速巡航时，仪表上需要显示不同的驾驶提示。程序可以根据车速选择提示，但区间如果重叠或漏掉了边界，就可能给出矛盾的建议。本案例用一套简化的速度分段规则模拟提示选择，重点观察每个输入怎样落到唯一的分支。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 <code>std::cin</code> 读取整数车速，以 <code>if-else if-else</code> 输出唯一建议。大于 100 提示超速减速，60–100 提示高速巡航并保持车距，1–59 提示市区注意行人，0 提示已停止。负数可提示无效。</p>
<figure class="case-visual case-flow"><figcaption><span>按车速区间给出建议</span><span class="case-card-topic">多路分支</span></figcaption><dl class="case-fields"><div><dt>超速</dt><dd>超过 <code>100 km/h</code>，减速</dd></div><div><dt>高速巡航</dt><dd><code>60—100 km/h</code>，保持车距</dd></div><div><dt>市区行驶</dt><dd><code>1—59 km/h</code>，注意行人</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 if-else if-else 结构处理多区间判断

#include &lt;iostream&gt;

int main() {
    // 定义变量并获取用户输入
    int current_speed;
    std::cout &lt;&lt; &quot;请输入当前车速 (km/h): &quot;;
    std::cin &gt;&gt; current_speed;

    std::cout &lt;&lt; &quot;--- 驾驶模式推荐 ---&quot; &lt;&lt; std::endl;

    // 使用 if-else if-else 逻辑阶梯进行判断
    // 程序会从上到下依次检查每个条件
    if (current_speed &gt; 100) {
        // 只有当第一个条件为真时，执行这里，然后整个结构结束
        std::cout &lt;&lt; &quot;建议: 超速行驶，请减速！&quot; &lt;&lt; std::endl;
    } 
    else if (current_speed &gt;= 60) {
        // 如果第一个条件为假，程序才会来检查这个条件
        // 此时我们已经知道 current_speed &lt;= 100，所以无需再写 &amp;&amp; current_speed &lt;= 100
        std::cout &lt;&lt; &quot;建议: 高速巡航，请保持车距。&quot; &lt;&lt; std::endl;
    } 
    else if (current_speed &gt; 0) {
        // 如果前两个条件都为假，才会检查这个条件
        // 此时我们已经知道 current_speed &lt; 60
        std::cout &lt;&lt; &quot;建议: 市区行驶，注意行人。&quot; &lt;&lt; std::endl;
    } 
    else if (current_speed == 0) {
        // 如果以上条件都为假
        std::cout &lt;&lt; &quot;状态: 车辆已停止。&quot; &lt;&lt; std::endl;
    } 
    else {
        // 如果以上所有条件都不满足（即输入为负数），则执行最后的 else
        std::cout &lt;&lt; &quot;错误: 车速输入无效。&quot; &lt;&lt; std::endl;
    }

    return 0;
}
</code></pre></figure></div></div>

<p>车载中控将音乐、导航、电话等功能组织成菜单。控制台原型可以先用固定编号代替屏幕按钮，让测试人员逐项检查选择的编号是否会触发对应功能，并观察输错编号时的反馈。本案例模拟一次菜单选择，练习按离散选项分派操作。</p>

<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>打印多媒体功能菜单，用 <code>std::cin</code> 接收编号。以 <code>switch-case</code> 处理 1–4 的选项，用打印消息模拟对应功能，对无效编号给出提示。</p>
<figure class="case-visual case-flow"><figcaption><span>菜单编号与功能分派</span><span class="case-card-topic">switch</span></figcaption><dl class="case-fields"><div><dt>输入</dt><dd>选项 <code>1—4</code></dd></div><div><dt>匹配</dt><dd>执行对应功能</dd></div><div><dt>其他编号</dt><dd>显示无效选项提示</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 switch-case 语句实现多媒体功能选择

#include &lt;iostream&gt;

int main() {
    // 显示功能菜单
    std::cout &lt;&lt; &quot;--- 车载多媒体系统 ---&quot; &lt;&lt; std::endl;

        // 如果 choice 的值等于 3

    }

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 22</p><h2 id="c-022-title">电池充电模拟</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>充电界面要随着电量变化不断刷新，达到设定目标后才结束本轮提示。在接入真实充电数据之前，测试人员可以用固定增量模拟电量变化，检查界面能否持续更新、是否在正确时机停止。本案例用控制台展示这个过程，并将一次更新组织成可反复执行的操作。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>将 <code>double battery_level</code> 初始化为 <code>20.0</code>。用 <code>while</code> 在电量低于 <code>80.0</code> 时反复增加 <code>5.0</code> 并打印当前百分比。达到或超过 80% 后输出“充电完成”。</p>
<figure class="case-visual case-flow"><figcaption><span>模拟充电的更新过程</span><span class="case-card-topic">while 循环</span></figcaption><dl class="case-fields"><div><dt>起始电量</dt><dd><code>20%</code></dd></div><div><dt>每轮增加</dt><dd><code>5 个百分点</code></dd></div><div><dt>停止条件</dt><dd>达到 <code>80%</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 while 循环实现电池充电模拟

#include &lt;iostream&gt;
#include &lt;iomanip&gt; // 包含 std::fixed 和 std::setprecision

int main() {
    // 初始化电池电量
    double battery_level = 20.0;
    const double TARGET_LEVEL = 80.0;

    std::cout &lt;&lt; &quot;--- 电池充电模拟 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;初始电量: &quot; &lt;&lt; battery_level &lt;&lt; &quot;%&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;充电目标: &quot; &lt;&lt; TARGET_LEVEL &lt;&lt; &quot;%&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;开始充电...&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;--------------------&quot; &lt;&lt; std::endl;

    // 使用 while 循环
    // 每次循环开始前，都会检查括号内的条件 (battery_level &lt; TARGET_LEVEL) 是否为真
    // 如果为真，就执行大括号内的代码;如果为假，就跳过整个循环
    while (battery_level &lt; TARGET_LEVEL) {
        // 在循环体内更新状态
        battery_level += 5.0; // 模拟电量增加 5%

        // 打印当前状态
        std::cout &lt;&lt; &quot;当前电量: &quot; 
                  &lt;&lt; std::fixed &lt;&lt; std::setprecision(1) 
                  &lt;&lt; battery_level &lt;&lt; &quot;%&quot; &lt;&lt; std::endl;
    }

    // 循环结束后的收尾工作
    std::cout &lt;&lt; &quot;--------------------&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;已达到充电目标，充电完成。&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 23</p><h2 id="c-023-title">传感器矩阵打印</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>车辆附近的区域可以划分成网格，感知模块按行列保存各格的状态。调试数据时，如果控制台上的换行或遍历顺序出了错，就很难将一个读数对应到实际位置。本案例先打印一个小型坐标网格，通过每行的排列观察两层循环怎样共同走完整张网格。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用嵌套的 <code>for</code> 循环在控制台打印对齐的 4×4 矩阵，每格用 <code>(行,列)</code> 表示。检查行、列是否按顺序递增，且每行恰好有四个坐标。</p>
<figure class="case-visual case-flow"><figcaption><span>按行列打印网格</span><span class="case-card-topic">嵌套 for</span></figcaption><dl class="case-fields"><div><dt>网格大小</dt><dd><code>4 × 4</code></dd></div><div><dt>外层</dt><dd>遍历行</dd></div><div><dt>内层</dt><dd>打印列坐标</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 嵌套 for 循环来打印一个二维矩阵

#include &lt;iostream&gt;
#include &lt;iomanip&gt; // 包含 setw 用于设置字段宽度，美化输出

int main() {
    // 定义矩阵的维度
    const int NUM_ROWS = 4;
    const int NUM_COLS = 4;

    std::cout &lt;&lt; &quot;--- 4x4 传感器矩阵坐标 ---&quot; &lt;&lt; std::endl;

    // 外层循环：负责控制&quot;行&quot;
    // 变量 i 代表当前的行号，从 0 增加到 3
    for (int i = 0; i &lt; NUM_ROWS; ++i) {

        // 内层循环：负责控制当前行中的&quot;列&quot;
        // 对于外层循环的每一次迭代（每一行），内层循环都会完整地执行一遍
        // 变量 j 代表当前的列号，从 0 增加到 3
        for (int j = 0; j &lt; NUM_COLS; ++j) {

            // 打印当前(行,列)的坐标
            // setw(7) 设置下一个输出项的宽度为7个字符，用于对齐
            std::cout &lt;&lt; std::setw(7) &lt;&lt; &quot;(&quot; &lt;&lt; i &lt;&lt; &quot;,&quot; &lt;&lt; j &lt;&lt; &quot;)&quot;;
        }

        // 当前行输出完成后换行
        // 当一行的所有列（内层循环）都打印完毕后，
        // 我们需要打印一个换行符，以便让下一行的内容从新的一行开始
        std::cout &lt;&lt; std::endl;
    }

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 4x4 传感器矩阵坐标 ---
      (0,0)      (0,1)      (0,2)      (0,3)
      (1,0)      (1,1)      (1,2)      (1,3)
      (2,0)      (2,1)      (2,2)      (2,3)
      (3,0)      (3,1)      (3,2)      (3,3)
</code></pre></figure></div></div></div><p>编译并运行程序后，你将在控制台看到一个格式工整的坐标矩阵。</p></div></div></article>
<article id="c-024" class="case-article" data-reading-sample="c-024" data-generated-case="true" aria-labelledby="c-024-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 24</p><h2 id="c-024-title">数据流坏点剔除</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>传感器采集程序接到的是一串连续读数，其中可能混入无效值，采集端也可能发送本轮结束的标记。程序要跳过无效读数、继续接收后续数据。遇到结束标记时则应停止本轮处理。本案例用键盘模拟数据到达，练习在同一个循环里区分两种情况。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 <code>for(;;)</code> 逐个接收键盘输入的整数。读到 <code>0</code> 时提示继续输入，用 <code>continue</code> 跳过该读数。读到 <code>-1</code> 时用 <code>break</code> 结束循环。其余读数直接打印，表示已处理。</p>
<figure class="case-visual case-flow"><figcaption><span>连续读数的三种去向</span><span class="case-card-topic">循环跳转</span></figcaption><dl class="case-fields"><div><dt>无效读数</dt><dd><code>0</code>，用 <code>continue</code> 跳过</dd></div><div><dt>结束标记</dt><dd><code>-1</code>，用 <code>break</code> 停止</dd></div><div><dt>其余读数</dt><dd>打印已处理结果</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用 continue 和 break 来处理来自键盘的数据流

#include &lt;iostream&gt;

int main() {
    // 准备一个变量来存储每次从键盘输入的读数
    int current_reading;

    std::cout &lt;&lt; &quot;--- 开始处理传感器数据流 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;请逐个输入传感器读数 (整数)，输入 -1 表示结束。&quot; &lt;&lt; std::endl;

    // 使用 for(;;) 创建一个无限循环来持续接收输入
    for (;;) {
        std::cout &lt;&lt; &quot;\n请输入下一个读数: &quot;;
        std::cin &gt;&gt; current_reading; // 从键盘获取一个整数

        // 判断是否为结束标记
        if (current_reading == -1) {
            std::cout &lt;&lt; &quot;检测到数据流结束标记 (-1)，处理终止。&quot; &lt;&lt; std::endl;
            break; // 立即跳出 for 循环
        }

        // 判断是否为无效数据
        if (current_reading == 0) {
            std::cout &lt;&lt; &quot;  (检测到无效数据 [0]，已跳过)&quot; &lt;&lt; std::endl;
            continue; // 立即结束本次循环，直接进入下一次循环
        }

        // 如果是正常数据，则进行处理（此处用打印模拟）
        std::cout &lt;&lt; &quot;处理有效数据: &quot; &lt;&lt; current_reading &lt;&lt; std::endl;
    }

    std::cout &lt;&lt; &quot;\n--- 数据流处理完成 ---&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 开始处理传感器数据流 ---
请逐个输入传感器读数 (整数)，输入 -1 表示结束。

请输入下一个读数: 10
处理有效数据: 10

请输入下一个读数: 0
  (检测到无效数据 [0]，已跳过)

请输入下一个读数: 25
处理有效数据: 25

请输入下一个读数: -1
检测到数据流结束标记 (-1)，处理终止。

--- 数据流处理完成 ---
</code></pre></figure></div></div></div><p>编译并运行新程序后，它会等待你的输入。依次输入 <code>12</code>、<code>15</code>、<code>0</code>、<code>22</code>、<code>18</code>、<code>0</code>、<code>35</code>、<code>-1</code>，然后按回车。控制台的输出会是这样。</p>
<p>现象分析：</p>
<p>（1）程序与用户产生了互动。你每输入一个数字并按回车，程序就会处理一次。</p>
<p>（2）当你输入 <code>0</code> 时，程序打印“已跳过”并立即提示你输入下一个数，这正是 <code>continue</code> 的作用——跳过本轮，继续跑。</p>
<p>（3）当你输入 <code>-1</code> 时，程序打印“处理终止”并立即结束了整个循环，显示“数据流处理完成”，这正是 <code>break</code> 的作用——比赛结束，不跑了。</p></div></div></article>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">拓展案例 C2</p><h2 id="c-ext-c2-title">前提条件断言</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>轮胎压力换算模块通常接收由上游传来的测量值。若调用方送入负数，计算仍可能得出一个数值，但这个结果没有预期的物理意义，也会掩盖输入出了问题。本案例用断言明确换算的前提，对照合法值和不满足前提的值，观察错误能否在进入计算前被发现。</p>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 D</p><h2 id="c-ai-d-title">AIGC数据结构优化</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3><p>复杂车载软件需要把真实交通环境转化为可计算的数据模型。车辆、行人和路障既有共同属性，也有各自特有的信息；若仅用分散变量保存这些数据，软件就会难以维护和扩展。本案例让你扮演“系统设计师”，借助 AIGC 探索不同实体的统一表示方式，理解数据建模如何兼顾表达清晰、存储效率与后续扩展。</p></div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3><p>使用 AIGC 工具，为车辆和行人设计统一的数据结构。向工具说明两类对象共有的 ID、二维坐标，以及车辆的相对速度、行人的横向移动速度，要求方案兼顾表达清晰与存储效率。分析生成结果如何区分对象类型、组织共同属性与专有属性，比较它与分散变量的差异，为后续感知数据建模提供参考。</p><figure class="case-visual case-flow"><figcaption><span>车辆与行人的数据布局</span><span class="case-card-topic">类型标记</span></figcaption><dl class="case-fields"><div><dt>共有属性</dt><dd>编号与二维位置</dd></div><div><dt>车辆专属</dt><dd>相对速度</dd></div><div><dt>行人专属</dt><dd>横向移动速度</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><section class="case-prompt"><h4>提示词（Prompt）</h4><div class="case-prompt-body"><p>你好，请扮演一名资深的 C++ 系统架构师。我正在为一个自动驾驶仿真系统设计数据结构，需要你的帮助。</p>
<p><strong>我的需求是</strong>：</p>
<ol><li>我需要一个统一的数据结构来表示场景中所有的障碍物。</li><li>障碍物有不同的类型，主要有 <strong>车辆 (Vehicle)</strong> 和 <strong>行人 (Pedestrian)</strong>。</li><li>所有障碍物都有一些共同的数据，比如 ID 和二维坐标 (x, y)。</li><li>不同类型的障碍物还有各自独特的数据：<strong>车辆</strong>需要存储它的<strong>相对速度 (<code>relative_speed</code>)</strong>，是一个浮点数；<strong>行人</strong>需要存储它的<strong>横向移动速度 (<code>lateral_speed</code>)</strong>，也是一个浮点数。</li></ol>
<p>请为我设计一个优化的 C++ 数据结构，它应该既能清晰地表示不同类型的障碍物，又能在内存使用上尽可能高效。</p></div></section></div>
<div class="case-result"><h3>运行效果</h3><div class="aigc-response case-method-compact"><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用标签化联合体表达不同的数据类型

#include &lt;cstdint&gt;
#include &lt;iostream&gt;

enum class ObstacleType : std::uint8_t {
    VEHICLE,
    PEDESTRIAN
};

union SpecificData {

    float y;
    ObstacleType type;

              &lt;&lt; pedestrian.data.lateral_speed &lt;&lt; &quot; m/s&quot; &lt;&lt; std::endl;
    return 0;
}
</code></pre></figure></div></div><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>Vehicle 1: relative speed = 8.2 m/s
Pedestrian 2: lateral speed = 1.3 m/s
</code></pre></figure></div></div></div><p>现象分析：示例用 <code>enum class</code> 标明障碍物类型，用 <code>union</code> 让互斥的专有数据共享存储空间，再通过 <code>struct</code> 将共同属性、类型标签与专有数据组合起来。可以对照车辆和行人的表示方式，观察哪些信息能够统一组织，哪些信息需要按类型区分，理解数据结构如何改善代码的清晰性与扩展性。</p>

<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 25</p><h2 id="c-025-title">传感器指针校准</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>激光雷达安装到车身后，零位偏移量可能要根据安装误差重新标定。若检测程序和校准模块使用的是同一份参数，校准模块就要更新原来的值，后续测距才能读到新参数。本案例用一个偏移量模拟校准参数，观察通过地址写入怎样反映到原变量上。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>在 <code>main</code> 中定义 <code>float offset = 0.0f;</code> 和 <code>float* p_offset;</code>，让指针指向 <code>offset</code>。通过 <code>*p_offset</code> 将原值改为 <code>1.25f</code>，再打印 <code>offset</code> 验证更新。</p>
<figure class="case-visual case-flow"><figcaption><span>通过指针校准偏移量</span><span class="case-card-topic">地址与解引用</span></figcaption><dl class="case-fields"><div><dt>待校准量</dt><dd><code>offset</code></dd></div><div><dt>取地址</dt><dd><code>&amp;offset</code></dd></div><div><dt>写回位置</dt><dd><code>*p_offset</code></dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 通过指针直接修改内存中的变量值，模拟传感器校准

#include &lt;iostream&gt;

int main() {
    // 在内存中定义一个变量，代表传感器的原始偏移量
    float offset = 0.0f;

    // 打印初始状态
    std::cout &lt;&lt; &quot;校准前：&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;  - 变量 offset 的值: &quot; &lt;&lt; offset &lt;&lt; std::endl;
    // 使用 &amp; 运算符获取 offset 变量在内存中的地址
    std::cout &lt;&lt; &quot;  - 变量 offset 的内存地址: &quot; &lt;&lt; &amp;offset &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;----------------------------------------&quot; &lt;&lt; std::endl;

    // 定义一个指针变量 p_offset
    float* p_offset;

    // 将 offset 的地址赋值给指针 p_offset
    //    现在，p_offset 就&quot;指向&quot;了 offset
    p_offset = &amp;offset;

    std::cout &lt;&lt; &quot;指针已设置：&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;  - 指针 p_offset 中存储的地址值: &quot; &lt;&lt; p_offset &lt;&lt; std::endl;
    std::cout &lt;&lt; std::endl;

    // 解引用指针并修改传感器偏移量
    //    使用 * (解引用)运算符，访问 p_offset 指向的那块内存，并修改其内容
    std::cout &lt;&lt; &quot;正在通过指针 *p_offset 进行校准...&quot; &lt;&lt; std::endl;
    *p_offset = 1.25f;
    std::cout &lt;&lt; &quot;校准完成！&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;----------------------------------------&quot; &lt;&lt; std::endl;

    // 验证结果
    //    再次打印原始变量 offset 的值，会发现它已经被成功修改
    std::cout &lt;&lt; &quot;校准后：&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;  - 变量 offset 的值: &quot; &lt;&lt; offset &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>校准前：
  - 变量 offset 的值: 0
  - 变量 offset 的内存地址: 0x16f16a848
----------------------------------------
指针已设置：
  - 指针 p_offset 中存储的地址值: 0x16f16a848

正在通过指针 *p_offset 进行校准...
校准完成！
----------------------------------------
校准后：
  - 变量 offset 的值: 1.25
</code></pre></figure></div></div></div><p class="case-source-caption">内存地址随每次运行变化，指针及类型大小以当前运行环境为准。</p><p>当程序被成功编译并运行后，你将在控制台窗口看到类似以下的输出（内存地址会因每次运行而不同）。</p>
<p><code>p_offset</code> 中存储的地址与 <code>offset</code> 变量的实际地址完全相同，证明指针成功地“定位”了目标。我们从未执行过 <code>offset = 1.25f;</code> 这样的语句，但 <code>offset</code> 的值最终却改变了，这证明 <code>*p_offset = 1.25f;</code> 这行代码确实实现了通过地址间接修改变量值的目的。</p></div></div></article>
<article id="c-026" class="case-article" data-reading-sample="c-026" data-generated-case="true" aria-labelledby="c-026-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 26</p><h2 id="c-026-title">雷达点云遍历</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>激光雷达的一次扫描会生成一批测距数据，采集程序可将这些读数按收到的顺序存入连续的缓冲区。负责处理数据的模块从缓冲区首地址出发，依次读取每个值。本案例用一小段测距数据模拟该过程，观察指针前进一步后实际访问的是哪个元素。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>在 <code>main</code> 中定义包含 5 个测距值的浮点数组 <code>float dists[5]</code>，让 <code>float* p_dist</code> 指向首元素。在 <code>for</code> 循环中通过指针读取并打印数据，每轮用 <code>p_dist++</code> 移到下一项，依次输出 5 个值。</p>
<figure class="case-visual case-flow"><figcaption><span>连续距离值的访问</span><span class="case-card-topic">指针移动</span></figcaption><dl class="case-fields"><div><dt>缓冲区</dt><dd><code>5</code> 个浮点距离</dd></div><div><dt>起点</dt><dd>数组首元素</dd></div><div><dt>遍历</dt><dd>按元素偏移取值</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 使用指针算术运算遍历连续内存，模拟雷达点云处理

#include &lt;iostream&gt;

int main() {
    // 模拟连续的内存缓冲区
    //    这是在C++中获取栈上连续内存的标准方法
    float dists[5] = {10.2f, 11.5f, 12.0f, 10.8f, 9.9f};

    // 定义一个指针，并使其指向第一个数据点的地址
    float* p_dist = &amp;dists[0];

    std::cout &lt;&lt; &quot;--- 开始遍历雷达点云数据 ---&quot; &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;起始地址: &quot; &lt;&lt; p_dist &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;---------------------------------&quot; &lt;&lt; std::endl;

    // 使用 for 循环和指针算术运算来遍历这块&quot;内存&quot;
    //    我们已知有5个数据点，所以循环5次
    for (int i = 0; i &lt; 5; ++i) {
        // 使用 * (解引用) 运算符获取指针当前指向的值
        std::cout &lt;&lt; &quot;点 &quot; &lt;&lt; i + 1 &lt;&lt; &quot; | &quot;;
        std::cout &lt;&lt; &quot;指针地址: &quot; &lt;&lt; p_dist &lt;&lt; &quot; | &quot;;
        std::cout &lt;&lt; &quot;距离: &quot; &lt;&lt; *p_dist &lt;&lt; &quot; 米&quot; &lt;&lt; std::endl;

        // 递增指针，使其指向下一个距离值
        // 这会让指针 p_dist 在内存中向前移动 sizeof(float) 个字节，
        // 从而精确地指向下一个float变量的位置
        p_dist++;
    }

    std::cout &lt;&lt; &quot;--- 遍历完成 ---&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
<div class="case-result"><h3>运行效果</h3><div class="case-effect case-terminal"><div class="case-terminal-heading"><span>终端</span><span>实际输出</span></div><div class="case-terminal-body"><div class="case-run-outputs"><figure class="code-panel"><figcaption><span>运行输出</span></figcaption><pre tabindex="0"><code>--- 开始遍历雷达点云数据 ---
起始地址: 0x16b29e830
---------------------------------
点 1 | 指针地址: 0x16b29e830 | 距离: 10.2 米
点 2 | 指针地址: 0x16b29e834 | 距离: 11.5 米
点 3 | 指针地址: 0x16b29e838 | 距离: 12 米
点 4 | 指针地址: 0x16b29e83c | 距离: 10.8 米
点 5 | 指针地址: 0x16b29e840 | 距离: 9.9 米
--- 遍历完成 ---
</code></pre></figure></div></div></div><p class="case-source-caption">内存地址随每次运行变化，指针及类型大小以当前运行环境为准。</p><p>当程序被成功编译并运行后，你将在控制台窗口看到类似以下的输出（内存地址会因每次运行而不同，但地址间的差值是固定的）。</p>
<p>观察输出的“指针地址”，你会发现它们是连续递增的，并且每两个相邻地址之间的差值<strong>正好是 4</strong>，这精确地等于 <code>sizeof(float)</code> 的大小。<code>p_dist++</code> 的操作不是简单地将地址编号加 1，而是智能地加上了它所指向类型的大小，这证明了指针算术运算的本质，也为后续理解数组和指针的内在联系打下了基础。</p></div></div></article>
<article id="c-027" class="case-article" data-reading-sample="c-027" data-generated-case="true" aria-labelledby="c-027-title">
<header class="case-intro"><div class="case-overview"><div class="case-title"><p class="eyebrow">案例 27</p><h2 id="c-027-title">VIN安全传递</h2></div><div class="case-background"><h3 class="case-subhead">案例背景</h3>
<p>车辆识别码（VIN）由 17 个字符组成，车辆信息、诊断和通信模块可能都要读取它。接收方需要能核对完整号码，也要避免无意改动车辆的原始记录。传递时是否复制数据、能否通过收到的值修改原数据，取决于接口的写法。本案例把三种传递方式放在一起比较。</p>
</div></div>
<section class="case-information"><h3 class="case-subhead">案例信息</h3>
<p>用 <code>std::string vin</code> 保存一个 17 位 VIN，并以三种方式交给模拟处理单元读取和打印：按值复制、传入指向常量的指针、创建 <code>const</code> 引用。比较三种方式是否复制原数据、是否允许通过该访问方式修改它。</p>
<figure class="case-visual case-flow"><figcaption><span>车辆识别码的传递</span><span class="case-card-topic">传值与引用</span></figcaption><dl class="case-fields"><div><dt>传值</dt><dd>复制 VIN 字符串</dd></div><div><dt>传指针</dt><dd>访问原字符串</dd></div><div><dt>常量引用</dt><dd>只读访问原值</dd></div></dl></figure></section></header>
<div class="case-body"><div class="case-method case-method-compact"><h3>案例代码</h3><div class="case-code-files"><figure class="code-panel" data-code-language="cpp"><figcaption><span>main.cpp</span><span class="code-kind">C++</span></figcaption><pre tabindex="0"><code>// 对比三种方式传递 VIN 码，体会 const 引用的优势

#include &lt;iostream&gt;
#include &lt;string&gt;

int main() {
    // 在内存中定义一个VIN码字符串
    std::string vin = &quot;LFWC2MD98PTxxxxxx&quot;;

    std::cout &lt;&lt; &quot;原始VIN码地址: &quot; &lt;&lt; &amp;vin &lt;&lt; std::endl;
    std::cout &lt;&lt; &quot;========================================&quot; &lt;&lt; std::endl;

    // 方式 1：按值传递 (创建副本)
    {
        // 进入&quot;处理单元&quot;作用域
        std::cout &lt;&lt; &quot;方式 1：按值传递&quot; &lt;&lt; std::endl;

        // 模拟参数传递：创建一个全新的字符串 `vin_copy`，
        // 并将 `vin` 的内容完整地复制过来
        std::string vin_copy = vin; 

        std::cout &lt;&lt; &quot;  - 内部副本 vin_copy 的地址: &quot; &lt;&lt; &amp;vin_copy &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;  - 观察: 内部地址与原始地址不同，发生了数据拷贝。&quot; &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;  - 处理单元访问到的VIN: &quot; &lt;&lt; vin_copy &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;  - 缺点: 对于长字符串，每次拷贝都会消耗时间和内存。&quot; &lt;&lt; std::endl;
    }
    std::cout &lt;&lt; &quot;========================================&quot; &lt;&lt; std::endl;

    // 方式 2：按 const 指针传递 (传递地址)
    {
        // 进入&quot;处理单元&quot;作用域
        std::cout &lt;&lt; &quot;方式 2：按 const 指针传递&quot; &lt;&lt; std::endl;

        // 模拟参数传递：创建一个指针 `p_vin`，
        // 它存储了 `vin` 的内存地址。`const` 保证了不能通过指针修改原数据
        const std::string* p_vin = &amp;vin;

        std::cout &lt;&lt; &quot;  - 指针 p_vin 中存储的地址: &quot; &lt;&lt; p_vin &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;  - 观察: 指针存储的地址与原始地址相同，没有数据拷贝。&quot; &lt;&lt; std::endl;
        // 访问时需要解引用 `*`
        std::cout &lt;&lt; &quot;  - 处理单元访问到的VIN: &quot; &lt;&lt; *p_vin &lt;&lt; std::endl;
        // *p_vin = &quot;tampered&quot;; // 编译错误！const指针保护了原始数据
        std::cout &lt;&lt; &quot;  - 优点: 高效。缺点: 访问语法稍显繁琐(*)。&quot; &lt;&lt; std::endl;
    }
    std::cout &lt;&lt; &quot;========================================&quot; &lt;&lt; std::endl;

    // 方式 3：按 const 引用传递 (起别名)
    {
        // 进入&quot;处理单元&quot;作用域
        std::cout &lt;&lt; &quot;方式 3：按 const 引用传递&quot; &lt;&lt; std::endl;

        // 模拟参数传递：创建一个引用 `ref_vin`，
        // 它成为 `vin` 的一个只读别名
        const std::string&amp; ref_vin = vin;

        std::cout &lt;&lt; &quot;  - 引用 ref_vin 的地址: &quot; &lt;&lt; &amp;ref_vin &lt;&lt; std::endl;
        std::cout &lt;&lt; &quot;  - 观察: 引用地址与原始地址相同，没有数据拷贝。&quot; &lt;&lt; std::endl;
        // 像使用普通变量一样直接访问
        std::cout &lt;&lt; &quot;  - 处理单元访问到的VIN: &quot; &lt;&lt; ref_vin &lt;&lt; std::endl;
        // ref_vin = &quot;tampered&quot;; // 编译错误！const引用保护了原始数据
        std::cout &lt;&lt; &quot;  - 优点: 既高效(无拷贝)，又安全(const)，且语法简洁。&quot; &lt;&lt; std::endl;
    }
    std::cout &lt;&lt; &quot;========================================&quot; &lt;&lt; std::endl;

    return 0;
}
</code></pre></figure></div></div>
