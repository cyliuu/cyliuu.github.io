<style>
:root{--bg:#f6f8fa;--text:#24292f;--muted:#57606a;--line:#d0d7de;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box}body{margin:0;padding:40px 20px;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}main{max-width:1200px;margin:auto}.eyebrow{font-size:12px;color:var(--blue);font-weight:700;text-align:center}h1{text-align:center;font-size:24px;font-weight:600;margin:2px 0 12px}h2{font-size:1.18rem;margin:0 0 12px}h3{font-size:1rem;margin:0 0 8px}p{margin:0 0 12px}.lead{max-width:900px;margin:auto;text-align:center;color:var(--muted);font-size:14px}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:14px 0 20px;font-size:13px}a{color:var(--blue)}nav a{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:8px;text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 8px 24px rgba(140,149,159,.15)}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:12px 0 18px}.controls label{font-size:14px;font-weight:600}.controls input{display:block;width:100px;margin-top:4px;padding:7px;border:1px solid var(--line);border-radius:6px}.btn{padding:10px 20px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font-size:14px;font-weight:600}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:hover{border-color:var(--blue)}.grid{display:grid;grid-template-columns:1.08fr 1fr;gap:22px}.code{border:1px solid var(--line);border-radius:8px;overflow:hidden}.codehead{padding:9px 14px;background:#f6f8fa;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.code pre{margin:0;padding:10px 0;overflow-x:auto;font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace}.line{display:block;padding:0 14px;white-space:pre}.line.active{padding-left:11px;border-left:3px solid var(--blue);background: <div class="eyebrow">项目 E · 任务 13 · 案例 40</div><h1>递归预测车辆轨迹</h1>
<p class="lead">从初始位置、速度和加速度出发，逐层预测下一秒的位置，再观察递归返回过程。</p>
<nav class="case-nav" aria-label="案例导航"><a href="../../../项目演示/项目E.html">返回项目 E</a><a href="../../../资源目录.html#case-40">返回资源总目录</a></nav><section class="case-meta" aria-label="案例知识与相关资源"><div class="case-meta-group"><span class="case-meta-label">对应知识点</span><div class="case-meta-items"><span class="case-tag">知识点 70 · 函数嵌套与递归</span></div></div><div class="case-meta-group"><span class="case-meta-label">相关机制页</span><div class="case-meta-items"><a class="case-mechanism" href="../../../函数/函数递归调用.html">函数递归调用</a><a class="case-mechanism" href="../../../函数/变量作用域与栈帧.html">变量作用域与栈帧</a></div></div></section>
<section class="panel"><h2>逐层进入，再逐层返回</h2><div class="controls"><label for="seconds">预测秒数（0～6）<input id="seconds" type="number" min="0" max="6" step="1" value="3"></label><button class="btn primary" id="start">开始 / 重置</button><button class="btn" id="step">执行下一步</button></div>
<div class="grid"><div class="code"><div class="codehead">ee_40/main.cpp · 递归函数关键代码</div><pre id="source"></pre></div><div><h3>调用栈（下方为当前层）</h3><div id="stack" class="stack" aria-live="polite"></div><div class="note" id="explain">按“执行下一步”，观察参数如何从一层传给下一层。</div><div class="controls"><label for="guess">你预测最终位置（m）<input id="guess" type="number" step="any" placeholder="填写数值"></label><button class="btn" id="check">核对预测</button></div><div class="feedback" id="feedback" aria-live="polite"></div></div></div>
<div class="terminal" id="terminal" aria-label="控制台输出示意"></div>
</section><p class="small" style="margin-top:15px">此教学页复现源码中的离散 1 秒步长公式 <code>distance = v×1 + 0.5×a×1²</code>，不是连续时间轨迹仿真。网页最多演示 6 层，以便看清调用栈；浏览器不运行 C++。</p>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);
const lines=['double predict_distance(double current_pos, double current_speed,','                        double acceleration, int seconds_left) {','  std::cout << "正在计算剩余 " << seconds_left << " 秒...";','  if (seconds_left <= 0) {','    std::cout << "  -> 命中终止条件，返回最终位置。";','    return current_pos;','  }','  double distance_in_one_sec = current_speed * 1.0','                             + 0.5 * acceleration * 1.0 * 1.0;','  double next_pos = current_pos + distance_in_one_sec;','  double next_speed = current_speed + acceleration * 1.0;','  return predict_distance(next_pos, next_speed, acceleration, seconds_left - 1);','}'];
let frames=[],phase='idle',total=3,resultPos=0,logs=[];
function render(line){$('source').replaceChildren(...lines.map((s,i)=>{const row=document.createElement('span');row.className='line'+(line===i?' active':'');const n=document.createElement('span');n.className='n';n.textContent=String(i+1);row.append(n,document.createTextNode(s));return row}));$('stack').replaceChildren(...frames.map((f,i)=>{const box=document.createElement('div');box.className='frame'+(i===frames.length-1?' current':'');box.textContent=`第 ${i+1} 层：pos=${f.pos} m，speed=${f.speed} m/s，剩余 ${f.left} s`;return box}));if(!frames.length)$('stack').textContent=phase==='done'?'调用栈已清空，全部层级返回完成。':'尚未开始调用。';$('terminal').textContent=logs.join('\n');}
function reset(){const n=Number($('seconds').value);if(!Number.isInteger(n)||n<0||n>6){$('explain').textContent='请输入 0～6 的整数秒数。';$('explain').className='note bad';return}total=n;frames=[{pos:0,speed:10,left:n}];phase='down';resultPos=0;logs=['--- 车辆轨迹预测 ---','初始状态： 位置=0m, 速度=10m/s'];$('feedback').textContent='';$('explain').className='note';$('explain').textContent='已经建立首层调用。下一步先执行函数中的输出和终止条件检查。';render(0)}
function step(){if(phase==='idle'){reset();return}if(phase==='done')return;const f=frames[frames.length-1];if(phase==='down'){logs.push(`正在计算剩余 ${f.left} 秒... (当前位置： ${f.pos})`);if(f.left<=0){logs.push('  -> 命中终止条件，返回最终位置。');resultPos=f.pos;phase='up';$('explain').textContent=`命中终止条件：直接返回 current_pos = ${resultPos} m。下一步观察逐层返回。`;render(5)}else{const distance=f.speed+1;const next={pos:f.pos+distance,speed:f.speed+2,left:f.left-1};frames.push(next);$('explain').textContent=`本层前进 ${f.speed}×1 + 0.5×2×1² = ${distance} m；传入下一层：位置 ${next.pos} m，速度 ${next.speed} m，剩余 ${next.left} 秒。`;render(11)}}else{frames.pop();if(frames.length){$('explain').textContent=`返回值 ${resultPos} m 已交给上一层；该层不再计算，继续向上返回。`;render(11)}else{phase='done';logs.push(`预测结果： ${total}秒后， 车辆将到达位置 ${resultPos} 米`);$('explain').textContent=`递归完成：预测 ${total} 秒后的最终位置为 ${resultPos} m。`;render(11)}}}
$('start').onclick=reset;$('step').onclick=step;$('check').onclick=()=>{const v=Number($('guess').value),result=10*total+total*total;if($('guess').value.trim()===''||!Number.isFinite(v)){$('feedback').className='feedback bad';$('feedback').textContent='请先填写一个数字。';return}$('feedback').className='feedback '+(Math.abs(v-result)<1e-9?'good':'bad');$('feedback').textContent=Math.abs(v-result)<1e-9?`正确：${total} 秒后位置 ${result} m。`:`再看每秒位移：第 1 秒 11 m，此后每秒增加 2 m；正确结果是 ${result} m。`};reset();
})();
</script></body></html>
