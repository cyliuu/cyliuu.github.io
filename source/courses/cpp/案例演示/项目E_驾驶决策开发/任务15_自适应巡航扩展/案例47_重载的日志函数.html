  <div class="eyebrow">项目 E · 任务 15 · 案例 47</div><h1>重载的日志函数</h1>
  <p class="lead">选择不同参数形式，预测同名日志函数会匹配哪个重载版本。</p>

  <section class="panel"><h2>自动驾驶日志分派实验</h2><div class="calls" role="group" aria-label="选择源码调用"><button class="btn active" data-call="0">文本日志</button><button class="btn" data-call="1">错误码日志</button><button class="btn" data-call="2">组件状态日志</button></div>
    <div class="grid"><div class="code"><div class="codehead">ee_47/main.cpp · 关键函数与调用</div><pre id="source"></pre></div><div><h3>候选重载</h3><div id="signatures"></div><p>你预测哪个版本会被选中？</p><div id="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><div id="reason" class="note" aria-live="polite">先作预测，再核对参数个数和类型。</div></div></div>
    <div id="terminal" class="terminal" aria-label="控制台输出示意">--- 自动驾驶日志系统 ---
选择调用并作出预测...</div>
  </section>
  <p class="small" style="margin-top:15px">浏览器只依据案例源码展示重载选择与输出，不调用 C++ 编译器。三个按钮不是任意表达式求值器；它们仅覆盖源码中实际出现的三次调用。</p>
</main><script>
(() => {
  'use strict';const $=id=>document.getElementById(id);
  const lines=[
    'void log_event(const std::string& message) {',
    '  std::cout << "[INFO] Message: \\"" << message << "\\"" << std::endl;',
    '}',
    'void log_event(int error_code) {',
    '  std::cout << "[ERROR] Code: " << error_code << std::endl;',
    '}',
    'void log_event(const std::string& component, int status_code) {',
    '  std::cout << "[STATUS] Component: " << component',
    '            << ", Status: " << status_code << std::endl;',
    '}',
    'log_event("系统初始化完成。");',
    'log_event(404);',
    'log_event("Lidar", 0);'
  ];
  const sigs=['log_event(const std::string& message)','log_event(int error_code)','log_event(const std::string& component, int status_code)'];
  const tasks=[
    {line:10,match:0,call:'log_event("系统初始化完成。");',args:'1 个字符串参数',output:'[INFO] Message: "系统初始化完成。"'},
    {line:11,match:1,call:'log_event(404);',args:'1 个整数参数',output:'[ERROR] Code: 404'},
    {line:12,match:2,call:'log_event("Lidar", 0);',args:'字符串 + 整数，共 2 个参数',output:'[STATUS] Component: Lidar, Status: 0'}
  ];let selected=0,answered=false;
  function render(){const task=tasks[selected];document.querySelectorAll('[data-call]').forEach(b=>b.classList.toggle('active',Number(b.dataset.call)===selected));$('source').replaceChildren(...lines.map((v,i)=>{const row=document.createElement('span');row.className='line'+([task.line,...(answered?selected===0?[0,1]:selected===1?[3,4]:[6,7,8]:[])].includes(i)?' active':'');const n=document.createElement('span');n.className='n';n.textContent=String(i+1);row.append(n,document.createTextNode(v));return row}));$('signatures').replaceChildren(...sigs.map((s,i)=>{const box=document.createElement('div');box.className='signature'+(answered?(i===task.match?' matched':' dim'):'');box.textContent=`版本 ${i+1}：${s}`;return box}));$('choices').replaceChildren(...sigs.map((s,i)=>{const b=document.createElement('button');b.className='btn';b.style.margin='0 6px 7px 0';b.textContent=`版本 ${i+1}`;b.onclick=()=>answer(i);return b}));if(!answered){$('feedback').textContent='';$('feedback').className='feedback';$('reason').textContent=`当前调用：${task.call}　实参：${task.args}。先选一个版本。`;$('terminal').textContent='--- 自动驾驶日志系统 ---\n等待重载匹配...'}else{$('reason').textContent=`${task.args}，与版本 ${task.match+1} 的形参列表相符。`;$('terminal').textContent=`--- 自动驾驶日志系统 ---\n${task.output}`}}
  function answer(i){answered=true;render();const ok=i===tasks[selected].match;$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?`正确，匹配版本 ${i+1}。`:`这次调用的参数是 ${tasks[selected].args}，应选版本 ${tasks[selected].match+1}。`}
  document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.call);answered=false;render()});render();
})();
</script></body></html>
