<div class="eyebrow">项目 G · 任务 18 · 案例 60</div><h1>解决摩托车的“菱形”归属</h1>
<p class="lead">比较普通继承与虚继承，观察菱形结构中顶层基类子对象的数量。</p>

<section class="panel"><h2>沿两条路径查看顶层基类</h2><div class="controls"><button class="btn active" id="virtual">源码：两条路径均 virtual</button><button class="btn" id="ordinary">教学对照：去掉 virtual</button></div>
<div class="grid"><div class="code"><div class="codehead">ee_60/main.cpp · 关键声明与构造</div><pre id="source"></pre></div><div><h3>Motorcycle 对象中的继承关系</h3><div id="diamond" class="diamond" aria-live="polite"></div><p style="margin-top:14px">预测：<code>Motorcycle</code> 中有几份 <code>Vehicle</code> 基类子对象？</p><div class="controls"><button class="btn" data-answer="1">1 份</button><button class="btn" data-answer="2">2 份</button></div><div id="feedback" class="feedback" aria-live="polite"></div><div id="explain" class="note"></div></div></div>
<div id="terminal" class="terminal" aria-label="构造和输出示意"></div></section>
<p class="small" style="margin-top:15px">普通继承对照只帮助理解“重复的基类子对象和访问歧义”，不会真的编译改写后的 C++。源码的实际输出只对应虚继承模式。</p>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),lines=['class Vehicle { public: int vehicle_id; };','class MotorVehicle : public virtual Vehicle { ... };','class TwoWheeler : public virtual Vehicle { ... };','class Motorcycle : public MotorVehicle, public TwoWheeler {','  Motorcycle(int id, int power, std::string t)', '    : Vehicle(id), MotorVehicle(id, power), TwoWheeler(id, t) {}','  void display() { std::cout << vehicle_id; }','};','Motorcycle moto(101, 250, "运动型摩托车");','std::cout << moto.vehicle_id;'];let mode='virtual';
function render(){const shared=mode==='virtual';$('virtual').classList.toggle('active',shared);$('ordinary').classList.toggle('active',!shared);$('source').replaceChildren(...lines.map((s,i)=>{const row=document.createElement('span');row.className='line'+([1,2,5,6,9].includes(i)?' active':'');const n=document.createElement('span');n.className='n';n.textContent=String(i+1);row.append(n,document.createTextNode(!shared&&[1,2].includes(i)?s.replace('public virtual','public'):s));return row}));$('diamond').innerHTML=shared?'<div class="node shared">Vehicle（共享 1 份，ID 101）</div><div class="arrow">↙　↘</div><div><span class="node">MotorVehicle</span><span class="node">TwoWheeler</span></div><div class="arrow">↘　↙</div><div class="node">Motorcycle</div>':'<div><span class="node duplicate">Vehicle 副本 A</span><span class="node duplicate">Vehicle 副本 B</span></div><div class="arrow">↓　　　　　↓</div><div><span class="node">MotorVehicle</span><span class="node">TwoWheeler</span></div><div class="arrow">↘　↙</div><div class="node">Motorcycle</div>';$('feedback').textContent='';$('feedback').className='feedback';$('explain').textContent=shared?'两个中间类都 virtual 继承 Vehicle；创建最底层 Motorcycle 时，由 Motorcycle 构造函数负责初始化唯一的虚基类 Vehicle。中间类初始化列表里的 Vehicle(id) 对本次完整对象创建不生效。':'若去掉两个 virtual，两条路径各带来一份 Vehicle。此时 moto.vehicle_id 未指明路径会有二义性；这里只展示语言机制，不是 ee_60 的实际运行。';$('terminal').textContent=shared?'创建 Motorcycle 对象...\nVehicle::构造函数 (ID: 101)\n\n--- 摩托车信息 ---\n车辆 ID: 101\n引擎功率: 250cc\n车辆类型: 运动型摩托车\n\n直接访问ID: 101\n验证成功：对顶层基类成员的访问是唯一的。':'[教学对照，非源码运行]\n如果两条路径均改为普通继承：\nMotorcycle 含两个 Vehicle 基类子对象。\n未限定路径地访问 moto.vehicle_id 会产生二义性。'}
$('virtual').onclick=()=>{mode='virtual';render()};$('ordinary').onclick=()=>{mode='ordinary';render()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const correct=mode==='virtual'?'1':'2',ok=b.dataset.answer===correct;$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?`正确：此模式下有 ${correct} 份 Vehicle。`:`再沿两条中间类路径数一遍：此模式下是 ${correct} 份。`});render();
})();
</script></body></html>
