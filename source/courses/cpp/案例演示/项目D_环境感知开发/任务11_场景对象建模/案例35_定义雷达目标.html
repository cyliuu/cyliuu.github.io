<style>

<div class="eyebrow">项目 D · 任务 11 · 案例 35</div><h1>定义雷达目标</h1><p class="lead">逐项设置雷达目标的编号、距离和速度，观察结构体如何把三类数据组合在一起。</p><nav class="case-nav" aria-label="案例导航"><a href="../../../项目演示/项目D.html">返回项目 D</a><a href="../../../资源目录.html#case-35">返回资源总目录</a></nav><section class="case-meta" aria-label="案例知识与相关资源"><div class="case-meta-group"><span class="case-meta-label">对应知识点</span><div class="case-meta-items"><span class="case-tag">知识点 59 · 结构体</span></div></div><div class="case-meta-group"><span class="case-meta-label">相关机制页</span><div class="case-meta-items"><span class="case-empty">暂无独立机制页</span></div></div></section>
<section class="panel"><h2>从结构体定义到成员赋值</h2><div class="controls"><label>ID（int）<input id="id" type="number" step="1" value="101"></label><label>距离（float，m）<input id="distance" type="number" step="0.1" value="50.5"></label><label>速度（float，m/s）<input id="speed" type="number" step="0.1" value="20.2"></label><button class="btn primary" id="next">下一步赋值</button><button class="btn" id="reset">重置</button></div>
<div class="grid"><div class="code"><div class="codehead">ee_35/main.cpp · 结构体与对象</div><pre id="source"></pre></div><div><h3>target1 的成员</h3><div id="members" aria-live="polite"></div><div id="explain" class="note" aria-live="polite"></div><p style="margin-top:12px">思考：<code>target1.distance</code> 中，点号右边指定的是？</p><div class="controls"><button class="btn" data-answer="right">distance 成员</button><button class="btn" data-answer="wrong">另一个 RadarTarget 对象</button></div><div id="feedback" class="feedback" aria-live="polite"></div></div></div><div id="terminal" class="terminal" aria-label="格式化输出示意"></div></section>
<p class="small" style="margin-top:15px">结构体声明末尾的分号不能省略。网页中的“尚未赋值”是教学标记；原源码创建局部 <code>RadarTarget target1;</code> 后紧接着依次赋值，不能把未初始化成员当成确定的 0。</p>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),lines=['struct RadarTarget {','  int id;','  float distance;','  float speed;','};','RadarTarget target1;','target1.id = 101;','target1.distance = 50.5f;','target1.speed = 20.2f;','std::cout << target1.id;','std::cout << std::fixed << std::setprecision(1);','std::cout << target1.distance << " 米";','std::cout << target1.speed << " m/s";'];let step=0,values={};
function read(){const id=Number($('id').value),distance=Number($('distance').value),speed=Number($('speed').value);if($('id').value.trim()===''||!Number.isSafeInteger(id)||!Number.isFinite(distance)||!Number.isFinite(speed)||$('distance').value.trim()===''||$('speed').value.trim()==='')return null;return{id,distance,speed}}
function render(){const active=step===0?[0,1,2,3,4,5]:step===1?[6]:step===2?[7]:step===3?[8]:[9,10,11,12];$('source').replaceChildren(...lines.map((s,i)=>{const row=document.createElement('span');row.className='line'+(active.includes(i)?' active':'');const n=document.createElement('span');n.className='n';n.textContent=String(i+1);row.append(n,document.createTextNode(s));return row}));$('members').replaceChildren(...[['id','int',1],['distance','float',2],['speed','float',3]].map(([key,type,at])=>{const box=document.createElement('div');box.className='member'+(step===at?' active':'');box.textContent=`${type} ${key} = ${step>=at?values[key]:'尚未赋值'}`;return box}));$('explain').textContent=['已创建 target1；源码接下来用点运算符逐个访问成员。','target1.id：编号成员是 int。','target1.distance：距离成员是 float，字面量带 f 后缀。','target1.speed：速度成员是 float，单位是 m/s。','std::fixed 与 setprecision(1) 使浮点输出显示 1 位小数。'][step];$('terminal').textContent=step<4?'--- 雷达目标 1 ---\n等待三个成员完成赋值与输出...':`--- 雷达目标 1 ---\n  - ID: ${values.id}\n  - 距离: ${values.distance.toFixed(1)} 米\n  - 速度: ${values.speed.toFixed(1)} m/s`}
$('next').onclick=()=>{if(step===0){const v=read();if(!v){$('explain').textContent='请填写有效整数 ID 和有限数值的距离、速度。';return}values=v}if(step<4)step++;render()};$('reset').onclick=()=>{step=0;values={};$('feedback').textContent='';render()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.answer==='right';$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?'正确：对象名在左，成员名在右。':'点号右侧是当前结构体对象的成员名称。'});render();
})();
</script></body></html>
