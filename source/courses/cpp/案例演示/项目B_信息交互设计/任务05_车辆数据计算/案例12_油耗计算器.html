<style>:root{--bg:#f6f8fa;--text:#24292f;--muted:#57606a;--line:#d0d7de;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box}body{margin:0;padding:40px 20px;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}main{max-width:1200px;margin:auto}.eyebrow{font-size:12px;color:var(--blue);font-weight:700;text-align:center}h1{text-align:center;font-size:24px;font-weight:600;margin:2px 0 12px}h2{font-size:1.18rem;margin:0 0 12px}h3{font-size:1rem;margin:0 0 8px}p{margin:0 0 12px}.lead{max-width:900px;margin:auto;text-align:center;color:var(--muted);font-size:14px}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:14px 0 20px;font-size:13px}a{color:var(--blue)}nav a{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:8px;text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 8px 24px rgba(140,149,159,.15)}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:12px 0 18px}.controls label{font-size:14px;font-weight:600}.controls input{display:block;width:140px;margin-top:4px;padding:7px;border:1px solid var(--line);border-radius:6px}.btn{padding:10px 20px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font-size:14px;font-weight:600}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:1.08fr 1fr;gap:22px}.code{border:1px solid var(--line);border-radius:8px;overflow:hidden}.codehead{padding:9px 14px;background:#f6f8fa;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.code pre{margin:0;padding:10px 0;overflow-x:auto;font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace}.line{display:block;padding:0 14px;white-space:pre}.line.active{padding-left:11px;border-left:3px solid var(--blue);background:#f6f8fa;font-weight:700}.n{display:inline-block;width:2em;color:#8c959f;user-select:none}.note{border-left:4px solid var(--blue);background:#f6f8fa;padding:10px 13px;margin-top:13px}.terminal{background:#24292f;color:#57ab5a;border-radius:8px;padding:16px;white-space:pre-wrap;font:13px/1.6 ui-monospace,Consolas,monospace;min-height:125px;margin-top:16px}.feedback{min-height:1.5em;margin-top:8px;font-weight:700}.good{color:var(--green)}.bad{color:var(--red)}.small{color:var(--muted);font-size:14px}@media(max-width:760px){body{padding:16px 10px}.grid{grid-template-columns:1fr}.panel{padding:15px}}</style><link rel="stylesheet" href="../../../案例统一样式.css"></head><body class="case-document"><main class="case-page">
<div class="eyebrow">项目 B · 任务 05 · 案例 12</div><h1>油耗计算器</h1><p class="lead">输入油量与里程，先计算百公里油耗，再区分浮点计算结果和显示时的一位小数。</p><nav class="case-nav" aria-label="案例导航"><a href="../../../项目演示/项目B.html">返回项目 B</a><a href="../../../资源目录.html#case-12">返回资源总目录</a></nav><section class="case-meta" aria-label="案例知识与相关资源"><div class="case-meta-group"><span class="case-meta-label">对应知识点</span><div class="case-meta-items"><span class="case-tag">知识点 28 · 常量</span><span class="case-tag">知识点 29 · 算术运算符</span></div></div><div class="case-meta-group"><span class="case-meta-label">相关机制页</span><div class="case-meta-items"><span class="case-empty">暂无独立机制页</span></div></div></section>
<section class="panel"><h2>一步一步计算 L/100km</h2><div class="controls"><label>消耗油量（L）<input id="fuel" type="number" step="0.1" min="0" value="35.5"></label><label>行驶里程（km，int）<input id="distance" type="number" step="1" min="1" value="410"></label><button class="btn primary" id="calculate">计算并显示</button><button class="btn" id="reset">恢复源码值</button></div><div class="grid"><div class="code"><div class="codehead">ee_12/main.cpp · 核心语句</div><pre id="source"></pre></div><div><h3>运算阶段</h3><div id="steps" class="note" style="white-space:pre-wrap" aria-live="polite"></div><p style="margin-top:12px">为什么 <code>410</code> 是 int 仍不会发生整数除法？</p><div class="controls"><button class="btn" data-answer="right">另一个操作数是 double</button><button class="btn" data-answer="wrong">输出时 setprecision 自动修正</button></div><div id="feedback" class="feedback" aria-live="polite"></div></div></div><div id="terminal" class="terminal" aria-label="程序输出示意"></div></section><p class="small" style="margin-top:15px">改动数值是网页教学扩展。里程为 0 时网页拒绝计算，避免无意义除法；原案例把里程固定为 410，并没有这段交互输入校验。这里是教学算式，不代表真实车辆的油耗测量条件。</p>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),lines=['double fuel_consumed_liters = 35.5;','int distance_traveled_km = 410;','const double FACTOR_100 = 100.0;','double fuel_consumption =','  (fuel_consumed_liters / distance_traveled_km) * FACTOR_100;','std::cout << std::fixed << std::setprecision(1)','          << fuel_consumption << " L/100km";'];$('source').replaceChildren(...lines.map((s,i)=>{const row=document.createElement('span');row.className='line'+([3,4,5,6].includes(i)?' active':'');const n=document.createElement('span');n.className='n';n.textContent=String(i+1);row.append(n,document.createTextNode(s));return row}));function calculate(){const fuel=Number($('fuel').value),distance=Number($('distance').value);if($('fuel').value.trim()===''||$('distance').value.trim()===''||!Number.isFinite(fuel)||!Number.isInteger(distance)||fuel<0||distance<=0){$('steps').textContent='请输入非负油量，以及大于 0 的整数里程。';$('terminal').textContent='等待有效输入。';return}const ratio=fuel/distance,result=ratio*100;$('steps').textContent=`① ${fuel} L / ${distance} km = ${ratio.toFixed(6)} L/km\n② × 100.0 = ${result.toFixed(6)} L/100km\n③ std::fixed + setprecision(1) 只改变显示：${result.toFixed(1)} L/100km`;$('terminal').textContent=`--- 百公里油耗计算器 ---\n行驶里程: ${distance} km\n消耗油量: ${fuel} L\n计算出的百公里油耗为: ${result.toFixed(1)} L/100km`}$('calculate').onclick=calculate;$('reset').onclick=()=>{$('fuel').value='35.5';$('distance').value='410';calculate()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.answer==='right';$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?'正确：double 参与运算，int 会转换后进行浮点除法。':'setprecision 仅格式化输出，不决定除法类型。'});calculate();
})();
</script></body></html>
