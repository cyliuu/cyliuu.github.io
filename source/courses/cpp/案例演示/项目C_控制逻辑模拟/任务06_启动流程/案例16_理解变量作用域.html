<div class="eyebrow">项目 C · 任务 06 · 案例 16</div><h1>理解变量作用域</h1><p class="lead">进入和退出嵌套作用域，观察同名变量的遮蔽关系以及外层变量是否被改写。</p><nav class="case-nav" aria-label="案例导航"><a href="../../../项目演示/项目C.html">返回项目 C</a><a href="../../../资源目录.html#case-16">返回资源总目录</a></nav><section class="case-meta" aria-label="案例知识与相关资源"><div class="case-meta-group"><span class="case-meta-label">对应知识点</span><div class="case-meta-items"><span class="case-tag">知识点 40 · 变量作用域</span></div></div><div class="case-meta-group"><span class="case-meta-label">相关机制页</span><div class="case-meta-items"><a class="case-mechanism" href="../../../函数/变量作用域与栈帧.html">变量作用域与栈帧</a></div></div></section>
<section class="panel"><h2>逐步进入与离开临时任务</h2><div class="controls"><button class="btn primary" id="next">下一步</button><button class="btn" id="reset">重置</button></div><div class="grid"><div class="code"><div class="codehead">ee_16/main.cpp · 同名变量的两个作用域</div><pre id="source"></pre></div><div><h3>当前可见的变量</h3><div id="vars" aria-live="polite"></div><div id="explain" class="note" aria-live="polite"></div><p style="margin-top:12px">离开内层花括号后，输出哪个值？</p><div class="controls"><button class="btn" data-answer="1">1 · 正常行驶</button><button class="btn" data-answer="2">2 · 超车中</button></div><div id="feedback" class="feedback" aria-live="polite"></div></div></div><div id="terminal" class="terminal" aria-label="控制台输出示意"></div></section><p class="small" style="margin-top:15px">网页的变量卡片是可见性示意，不等同于编译器真实的栈内存布局。源代码没有给外层变量重新赋值，所谓“恢复”是内层变量消失后再次读到外层值。</p>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),lines=['int system_status = 1;','std::cout << system_status;  // 主流程：1','{','  int system_status = 2;','  std::cout << system_status;  // 临时任务：2','}','std::cout << system_status;  // 主流程：1'];let step=0;function render(){const active=[[0],[1],[3],[4],[5],[6]][step];$('source').replaceChildren(...lines.map((s,i)=>{const row=document.createElement('span');row.className='line'+(active.includes(i)?' active':'');const n=document.createElement('span');n.className='n';n.textContent=String(i+1);row.append(n,document.createTextNode(s));return row}));$('vars').replaceChildren(...[{text:'主作用域 system_status = 1',cls:step>=2&&step<=3?'dim':'active'},{text:'内层作用域 system_status = 2',cls:step>=2&&step<=3?'active':'dim'}].map(v=>{const el=document.createElement('div');el.className='var '+v.cls;el.textContent=v.text;return el}));$('explain').textContent=['创建外层变量，值为 1。','主流程读取外层变量，输出 1。','进入内层，创建同名新变量，值为 2；外层仍存在但被遮蔽。','临时任务读取最近的内层变量，输出 2。','离开花括号，内层变量不再可访问。','主流程再次读到外层变量，值仍为 1。'][step];$('terminal').textContent=['','[主流程]: 车辆当前状态: 1 (正常行驶)\n[主流程]: 准备进入临时任务(例如：超车)...','[主流程]: 车辆当前状态: 1 (正常行驶)\n[主流程]: 准备进入临时任务(例如：超车)...','[主流程]: 车辆当前状态: 1 (正常行驶)\n[主流程]: 准备进入临时任务(例如：超车)...\n  [临时任务]: 任务执行中，状态变为: 2 (超车中)','[主流程]: 车辆当前状态: 1 (正常行驶)\n[主流程]: 准备进入临时任务(例如：超车)...\n  [临时任务]: 任务执行中，状态变为: 2 (超车中)','[主流程]: 车辆当前状态: 1 (正常行驶)\n[主流程]: 准备进入临时任务(例如：超车)...\n  [临时任务]: 任务执行中，状态变为: 2 (超车中)\n[主流程]: 临时任务已完成。\n[主流程]: 车辆当前状态恢复为: 1 (正常行驶)'][step]||'等待第一步。'}$('next').onclick=()=>{step=Math.min(5,step+1);render()};$('reset').onclick=()=>{step=0;$('feedback').textContent='';render()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.answer==='1';$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?'正确：退出内层后又看见外层的 1。':'内层值 2 已离开作用域；外层始终是 1。'});render();
})();
