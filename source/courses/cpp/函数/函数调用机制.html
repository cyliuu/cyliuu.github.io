<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>函数调用机制 · 参数、栈帧与返回</title><link rel="stylesheet" href="../机制通用样式.css"><link rel="stylesheet" href="../机制交互核心.css"></head><body><main>
<div class="eyebrow">函数 · 数字资源 · 调用与返回</div><h1>函数调用机制：参数怎样进入，结果怎样回来</h1><p class="lead">用三个小函数观察实参传递、返回值、引用输出和函数指针回调。逐步查看执行位置与调用栈；图示只解释语言行为，不表示固定的内存布局。</p><nav><a href="../资源目录.html">返回课程门户</a></nav>
<section class="panel"><h2>选择调用路径</h2><div class="sim-tabs"><button class="btn" data-scene="0">普通函数：实参和返回值</button><button class="btn" data-scene="1">引用参数：额外输出通道</button><button class="btn" data-scene="2">函数指针：选择回调目标</button></div><div class="sim-layout"><div><div class="code"><div class="codehead" id="simScene"></div><pre id="simSource" class="sim-code"></pre></div><p class="notice">调用栈是逻辑模型。参数实际放在寄存器还是栈上、返回地址的具体数值及栈帧布局取决于 ABI、编译器和优化选项，不能从网页示意推断固定机器地址。</p></div><div><div class="display"><div class="sim-state" id="simState"></div><div id="simMemory" class="sim-memory"></div></div><div id="simOutput" class="terminal sim-output" aria-live="polite"></div></div></div><div class="toolbar"><button class="btn" id="simPrev">上一步</button><button class="btn primary" id="simNext">下一步</button><button class="btn" id="simReset">重置当前场景</button><span class="sim-step" id="simStep"></span></div><div class="notice" id="simTrace" aria-live="polite"></div></section><section class="panel"><h2>判断题</h2><p>一个函数同时返回 <code>bool</code> 并带两个 <code>int&amp;</code> 输出参数时，三条输出通道分别做什么？</p><div class="quiz"><button class="btn" data-answer="right">返回值标记成功，引用写回两个限值</button><button class="btn" data-answer="wrong">三个数值都通过 return 传出</button></div><div id="simFeedback" class="feedback" aria-live="polite"></div></section><p class="small">页面只推演函数调用规则，不实际调用 C++ 函数。</p>
</main><script>window.mechanismLesson={scenes:[
{name:'刹车距离函数',code:['double calculate_braking_distance(double speed_kmh) {','    double speed_mps = speed_kmh / 3.6;','    double distance = pow(speed_mps, 2) / 9.0;','    return distance;','}','double required = calculate_braking_distance(60.0);'],steps:[{title:'main 准备实参',lines:[6],memory:[{name:'main 调用上下文',value:'speed = 60.0 km/h'}],explain:'调用表达式把 60.0 交给形参 speed_kmh。',output:'准备计算 60 km/h 的刹车距离。'},{title:'进入函数',lines:[1],memory:[{name:'main 调用上下文',value:'等待返回值'},{name:'calculate_braking_distance',value:'speed_kmh = 60.0',tone:'good'}],explain:'新的一次函数调用开始。图中分层表示嵌套执行，不指定真实机器栈布局。',output:'进入函数体。'},{title:'计算中间值',lines:[2,3],memory:[{name:'形参 speed_kmh',value:'60.0'},{name:'局部 speed_mps',value:'约 16.667 m/s'},{name:'局部 distance',value:'约 30.864 m',tone:'good'}],explain:'先把 km/h 除以 3.6，再按 v²/(2×4.5) 计算。',output:'距离约 30.864 米。'},{title:'返回并继续 main',lines:[4,6],memory:[{name:'main 的 required',value:'约 30.864 m',tone:'good'},{name:'函数局部对象',value:'调用结束后不再有效',tone:'warning'}],explain:'return 把计算结果交还给调用表达式；调用方继续后续语句。',output:'required_distance 接收返回值。'}]},
{name:'bool 与引用输出',code:['bool get_speed_limits(int& lo, int& hi) {','    lo = 30;','    hi = 120;','    return true;','}','int min_limit=0, max_limit=0;','bool ok=get_speed_limits(min_limit,max_limit);'],steps:[{title:'调用前两个变量为 0',lines:[6],memory:[{name:'min_limit',value:'0'},{name:'max_limit',value:'0'}],explain:'两个调用方变量已经存在。',output:'调用前：0，0。'},{title:'引用形参绑定对象',lines:[1,7],memory:[{name:'lo',value:'别名 → min_limit'},{name:'hi',value:'别名 → max_limit'}],explain:'形参不是要另行返回的副本，而是调用方变量的引用。',output:'进入 get_speed_limits。'},{title:'写回两个限值',lines:[2,3],memory:[{name:'min_limit',value:'30',tone:'good'},{name:'max_limit',value:'120',tone:'good'}],explain:'给 lo、hi 赋值立即改变各自绑定的原变量。',output:'限值已写回。'},{title:'返回查询状态',lines:[4,7],memory:[{name:'ok',value:'true',tone:'good'},{name:'min_limit / max_limit',value:'30 / 120'}],explain:'bool 单独报告查询成功；两个整数走引用输出通道。',output:'成功：30～120。'}]},
{name:'函数指针回调',code:['void (*throttle_strategy)();','if (mode == \'E\') throttle_strategy=gentle_throttle;','else if (mode == \'S\') throttle_strategy=aggressive_throttle;','else throttle_strategy=gentle_throttle;','throttle_strategy();'],steps:[{title:'声明回调指针',lines:[1],memory:[{name:'throttle_strategy',value:'尚未设置目标',tone:'warning'}],explain:'声明后必须先赋有效函数地址才能调用。',output:'等待模式输入。'},{title:'输入 E，选择经济模式',lines:[2],memory:[{name:'mode',value:'E'},{name:'throttle_strategy',value:'→ gentle_throttle',tone:'good'}],explain:'程序按输入选择一个与 void() 签名兼容的目标函数。',output:'经济模式已选定。'},{title:'通过指针调用',lines:[5],memory:[{name:'当前调用目标',value:'gentle_throttle()',tone:'good'},{name:'另一个函数',value:'aggressive_throttle() 未执行'}],explain:'调用点写的是统一的 throttle_strategy()；实际执行哪个函数取决于此前赋值。',output:'执行经济模式：平缓加速。'}]}
],feedback:{right:'正确。bool 返回查询状态，两个 int& 负责把值写回调用者变量。',wrong:'该函数仅 return 一个 bool；另外两个输出经引用参数写回。'}};</script><script src="../机制交互核心.js"></script></body></html>
