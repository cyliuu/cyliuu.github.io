<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>函数重载匹配规则 · 日志与车辆操作</title><link rel="stylesheet" href="../机制通用样式.css"><link rel="stylesheet" href="../机制交互核心.css"></head><body><main>
<div class="eyebrow">函数 · 数字资源 · 编译期选择</div><h1>函数重载匹配：同名调用怎样选中实现</h1><p class="lead">比较同名函数的候选集、可行性和隐式转换序列，观察编译期怎样选中一个实现。网页按规则推演，不在浏览器编译 C++。</p><nav><a href="../资源目录.html">返回课程门户</a></nav>
<section class="panel"><h2>选择调用场景</h2><div class="sim-tabs"><button class="btn" data-scene="0">日志重载</button><button class="btn" data-scene="1">成员函数重载</button><button class="btn" data-scene="2">拓展 · 指针模板与特例化</button></div><div class="sim-layout"><div><div class="code"><div class="codehead" id="simScene"></div><pre id="simSource" class="sim-code"></pre></div><p class="notice">模板特例化不是“找到任何更精确版本就直接优先”。先在普通重载与主模板等候选中完成重载决议；若选中对应函数模板，再由匹配的显式特例化提供实现。具体例子以所示声明为前提。</p></div><div><div class="display"><div class="sim-state" id="simState"></div><div id="simMemory" class="sim-memory"></div></div><div id="simOutput" class="terminal sim-output" aria-live="polite"></div></div></div><div class="toolbar"><button class="btn" id="simPrev">上一步</button><button class="btn primary" id="simNext">下一步</button><button class="btn" id="simReset">重置当前场景</button><span id="simStep" class="sim-step"></span></div><div id="simTrace" class="notice" aria-live="polite"></div></section><section class="panel"><h2>判断题</h2><p><code>零参数与单个 <code>double</code> 参数的同名调用，如何分别选中重载？</p><div class="quiz"><button class="btn" data-answer="wrong">随机选中一个实现</button><button class="btn" data-answer="right">按参数个数和类型选择对应实现</button></div><div id="simFeedback" class="feedback" aria-live="polite"></div></section><p class="small">本页只解释重载规则。网页展示编译期选择结果，不在浏览器编译 C++；编译诊断文字可能因编译器而异。</p>
</main><script>window.mechanismLesson={scenes:[
{name:'三个 log_event 重载',code:['void log_event(const std::string& message);','void log_event(int error_code);','void log_event(const std::string& component,int status);','log_event("系统初始化完成。");','log_event(404);','log_event("Lidar",0);'],steps:[{title:'一个字符串实参',lines:[1,4],memory:[{name:'调用形状',value:'log_event(字符串字面量)'},{name:'选中',value:'log_event(const std::string&)',tone:'good'}],explain:'字面量可构造 std::string；在所示三个重载中，只有单参数字符串版本可行。',output:'[INFO] Message: "系统初始化完成。"'},{title:'一个整数实参',lines:[2,5],memory:[{name:'调用形状',value:'log_event(404)'},{name:'选中',value:'log_event(int)',tone:'good'}],explain:'参数个数与 int 类型匹配。',output:'[ERROR] Code: 404'},{title:'字符串加整数',lines:[3,6],memory:[{name:'调用形状',value:'log_event("Lidar",0)'},{name:'选中',value:'log_event(const std::string&,int)',tone:'good'}],explain:'两个参数，选中二参数版本；单参数版本不是可行候选。',output:'[STATUS] Component: Lidar, Status: 0'}]},
{name:'accelerate 成员重载',code:['void accelerate();','void accelerate(double amount);','Vehicle my_car(101);','my_car.accelerate();','my_car.accelerate(20.0);'],steps:[{title:'对象初始速度为 0',lines:[3],memory:[{name:'my_car',value:'ID=101，speed=0'}],explain:'两个 accelerate 同名，但参数列表不同。',output:'当前速度 0 km/h。'},{title:'无参数调用',lines:[1,4],memory:[{name:'选中版本',value:'accelerate()',tone:'good'},{name:'my_car.speed',value:'5 km/h'}],explain:'无实参时只匹配无参数版本，源码默认增加 5.0。',output:'默认加速 5.0 km/h。'},{title:'double 参数调用',lines:[2,5],memory:[{name:'选中版本',value:'accelerate(double)',tone:'good'},{name:'my_car.speed',value:'25 km/h'}],explain:'传入 20.0，速度在已有 5 的基础上再增加 20。',output:'指定加速 20.0 km/h。'}]},
{name:'拓展 · 普通重载、指针模板与特例化',code:['void print(int);','template<class T> void print(T*);','template<> void print<const char>(const char*);','print(10);','print("Hi");','print(3.14);','// print(MySensor{}); // 无可行重载'],steps:[{title:'print(10) 命中 int',lines:[1,4],memory:[{name:'调用实参',value:'int 10'},{name:'结果',value:'普通 print(int)',tone:'good'}],explain:'int 重载精确匹配；T* 模板不接受非指针 int。',output:'Integer'},{title:'print("Hi") 走指针模板特例化',lines:[2,3,5],memory:[{name:'调用实参',value:'const char[3]，可作为 const char* 实参'},{name:'结果',value:'T=const char 的模板特例化',tone:'good'}],explain:'主模板的 T* 候选可推导 T=const char；选中该模板后使用匹配的显式特例化实现。',output:'String Spec'},{title:'print(3.14) 可转换为 int',lines:[1,6],memory:[{name:'调用实参',value:'double 3.14'},{name:'结果',value:'print(int)，值转换为 3',tone:'warning'}],explain:'指针模板不可行；double 到 int 的标准转换可使普通函数可行。是否发出编译警告由编译器与选项决定。',output:'Integer'},{title:'MySensor 无可行重载',lines:[7],memory:[{name:'调用实参',value:'MySensor{}'},{name:'结果',value:'编译期无匹配',tone:'warning'}],explain:'既不是 int，也不能按 T* 推导；若真正取消注释调用，程序编译失败。',output:'此行注释时程序可编译；启用后出现诊断。'}]}
],feedback:{right:'正确。两个调用在编译期分别匹配可行的成员函数重载。',wrong:'重载匹配依赖候选函数与实参类型，不按调用出现顺序选择。'}};</script><script src="../机制交互核心.js"></script></body></html>
