<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>函数递归调用 · 车辆轨迹预测</title><link rel="stylesheet" href="../机制通用样式.css"><link rel="stylesheet" href="../机制交互核心.css"></head><body><main>
<div class="eyebrow">函数 · 数字资源 · 递归调用</div><h1>函数递归调用：轨迹预测怎样逐层展开</h1><p class="lead">设置初始位置、速度、加速度和递归层数，逐步观察参数变化、终止条件与逐层返回。每次调用的局部状态相互独立。</p><nav><a href="../资源目录.html">返回课程门户</a><a href="变量作用域与栈帧.html">变量作用域与栈帧</a></nav>
<section class="panel"><h2>单步观察调用链与回返</h2><div class="sim-tabs"><button class="btn" data-scene="0">源码初值：预测 3 秒</button></div><div class="sim-layout"><div><div class="code"><div class="codehead" id="simScene"></div><pre id="simSource" class="sim-code"></pre></div><div class="notice">每次调用把 <code>seconds_left</code> 减 1。当前例在 3→2→1→0 时命中终止条件，然后逐层返回 39 m；不能只画“向下调用”而漏掉返回阶段。</div></div><div><div class="display"><div class="sim-state" id="simState"></div><div id="simMemory" class="sim-memory"></div></div><div id="simOutput" class="terminal sim-output" aria-live="polite"></div></div></div><div class="toolbar"><button class="btn" id="simPrev">上一步</button><button class="btn primary" id="simNext">下一步</button><button class="btn" id="simReset">重置</button><span class="sim-step" id="simStep"></span></div><div id="simTrace" class="notice" aria-live="polite"></div></section><section class="panel"><h2>判断题</h2><p>示例 中 <code>seconds_left</code> 到 0 时，还会再预测一秒吗？</p><div class="quiz"><button class="btn" data-answer="wrong">会，再计算一次位移</button><button class="btn" data-answer="right">不会，直接返回当前位置</button></div><div id="simFeedback" class="feedback" aria-live="polite"></div></section><p class="small">网页只重现源码推导；如果预测时间无限增长，真实程序还会受调用深度、内存和实现限制，不能把递归当作无界循环。</p>
</main><script>window.mechanismLesson={scenes:[{name:'predict_distance',code:['double predict_distance(pos,speed,a,seconds_left) {','    if (seconds_left <= 0) return pos;','    double step = speed + 0.5*a;','    double next_pos = pos + step;','    double next_speed = speed + a;','    return predict_distance(next_pos,next_speed,a,seconds_left-1);','}'],steps:[
{title:'进入第 1 层：剩余 3 秒',lines:[1],memory:[{name:'调用 1',value:'pos=0，speed=10，seconds_left=3',tone:'good'}],explain:'从 main 进入函数，当前层拥有自己的形参值。',output:'正在计算剩余 3 秒… 当前位置 0 m。'},
{title:'算出第 1 秒后的状态',lines:[3,4,5,6],memory:[{name:'调用 1',value:'step=10+1=11 m；next_pos=11，next_speed=12'}],explain:'以 1 秒为时间步，位移 v×1+0.5×a×1²=11 m。随后带着新状态再次调用。',output:'准备递归：pos=11，speed=12，left=2。'},
{title:'进入第 2 层：剩余 2 秒',lines:[1,3,4,5,6],memory:[{name:'调用 1',value:'等待调用 2 返回'},{name:'调用 2',value:'pos=11，speed=12；step=13；next_pos=24，next_speed=14',tone:'good'}],explain:'调用 1 暂停，调用 2 独立持有自己的参数。',output:'正在计算剩余 2 秒… 当前位置 11 m。'},
{title:'进入第 3 层：剩余 1 秒',lines:[1,3,4,5,6],memory:[{name:'调用 1',value:'等待'},{name:'调用 2',value:'等待'},{name:'调用 3',value:'pos=24，speed=14；step=15；next_pos=39，next_speed=16',tone:'good'}],explain:'第 3 秒位移为 14+1=15 m，位置到 39 m。',output:'正在计算剩余 1 秒… 当前位置 24 m。'},
{title:'第 4 层命中终止条件',lines:[1,2],memory:[{name:'调用 1～3',value:'等待最深层返回'},{name:'调用 4',value:'pos=39，seconds_left=0',tone:'good'}],explain:'条件 seconds_left<=0 成立，直接 return current_pos；这一层不再计算位移。',output:'命中终止条件，返回 39 m。'},
{title:'逐层返回到 main',lines:[6],memory:[{name:'调用 4 → 3 → 2 → 1',value:'各层依次把 39 m 返回上层',tone:'good'},{name:'main',value:'final_position=39 m'}],explain:'每一层的 return 调用表达式得到 39，最终交给 main。',output:'预测结果：3 秒后位置 39 米。'}]}],feedback:{right:'正确。0 是终止条件，直接返回当前的 39 m。',wrong:'当 seconds_left<=0 时立即 return pos，不再计算下一秒位移。'}};</script><script src="../机制交互核心.js"></script></body></html>
