<style>
:root{--bg:#f6f8fa;--text:#24292f;--muted:#57606a;--line:#d0d7de;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box}body{margin:0;padding:40px 20px;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}main{max-width:1200px;margin:auto}.eyebrow{font-size:12px;color:var(--blue);font-weight:700;text-align:center}h1{text-align:center;font-size:24px;font-weight:600;margin:2px 0 12px}h2{font-size:1.18rem;margin:0 0 12px}h3{font-size:1rem;margin:0 0 8px}p{margin:0 0 12px}.lead{max-width:900px;margin:auto;text-align:center;color:var(--muted);font-size:14px}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:14px 0 20px;font-size:13px}a{color:var(--blue)}nav a{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:8px;text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 8px 24px rgba(140,149,159,.15)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.btn{padding:10px 20px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font-size:14px;font-weight:600}.btn.active,.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn:hover:not(.active){border-color:var(--blue)}.grid{display:grid;grid-template-columns:1.08fr 1fr;gap:22px}.code{border:1px solid var(--line);border-radius:8px;overflow:hidden}.codehead{padding:9px 14px;background:#f6f8fa;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.code pre{margin:0;padding:10px 0;overflow-x:auto;font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace}.line{display:block;padding:0 14px;white-space:pre}.line.active{padding-left:11px;border-left:3px solid var(--blue);background:#f6f8fa;font-weight:700}.n{display:inline-block;width:2em;color:#8c959f;user-select:none}.note{border-left:4px solid var(--b <div class="eyebrow">项目 F · 任务 17 · 案例 56</div><h1>优雅地定义车辆操作</h1><p class="lead">分别观察成员函数重载和运算符重载，区分修改原对象与生成新对象。</p>
<nav class="case-nav" aria-label="案例导航"><a href="../../../项目演示/项目F.html">返回项目 F</a><a href="../../../资源目录.html#case-56">返回资源总目录</a></nav><section class="case-meta" aria-label="案例知识与相关资源"><div class="case-meta-group"><span class="case-meta-label">对应知识点</span><div class="case-meta-items"><span class="case-tag">知识点 91 · 成员函数重载</span><span class="case-tag">知识点 92 · 运算符重载</span></div></div><div class="case-meta-group"><span class="case-meta-label">相关机制页</span><div class="case-meta-items"><a class="case-mechanism" href="../../../函数/函数重载匹配规则.html">函数重载匹配规则</a></div></div></section>
<section class="panel"><h2>比较“改原对象”和“产生新对象”</h2><div class="controls"><button class="btn active" data-variant="1">版本 1：accelerate 函数重载</button><button class="btn" data-variant="2">版本 2：+ 与 &lt;&lt; 运算符重载</button></div><div id="actions" class="controls"></div>
<div class="grid"><div class="code"><div class="codehead" id="codehead"></div><pre id="source"></pre></div><div><h3>对象状态</h3><div id="state" class="note" aria-live="polite"></div><p id="question"></p><div id="answers" class="controls"></div><div id="feedback" class="feedback" aria-live="polite"></div></div></div><div id="terminal" class="terminal" aria-label="控制台输出示意"></div></section><p class="small" style="margin-top:15px">版本 1 的 <code>accelerate()</code> 固定加 5.0 km/h，<code>accelerate(20.0)</code> 再加 20.0 km/h。版本 2 的 <code>my_car + 20.0</code> 返回新的 <code>Vehicle</code>，原车仍为 60.0 km/h；友元 <code>&lt;&lt;</code> 只是格式化输出。</p>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const code1=['Vehicle my_car(101);  // speed_ = 0.0','void accelerate() { speed_ += 5.0; }','void accelerate(double amount) { speed_ += amount; }','my_car.display();','my_car.accelerate();','my_car.display();','my_car.accelerate(20.0);','my_car.display();'];const code2=['Vehicle my_car(101, 60.0);','Vehicle operator+(const Vehicle& vehicle, double amount) {','  return Vehicle(vehicle.get_id(), vehicle.get_speed() + amount);','}','std::ostream& operator<<(std::ostream& os, const Vehicle& v) {','  os << "车辆状态 | ID: " << v.id_ << ", 速度: " << v.speed_;','  return os;','}','Vehicle faster_car = my_car + 20.0;','std::cout << faster_car << my_car;'];let variant=1,step=0,answered=false;
function code(lines,active){$('source').replaceChildren(...lines.map((s,i)=>{const row=document.createElement('span');row.className='line'+(active.includes(i)?' active':'');const n=document.createElement('span');n.className='n';n.textContent=String(i+1);row.append(n,document.createTextNode(s));return row}))}
function action(text,fn,disabled=false){const b=document.createElement('button');b.className='btn';b.textContent=text;b.disabled=disabled;b.onclick=fn;return b}
function render(){document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',Number(b.dataset.variant)===variant));$('feedback').textContent='';$('feedback').className='feedback';if(variant===1){$('codehead').textContent='variant_1/main_task1.cpp · 成员函数重载';code(code1,step===0?[0,1,2]:step===1?[1,4]:[2,6]);$('actions').replaceChildren(action('① accelerate()',()=>{step=1;render()} ,step!==0),action('② accelerate(20.0)',()=>{step=2;render()},step!==1),action('重置版本 1',()=>{step=0;render()}));const speed=step===0?0:step===1?5:25;$('state').textContent=`Vehicle(101)\nmy_car.speed_ = ${speed.toFixed(1)} km/h\n两次调用都修改同一个 my_car。`;$('question').textContent='当前调用由什么决定选中哪一个 accelerate？';$('answers').replaceChildren(action('参数个数 / 类型',()=>answer(true)),action('返回值类型',()=>answer(false)));$('terminal').textContent=`  -> 当前状态 | ID: 101, 速度: 0 km/h\n${step>=1?'[调用 accelerate()]: 默认加速 5.0 km/h\n  -> 当前状态 | ID: 101, 速度: 5 km/h\n':''}${step>=2?'[调用 accelerate(double)]: 指定加速 20 km/h\n  -> 当前状态 | ID: 101, 速度: 25 km/h':''}`;}else{$('codehead').textContent='variant_2/main_task2.cpp · 运算符重载';code(code2,step===0?[0,1,2,4,5]:[1,2,8,9]);$('actions').replaceChildren(action('执行 my_car + 20.0',()=>{step=1;render()},step!==0),action('重置版本 2',()=>{step=0;render()}));$('state').textContent=step===0?'my_car：ID 101，速度 60.0 km/h\nfaster_car：尚未创建':`my_car：ID 101，速度 60.0 km/h（不变）\nfaster_car：ID 101，速度 80.0 km/h（新对象）`;$('question').textContent='执行 + 后，原车 my_car 的速度会改变吗？';$('answers').replaceChildren(action('会，变为 80',()=>answer(false)),action('不会，仍为 60',()=>answer(true)));$('terminal').textContent=`初始状态:   -> 车辆状态 | ID: 101, 速度: 60 km/h${step?'\n加速后(新对象):   -> 车辆状态 | ID: 101, 速度: 80 km/h\n原对象状态(不变):   -> 车辆状态 | ID: 101, 速度: 60 km/h':''}`}}
function answer(ok){$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?'判断正确。':variant===1?'返回值不用于区分这两个重载；应看实参列表。':'operator+ 返回新 Vehicle，原 my_car 仍为 60 km/h。'}document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=Number(b.dataset.variant);step=0;render()});render();
})();
</script></body></html>
