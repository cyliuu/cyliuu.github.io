<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>简单排序算法 · 故障码序列逐步比较</title><link rel="stylesheet" href="../机制通用样式.css"><style>.bar-chart{display:flex;align-items:end;gap:10px;min-height:230px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fafbfc}.bar-wrap{flex:1;display:grid;justify-items:center;gap:6px}.bar{width:min(100%,70px);min-height:25px;background:#8bcbf0;border:1px solid #54aeff;border-radius:6px 6px 0 0;transition:height .25s}.bar.active{background:#f2cc60;border-color:#bf8700}.bar.sorted{background:#7ee2a8;border-color:#1a7f37}.bar-label{font:700 14px ui-monospace,Consolas,monospace}.tabset{display:flex;flex-wrap:wrap;gap:7px}.tabset .active{background:var(--blue);border-color:var(--blue);color:#fff}</style></head><body><main>
<div class="eyebrow">数组与容器 · 主题拓展 · 比较排序</div><h1>简单排序算法：故障码怎样重排</h1><p class="lead">对同一组整数分别执行冒泡、选择和插入排序，逐步比较交换、选最小值与元素右移发生的时机。</p><nav><a href="../资源目录.html">返回课程门户</a><a href="Vector容量与扩容.html">Vector 容量与扩容</a></nav>
<section class="panel"><h2>算法与数据</h2><p class="small">本页使用五个独立示例数值比较三种排序步骤，观察比较、交换和移动元素的过程。</p><div class="toolbar"><div class="tabset"><button class="btn" data-algo="bubble">冒泡排序</button><button class="btn" data-algo="selection">选择排序</button><button class="btn" data-algo="insertion">插入排序</button></div><button class="btn" id="prev">上一步</button><button class="btn primary" id="next">下一步</button><button class="btn" id="reset">重置数据</button></div><div class="grid"><div><div id="bars" class="bar-chart" role="img" aria-label="故障码柱状图"></div><div class="notice" id="status" aria-live="polite"></div></div><div><div class="code"><div class="codehead">排序后数组与当前阶段</div><pre id="array" aria-live="polite"></pre></div><div class="terminal" id="trace" aria-live="polite"></div></div></div></section><section class="panel"><h2>判断题</h2><p>选择排序每轮主要做什么？</p><div class="quiz"><button class="btn" data-answer="right">在未排序区找最小值，放到本轮起点</button><button class="btn" data-answer="wrong">只比较相邻两个元素并交换</button></div><div class="feedback" id="feedback" aria-live="polite"></div></section><p class="small">比较次数、交换次数随数据和实现细节变化。本页展示三种教学实现的每一步，不代表性能基准或真实图像处理流程。</p>
</main><script>(()=>{'use strict';const $=id=>document.getElementById(id),initial=[42,18,35,11,27];let algorithm='bubble',steps=[],index=0;function snapshot(a,active,note,sorted=[]){steps.push({array:[...a],active,sorted,note})}function build(){const a=[...initial];steps=[];snapshot(a,[],'原始故障码顺序。');if(algorithm==='bubble'){for(let i=0;i<a.length-1;i++){for(let j=0;j<a.length-1-i;j++){const swapped=a[j]>a[j+1];if(swapped)[a[j],a[j+1]]=[a[j+1],a[j]];snapshot(a,[j,j+1],`第 ${i+1} 轮：比较相邻 ${j}、${j+1}，${swapped?'左值较大，交换。':'顺序正确，不交换。'}`,Array.from({length:i},(_,k)=>a.length-1-k))}}}else if(algorithm==='selection'){for(let i=0;i<a.length-1;i++){let m=i;for(let j=i+1;j<a.length;j++){if(a[j]<a[m])m=j;snapshot(a,[m,j],`第 ${i+1} 轮：扫描未排序区，当前最小值位于索引 ${m}。`,Array.from({length:i},(_,k)=>k))}if(m!==i)[a[i],a[m]]=[a[m],a[i]];snapshot(a,[i,m],`把本轮最小值放到索引 ${i}。`,Array.from({length:i+1},(_,k)=>k))}}else{for(let i=1;i<a.length;i++){const key=a[i];let j=i-1;while(j>=0&&a[j]>key){a[j+1]=a[j];snapshot(a,[j,j+1],`第 ${i+1} 个值 ${key}：把较大的 ${a[j]} 向右移动。`,Array.from({length:i},(_,k)=>k));j--}a[j+1]=key;snapshot(a,[j+1,i],`将 ${key} 插入索引 ${j+1}，前 ${i+1} 个值已有序。`,Array.from({length:i+1},(_,k)=>k))}}snapshot(a,[],'排序完成：全部故障码按从小到大排列。',a.map((_,i)=>i));index=0;draw()}function draw(){const step=steps[index];$('bars').replaceChildren(...step.array.map((v,i)=>{const wrap=document.createElement('div');wrap.className='bar-wrap';const bar=document.createElement('div');bar.className='bar'+(step.active.includes(i)?' active':'')+(step.sorted.includes(i)?' sorted':'');bar.style.height=(25+v*3)+'px';const label=document.createElement('span');label.className='bar-label';label.textContent=String(v);wrap.append(bar,label);return wrap}));$('array').textContent='['+step.array.join(', ')+']';$('status').textContent=step.note;$('trace').textContent='算法：'+({bubble:'冒泡排序',selection:'选择排序',insertion:'插入排序'})[algorithm]+'\n步骤：'+(index+1)+' / '+steps.length+'\n黄色：本步关注；绿色：已确认有序区。';$('prev').disabled=index===0;$('next').disabled=index===steps.length-1;document.querySelectorAll('[data-algo]').forEach(b=>{const active=b.dataset.algo===algorithm;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}document.querySelectorAll('[data-algo]').forEach(b=>b.onclick=()=>{algorithm=b.dataset.algo;build()});$('prev').onclick=()=>{if(index>0){index--;draw()}};$('next').onclick=()=>{if(index<steps.length-1){index++;draw()}};$('reset').onclick=build;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.answer==='right';$('feedback').textContent=ok?'正确。选择排序每轮确定一个最终位置。':'相邻比较与交换是这里的冒泡排序特征。';$('feedback').className='feedback '+(ok?'good':'bad')});build()})();</script></body></html>
